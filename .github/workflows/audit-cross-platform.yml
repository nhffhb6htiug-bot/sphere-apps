name: Sphere cross-platform smoke tests

on:
  push:
    paths:
      - "index.html.html"
      - "sw.js"
      - "tests/unit/sw_cache_safety.test.mjs"
      - "android-native/**"
      - "tests/audit-static.mjs"
      - "tests/audit-browser.mjs"
      - "tests/audit-authenticated.mjs"
      - "tests/browser/fixtures/chat_mock.js"
      - ".github/workflows/audit-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static source and security regression tests
        run: node tests/audit-static.mjs
      - name: Service-worker performance and privacy regression tests
        run: node --test tests/unit/sw_cache_safety.test.mjs
      - name: Install pinned browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium and WebKit browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Android, Safari-like, tablet and PC smoke tests
        run: node tests/audit-browser.mjs
      - name: Logged-in client, editor and admin route matrix (mocked)
        run: node tests/audit-authenticated.mjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphere-cross-platform-smoke
          path: tests/audit-screenshots/
          if-no-files-found: ignore
