# Builds the real Kotlin/Jetpack Compose Android app on every native code push.
# Signing secrets are stored only in GitHub Actions Secrets, never in this repo.
name: Build Sphere Android app

on:
  push:
    branches:
      - release/native-compose-no-webview-20261110
    paths:
      - "android-native/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphere-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout native Sphere source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Allocate a unique Play Store versionCode
        shell: bash
        run: |
          echo "SPHERE_CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Configure release upload key if provided
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SPHERE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SPHERE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPHERE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPHERE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK will build, but the signed Play AAB needs all four SPHERE_RELEASE_* repository secrets."
          else
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sphere-upload.jks"
            keytool -list -keystore "$RUNNER_TEMP/sphere-upload.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "SPHERE_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/sphere-upload.jks" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native debug APK
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Build native signed release APK and Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android-native
        env:
          SPHERE_RELEASE_STORE_PASSWORD: ${{ secrets.SPHERE_RELEASE_STORE_PASSWORD }}
          SPHERE_RELEASE_KEY_ALIAS: ${{ secrets.SPHERE_RELEASE_KEY_ALIAS }}
          SPHERE_RELEASE_KEY_PASSWORD: ${{ secrets.SPHERE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: Verify release APK and AAB signatures
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/release/app-release.apk"
          AAB="android-native/app/build/outputs/bundle/release/app-release.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          RESULT="$(jarsigner -verify "$AAB" 2>&1)"
          echo "$RESULT"
          echo "$RESULT" | grep -q "jar verified."

      - name: Build unsigned AAB if signing is not yet configured
        if: steps.signing.outputs.ready != 'true'
        working-directory: android-native
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Native-Debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Native-Release-APK
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed native Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Native-PlayStore-AAB
          path: android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload UNSIGNED AAB for offline signing only
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Native-UNSIGNED-AAB-NOT-FOR-PLAY
          path: android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
