// ---- Work + rating numbers for one editor (from jobs assigned to them + reviews)
async function loadEditorWork(user){
  const [mine, rates] = await Promise.all([
    sb.from('sp_jobs').select('*').eq('assigned_editor', user.id).order('created_at', { ascending: false }),
    sb.from('sp_ratings').select('stars, review, created_at').eq('editor_id', user.id).order('created_at', { ascending: false })
  ]);
  const jobs = (mine.data || []).map(mapJob);
  await loadWorkFor(jobs.filter(j => EDITOR_ACTIVE.includes(j.status)).map(j => j.id));
  const r = rates.data || [];
  const done = jobs.filter(j => EDITOR_DONE.includes(j.status));
  return {
    ok: !mine.error,
    jobs,
    active: jobs.filter(j => EDITOR_ACTIVE.includes(j.status)),
    done,
    earned: done.reduce((t, j) => t + Number(j.editorAmount || editorShare(j.lockedAmount || j.budget)), 0),
    rating: r.length ? Math.round(r.reduce((t, x) => t + Number(x.stars || 0), 0) / r.length * 10) / 10 : 0,
    reviews: r.length,
    lastReviews: r.filter(x => x.review).slice(0, 3)
  };
}
function editorJobAction(j, user){
  if(j.status === 'negotiating' && j.proposedBy && j.proposedBy !== user.id) return 'The client sent a price — reply';
  const w = WORK_CACHE[j.id];
  if(j.status === 'in-progress' && w){
    if(w.phase === 'preview') return 'Preview sent — waiting for the client';
    if(w.pending_extension_hours) return 'Waiting for the client to answer your time request';
    const st = workState(w);
    if(st.key === 'late') return 'LATE — send the preview now';
    if(st.key === 'grace') return 'Deadline passed — send the preview in the grace time';
    return 'Send the preview — ' + st.short;
  }
  if(j.status === 'in-progress') return 'Work on it and deliver the video';
  return '';
}
function editorJobCard(j, user){
  const m = EDITOR_STATUS[isExpired(j) ? 'refunded' : j.status] || EDITOR_STATUS.open;
  const label = isExpired(j) ? 'Expired' : m.label;
  const action = j.assignedEditor === user.id ? editorJobAction(j, user) : '';
  const amount = j.assignedEditor === user.id && j.lockedAmount ? Number(j.editorAmount || editorShare(j.lockedAmount)) : Number(j.budget || 0);
  return `<div class="card cl-proj ${action ? 'cl-action' : ''}" onclick="openJob('${esc(j.id)}')">
    <div class="cl-proj-top"><b>${esc(j.title || j.category || 'Project')}</b><span class="cl-status" style="color:${m.color}; background:${m.bg};">${esc(label)}</span></div>
    ${j.title ? `<p class="muted" style="font-size:12px; margin-top:2px;">${esc(j.category)}</p>` : ''}
    <p class="muted">${esc(j.desc).slice(0, 70)}${j.desc.length > 70 ? '…' : ''}</p>
    ${action ? `<p class="cl-action-txt">👉 ${esc(action)}</p>` : ''}
    ${j.assignedEditor === user.id ? workChip(WORK_CACHE[j.id], j) : ''}
    <p class="muted">${j.assignedEditor === user.id && j.lockedAmount ? 'You get ' : 'Budget '}${rupees(amount)}${j.deadline ? ' · Due ' + fmtDate(j.deadline) : ''}</p>
  </div>`;
}

async function edReview(id, action){
  if(needPin()) return;
  let note = null;
  if(action === 'reject'){
    note = prompt('Reason for rejecting (the editor will see this):', '');
    if(note === null) return;
    if(!note.trim()){ alert('Please write a reason.'); return; }
  } else if(action === 'reject_fee'){
    note = prompt('Message for the editor (optional):', 'We could not find your verification payment. Please check the transaction ID and submit it again.');
    if(note === null) return;
  } else if(!confirm({ confirm_fee: 'Mark the ₹' + VERIFY_FEE + ' fee as received?', reopen: 'Re-open this application?' }[action])) return;
  const { error } = await sb.rpc('sp_ed_review', { p_editor: id, p_action: action, p_note: note, p_pin: ADMIN_PIN });
  if(error){ alert(error.message); if(/PIN/i.test(error.message)){ ADMIN_PIN = ''; nav('admin'); } return; }

  };

    // database not updated yet (005) — post with the original fields

    const extra = [v.video_length && 'Length: ' + v.video_length, v.video_format && 'Format: ' + v.video_format, v.style_notes && 'Style: ' + v.style_notes, v.reference_links && 'References: ' + v.reference_links].filter(Boolean).join('\n');

  if(pj.draftId){ await sb.from('sp_job_drafts').delete().eq('id', pj.draftId); pj.draftId = null; }

}

// ---- Sphere AI: natural language → structured form
function aiJobPrompt(brief){
  return 'You are filling a job form for Sphere, a video editing marketplace in India. Read the client request and reply with ONLY one JSON object (no other text, no markdown) with exactly these keys: '
    + '{"title": short title, max 60 characters; "category": one of ' + JSON.stringify(CATEGORIES)
    + '; "description": clear project description for editors in simple English, 2-5 sentences; "budget": number in rupees or null; '
    + '"deadline_days": number of days from today or null; "language": one of ' + JSON.stringify(LANGUAGES) + ' or null; '
    + '"video_length": like "60 sec" or "5 min" or null; "video_format": one of ' + JSON.stringify(VIDEO_FORMATS.slice(0, 4)) + ' or null; '
    + '"style_notes": music, captions, colours, effects, mood in one short line or null; "reference_links": links from the request or null; '
    + '"revisions_expected": number or null}. Never include phone numbers, emails or social media IDs. Client request:  + brief + ';
}
function parseAIJob(reply){
  const t = String(reply || '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a < 0 || b <= a) return null;
  try { return aiDraftToFields(JSON.parse(t.slice(a, b + 1))); } catch(e) { return null; }
}
function aiDraftToFields(o){
  if(!o || typeof o !== 'object') return null;
  const str = (x, max) => (typeof x === 'string' && x.trim() && !/^null$/i.test(x.trim())) ? x.trim().slice(0, max) : '';
  const num = (x, lo, hi) => { const n = Number(String(x === null || x === undefined ? '' : x).replace(/[^0-9.]/g, '')); return (Number.isFinite(n) && n >= lo && n <= hi) ? Math.round(n) : null; };
  const days = num(o.deadline_days, 0, 365);
  const fmt = VIDEO_FORMATS.find(f => str(o.video_format, 30) && f.toLowerCase().startsWith(str(o.video_format, 30).toLowerCase().slice(0, 4)));
  return {
    title: str(o.title, 80),
    category: CATEGORIES.includes(o.category) ? o.category : '',
    description: str(o.description, 2000),
    budget: num(o.budget, 1, 10000000),
    deadline: days !== null ? addDaysIST(days) : null,
    language: LANGUAGES.includes(o.language) ? o.language : '',
    video_length: str(o.video_length, 40),
    video_format: fmt || '',
    style_notes: str(o.style_notes, 1500),
    reference_links: str(o.reference_links, 1000),
    revisions_expected: num(o.revisions_expected, 1, 10)
  };
}
// Works without AI: reads the obvious things from the text
function localJobParse(text){
  const t = String(text || ''), low = t.toLowerCase();
  const cat = [
    ['Podcast Editing', /podcast/], ['Gaming Edits', /gaming|\bgame|bgmi|free ?fire|valorant|montage/],
    ['Motion Graphics', /motion graphic|animation|animated|logo anim|explainer/], ['Color Grading & VFX', /colou?r grad|\bvfx\b|\blut/],
    ['Ads & Commercial', /\bads?\b|commercial|product|promo|brand/], ['Cinematic', /wedding|shaadi|cinematic|short film|pre[- ]?wedding/],
    ['Vlog Editing', /vlog|travel video|youtube video/], ['Reels & Shorts', /reel|shorts?\b|insta|tiktok|vertical/]
  ].find(([, re]) => re.test(low));
  const bm = t.match(/(?:₹|rs\.?|inr|rupees?)\s*([\d,]{2,9})|([\d,]{2,9})\s*(?:₹|rs\b|rupees?|\/-)|budget\D{0,12}([\d,]{2,9})/i);
  const budget = bm ? Number(String(bm[1] || bm[2] || bm[3]).replace(/,/g, '')) : null;
  let days = null, m;
  if((m = low.match(/(\d{1,3})\s*(?:din|days?)\b/))) days = +m[1];
  else if((m = low.match(/(\d{1,2})\s*(?:hafte|weeks?)\b/))) days = +m[1] * 7;
  else if(/\b(1 week|ek hafte|a week)\b/.test(low)) days = 7;
  else if(/\b(tomorrow|kal)\b/.test(low)) days = 1;
  else if(/\b(today|aaj)\b/.test(low)) days = 0;
  let len = '';
  if((m = low.match(/(\d{1,3})\s*(?:sec|second|seconds|s)\b/))) len = m[1] + ' sec';
  else if((m = low.match(/(\d{1,3})\s*(?:min|mins|minute|minutes)\b/))) len = m[1] + ' min';
  const fmt = /9\s*[:x]\s*16|reel|shorts?\b|vertical|insta/.test(low) ? VIDEO_FORMATS[0]
    : /16\s*[:x]\s*9|youtube|horizontal|landscape/.test(low) ? VIDEO_FORMATS[1]
    : /1\s*[:x]\s*1|square/.test(low) ? VIDEO_FORMATS[2] : /4\s*[:x]\s*5/.test(low) ? VIDEO_FORMATS[3] : '';
  const lang = ['Hinglish', 'Haryanvi', 'Bhojpuri', 'Punjabi', 'Rajasthani', 'Marathi', 'Gujarati', 'Bengali', 'Tamil', 'Telugu', 'Kannada', 'Malayalam', 'Urdu', 'Hindi', 'English']
    .find(l => new RegExp('\\b' + l.toLowerCase() + '\\b').test(low)) || '';
  const style = [[/music|song|gaana|trending audio/, 'Background music'], [/caption|subtitle/, 'Captions / subtitles'], [/transition/, 'Smooth transitions'],
    [/slow[- ]?mo/, 'Slow motion'], [/colou?r/, 'Colour grading'], [/logo/, 'Add logo'], [/text|title card/, 'Text / titles']]
    .filter(([re]) => re.test(low)).map(([, s]) => s).join(', ');
  const refs = (t.match(/https?:\/\/\S+/g) || []).join(' ');
  const rv = low.match(/(\d)\s*(?:revisions?|changes?|corrections?)/);
  const first = t.split(/[.\n!?]/)[0].trim();
  const short = first.split(',')[0].trim();
  const title = (short.length >= 12 ? short : first).slice(0, 60);
  return {
    title: title.length > 6 ? title : '', category: cat ? cat[0] : '', description: '',
    budget: budget && budget > 0 && budget < 10000000 ? budget : null, deadline: days !== null ? addDaysIST(days) : null,
    language: lang, video_length: len, video_format: fmt, style_notes: style, reference_links: refs,
    revisions_expected: rv ? Math.min(10, +rv[1]) : null
  };
}
function mergeJobFields(ai, local, brief){
  const out = {};
  const keys = ['title', 'category', 'description', 'budget', 'deadline', 'language', 'video_length', 'video_format', 'style_notes', 'reference_links', 'revisions_expected'];
  keys.forEach(k => { const a = ai ? ai[k] : null, l = local ? local[k] : null; out[k] = (a !== null && a !== undefined && a !== '') ? a : l; });
  if(!out.description) out.description = String(brief || '').trim();
  return out;
}

/* ============ PART 6: JOB DISCOVERY + BIDDING ============
   Editors: search / filter open jobs, one bid per job (amount + delivery days +
   message), edit while pending. Clients: compare bids, pick one → job goes to
   that editor ("negotiating", bid = editor's price), other bids are closed.
   Who may bid comes from the database (sp_bid_eligibility). */
const DELIVERY_DAYS = [1, 2, 3, 4, 5, 7, 10, 14, 21, 30];
let jobFilter = { q: '', cat: '', min: '', max: '', due: '', sort: 'new' };
let availState = { jobs: [], ctx: { mine: {}, counts: {} } };

function daysLeft(dateStr){
  if(!dateStr) return null;
  const d = Math.round((new Date(String(dateStr).slice(0, 10) + 'T00:00:00') - new Date(todayIST() + 'T00:00:00')) / 86400000);
  return d;
}
function dueText(dateStr){
  const d = daysLeft(dateStr);
  if(d === null) return 'No deadline';
  if(d < 0) return 'Expired';
  return d === 0 ? 'Due today' : d === 1 ? 'Due tomorrow' : 'Due in ' + d + ' days';
}
function bidStatusChip(a){
  if(!a) return '';
  const st = a.status || 'pending';
  if(st === 'selected') return '<span class="bid-chip ok">✓ You were selected</span>';
  if(st === 'rejected') return '<span class="bid-chip bad">Not selected</span>';
  return `<span class="bid-chip blue">✓ You bid ${rupees(a.bid_amount)}${a.delivery_days ? ' · ' + a.delivery_days + 'd' : ''}</span>`;
}

function filterJobs(jobs, user, ctx){
  const f = jobFilter, q = f.q.trim().toLowerCase();
  const mineCats = (user.categories && user.categories.length) ? user.categories : (user.category ? [user.category] : []);
  const min = Number(f.min) || 0, max = Number(f.max) || 0, due = Number(f.due) || 0;
  let out = jobs.filter(j => {
    if(q && ![j.title, j.category, j.desc, j.styleNotes, j.language, j.videoFormat].join(' ').toLowerCase().includes(q)) return false;
    if(f.cat === 'mine' && mineCats.length && !mineCats.includes(j.category)) return false;
    if(f.cat && f.cat !== 'mine' && j.category !== f.cat) return false;
    if(min && Number(j.budget) < min) return false;
    if(max && Number(j.budget) > max) return false;
    if(due){ const d = daysLeft(j.deadline); if(d === null || d > due) return false; }
    return true;
  });
  const cnt = j => (ctx.counts[j.id] || 0);
  const sorters = {
    new: (a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')),
    budget_hi: (a, b) => Number(b.budget) - Number(a.budget),
    budget_lo: (a, b) => Number(a.budget) - Number(b.budget),
    due: (a, b) => (daysLeft(a.deadline) ?? 9999) - (daysLeft(b.deadline) ?? 9999),
    few: (a, b) => cnt(a) - cnt(b)
  };
  return out.sort(sorters[f.sort] || sorters.new);
}

let bidSort = 'best';
SCREENS.applications = async (data) => {

  const { data: rows, error } = await sb.from('sp_applications').select('*').eq('job_id', job.id).order('created_at', { ascending: true });
  if(error) console.error(error);
  const bids = rows || [];
  const ids = bids.map(a => a.editor_id);
  const [eds, stats, extra] = await Promise.all([
    getProfilesByIds(ids),
    ids.length ? sb.rpc('sp_bid_editor_stats', { p_editors: ids }).then(r => r.data || [], () => []) : Promise.resolve([]),
    ids.length ? sb.from('sp_editor_public_extra').select('id, availability').in('id', ids).then(r => r.data || [], () => []) : Promise.resolve([])
  ]);
  const st = {}; stats.forEach(x => { st[x.editor_id] = x; });
  const av = {}; extra.forEach(x => { av[x.id] = x.availability; });
  const list = bids.map(a => {
    const ed = eds[a.editor_id] || { id: a.editor_id, name: 'Editor', verified: false };
    const s2 = st[a.editor_id] || {};
    return { a, ed, status: a.status || 'pending', price: Number(a.bid_amount) || 0, days: Number(a.delivery_days) || 0,
             rating: Number(s2.rating) || 0, reviews: Number(s2.reviews) || 0, done: Number(s2.completed) || 0, avail: av[a.editor_id] || '' };
  });
  const open = job.status === 'open' && !job.assignedEditor;
  const pending = list.filter(x => x.status === 'pending');
  const best = { price: Math.min(...pending.map(x => x.price).filter(Boolean)), days: Math.min(...pending.map(x => x.days).filter(Boolean)), rating: Math.max(0, ...pending.map(x => x.rating)) };
  const score = x => (x.ed.verified ? 2 : 0) + x.rating + Math.min(x.done, 10) * 0.2 - (job.budget ? x.price / Number(job.budget) : 0) * 1.5 - x.days * 0.05 + (x.avail === 'available' ? 0.5 : 0);
  const sorters = { best: (p, q) => score(q) - score(p), price: (p, q) => p.price - q.price, fast: (p, q) => (p.days || 99) - (q.days || 99), rating: (p, q) => q.rating - p.rating || q.reviews - p.reviews };
  const shown = list.slice().sort((p, q) => (q.status === 'selected') - (p.status === 'selected') || (sorters[bidSort] || sorters.best)(p, q));
  const sortBtn = (k, label) => `<button class="${bidSort === k ? 'on' : ''}" onclick="nav('applications', { sort: '${k}' })">${label}</button>`;
  return `
  <div class="header"><button class="back-btn" onclick="openJob('${job.id}')">‹</button><h1>Bids</h1><p>${esc(job.title || job.category)} · budget ${rupees(job.budget)}</p></div>
  <div class="screen" style="padding-top:0;">
    ${!open ? `<div class="card" style="border:1.5px solid #15803d;"><b>✅ Editor chosen</b><p class="muted" style="font-size:13px; margin-top:4px;">Other bids are closed. Open the project to lock the price.</p>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="openJob('${job.id}')">Open project</button></div>` : ''}
    ${list.length === 0 ? `<div class="card cl-empty"><div class="cl-empty-ic">⏳</div><b>No bids yet</b><p>Verified editors in ${esc(job.category)} were told about your job. Bids usually come within a few hours.</p></div>` : `
    <div class="bid-sort">${sortBtn('best', '⭐ Recommended')}${sortBtn('price', '₹ Lowest price')}${sortBtn('fast', '⚡ Fastest')}${sortBtn('rating', '👍 Top rated')}</div>
    ${pending.length > 1 ? `<details class="card"><summary><b>📊 Compare ${pending.length} bids</b></summary>
      <div style="overflow-x:auto; margin-top:10px;"><table class="bid-cmp"><tr><th>Editor</th><th>Price</th><th>Days</th><th>Rating</th><th>Done</th><th>✔</th></tr>
      ${shown.filter(x => x.status === 'pending').map(x => `<tr><td>${esc(String(x.ed.name || 'Editor').split(' ')[0])}</td>
        <td style="${x.price === best.price ? 'color:#15803d; font-weight:800;' : ''}">${rupees(x.price)}</td>
        <td style="${x.days && x.days === best.days ? 'color:#15803d; font-weight:800;' : ''}">${x.days || '-'}</td>
        <td>${x.reviews ? '⭐ ' + x.rating + ' (' + x.reviews + ')' : '–'}</td><td>${x.done}</td><td>${x.ed.verified ? '✔' : '–'}</td></tr>`).join('')}
      </table></div></details>` : ''}
    ${shown.map(x => bidCard(x, best, open, pending.length)).join('')}`}
  </div>`;
};
function bidCard(x, best, open, nPending){
  const a = x.a, ed = x.ed;
  const tags = [];
  if(x.status === 'pending' && nPending > 1){
    if(x.price && x.price === best.price) tags.push('<span class="bid-chip ok">Lowest price</span>');
    if(x.days && x.days === best.days) tags.push('<span class="bid-chip ok">Fastest</span>');
    if(x.rating && x.rating === best.rating && x.reviews) tags.push('<span class="bid-chip ok">Top rated</span>');
  }
  const stChip = x.status === 'selected' ? '<span class="bid-chip ok">✓ Selected</span>' : x.status === 'rejected' ? '<span class="bid-chip bad">Closed</span>' : '';
  return `<div class="card ${x.status === 'selected' ? 'bid-sel' : ''}" style="${x.status === 'rejected' ? 'opacity:.65;' : ''}">
    <div style="display:flex; gap:10px; align-items:center;">

      <div style="flex:1; min-width:0;"><b>${esc(ed.name || 'Editor')}</b> ${ed.verified ? '<span class="sp-pill ver" title="Verified by Sphere">✔ Verified Editor</span>' : '<span class="bid-chip warn" title="This editor has not been verified by Sphere yet">⚠️ Not verified</span>'}
        <p class="muted" style="font-size:12px;">${x.reviews ? '⭐ ' + x.rating + ' (' + x.reviews + ')' : 'New on Sphere'} · ${x.done} done${x.avail ? ' · ' + (AVAILABILITY[x.avail] || {}).label : ''}</p></div>
      <div style="text-align:right;"><div class="bid-price">${rupees(x.price)}</div><p class="muted" style="font-size:12px;">${x.days ? x.days + ' day' + (x.days === 1 ? '' : 's') : ''}</p></div>
    </div>
    <div>${stChip}${tags.join('')}</div>
    <p style="font-size:13px; margin:8px 0; white-space:pre-wrap;">${esc(a.message || '')}</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">

}
async function selectBid(appId, name, price, days){

/* ============ PART 7: SELECTION + PAYMENT ============
   After the client chooses a bid (Part 6) the project is the job with its editor.
   Accepting the price locks it (sp_pay_lock_price) → "payment-pending".
   Payment: sp_pay_start (ready? already paid?) → existing Razorpay Edge Functions
   → sp_pay_record (IDs / failure). "Paid" and "Refunded" only come from the server.
   sp_payments holds pending / paid / failed / refunded per project. Sphere's split
   lives in sp_payment_splits (admins only) and is never shown to clients. */
const PAY_STATES = Object.freeze({
  pending:  { label: 'Payment pending',  color: '#b45309', bg: '#fff4e0' },
  paid:     { label: 'Paid ✅ held safely', color: '#15803d', bg: '#e7f7ec' },
  failed:   { label: 'Payment failed',   color: '#c62828', bg: '#fdecec' },
  refunded: { label: 'Refunded',         color: '#475569', bg: '#eef2f7' }
});
let payBusy = false;

function projectCode(job){ return 'SPH-' + String(job.id || '').replace(/-/g, '').slice(0, 6).toUpperCase(); }
function paymentState(job, pay){
  if(pay && pay.status) return pay.status;
  if(job.status === 'refunded') return 'refunded';
  if(job.payment === 'escrow-held' || ['in-progress', 'delivered', 'approved', 'closed'].includes(job.status)) return 'paid';
  if(job.status === 'payment-pending') return 'pending';
  return '';
}
function payChip(state){
  const m = PAY_STATES[state];
  return m ? `<span class="pay-chip" style="color:${m.color}; background:${m.bg};">${m.label}</span>` : '';
}
async function loadPayment(jobId){
  try {
    const { data, error } = await sb.from('sp_payments').select('status, amount, attempts, failure_reason, paid_at, refunded_at, updated_at').eq('job_id', jobId).maybeSingle();
    return error ? null : data;
  } catch(e) { return null; }
}

// ---- Accept the other side's price (client or editor) → lock → payment
async function acceptAmount(jobId){
  const job = await getJob(jobId);
  if(!job || !job.proposedAmount) return;
  const user = getCurrentUser();
  const isClient = isClientRole(user) && job.clientId === user.id;
  const { error } = await sb.rpc('sp_pay_lock_price', { p_job: jobId });
  if(error && !/sp_pay_lock_price|schema cache|does not exist|Could not find/i.test(error.message || '')){ alert(error.message); return; }
  if(error){
    // database not updated yet (007): the old way
    if(!await updateJob(jobId, { locked_amount: job.proposedAmount, budget: job.proposedAmount, status: 'payment-pending' })) return;
    await notify(job.clientId, 'Amount Locked 🔒', `Final amount ₹${job.proposedAmount} is locked. Please make the payment.`, { job_id: job.id, category: 'payment' });
    await notify(job.assignedEditor, 'Amount Locked 🔒', `Final amount ₹${job.proposedAmount} is locked. Waiting for the client's payment.`, { job_id: job.id, category: 'payment' });
  }
  currentJobId = jobId;
  if(isClient){ alert(`Price locked 🔒 ${rupees(job.proposedAmount)}\n\nNext: pay securely to start the project.`); nav('payment'); }
  else { alert('Price accepted 🔒 The client will now pay. You will be told when the payment is done.'); nav('projectStatus'); }
}

async function payWithRazorpay(jobId){
  if(payBusy) return;
  payBusy = true;            // Part 19.4: block a second tap at once — before anything is awaited (double tap = double charge)
  const job = await getJob(jobId);
  if(!job){ payBusy = false; return; }
  if(typeof Razorpay === 'undefined'){ payBusy = false; alert('The payment page did not load. Check your internet and try again.'); return; }
  const user = getCurrentUser();
  const btn = document.getElementById('payBtn');
  const busy = on => { payBusy = on; if(btn){ btn.disabled = on; btn.textContent = on ? 'Opening secure payment…' : `🔒 Pay ${rupees(job.lockedAmount || job.budget)} securely`; } };
  busy(true);
  // 1) ready to pay, and not paid already? (skipped if 007 is not installed yet)
  try {
    const { data: ready, error: rErr } = await sb.rpc('sp_pay_start', { p_job: jobId });
    if(rErr || !ready){ busy(false); alert('Payment cannot start because the server readiness check is unavailable. Please try later.'); return; }
    if(!ready.ok){ busy(false); alert(ready.message || 'This project cannot be paid right now.'); currentJobId = jobId; nav(ready.code === 'paid' ? 'payment' : 'projectStatus'); return; }
  } catch(e) { busy(false); alert('Payment readiness check failed. Please try later.'); return; }
  const record = (result, order, payment, reason) => sb.rpc('sp_pay_record', { p_job: jobId, p_result: result, p_order: order || null, p_payment: payment || null, p_reason: reason || null }).then(() => {}, () => {});
  try {
    // 2) the server makes the order — the amount comes from the project, never from the app
    const { data: order, error } = await sb.functions.invoke('create-razorpay-order', { body: { jobId, expectedKeyId: RAZORPAY_KEY_ID } });
    if(error || !order || !order.id){
      busy(false);
      const msg = error ? await functionError(error) : 'unknown';
      await record('failed', null, null, 'Could not start: ' + msg);
      alert('Could not start the payment: ' + msg);
      return;
    }
    const rzp = spRazorpay({
      key: RAZORPAY_KEY_ID,
      amount: order.amount,
      currency: order.currency,
      name: 'Sphere — Syahi Films',
      description: (job.title || job.category) + ' · ' + projectCode(job),
      order_id: order.id,
      notes: { project: projectCode(job) },
      prefill: { name: user?.name || '', email: user?.email || '', contact: user?.phone || '' },
      theme: { color: '#1657ff' },
      handler: async function(response){
        // Browser must not record success before server signature verification.
        // 3) the server checks Razorpay's signature and marks the project paid
        const { data: verify, error: vErr } = await sb.functions.invoke('verify-razorpay-payment', {
          body: { order_id: response.razorpay_order_id, payment_id: response.razorpay_payment_id, signature: response.razorpay_signature }
        });
        busy(false);
        currentJobId = jobId;
        if(!vErr && verify && verify.valid){
          alert('Payment verified successfully. Check project status for the next step.');
          nav('projectStatus');
        } else {
          alert('We could not confirm the payment yet. Payment ID: ' + response.razorpay_payment_id + '\nPlease keep this ID and contact Support — check transaction status before retrying to avoid a duplicate payment.');
          nav('payment');
        }
      },
      modal: { ondismiss: function(){ busy(false); } }
    });
    rzp.on('payment.failed', function(resp){
      const reason = (resp.error && resp.error.description) || 'Payment failed';
      busy(false);
      record('failed', resp.error && resp.error.metadata ? resp.error.metadata.order_id : order.id, null, reason);
      alert('Payment failed: ' + reason + '\nIf money was debited, check the transaction status before retrying.');
    });
    rzp.open();
  } catch(e){
    busy(false);
    alert('Something went wrong: ' + e.message);
  }
}

/* ============ PART 8: PROJECT WORKFLOW + DEADLINES ============
   After payment the work clock starts (database: sp_project_work).
   Deadline = 24 h per delivery day from the bid (default 24 h), then a 4 h grace
   period, then "late". Editor: send preview link, ask for more time. Client:
   answer the request or give more time. Everything is written to the project
   timeline (sp_project_events). Reminders / late notices: sp_work_tick(). */
let WORK_CACHE = {};
let workTimer = null;
let lastWorkTick = 0;
const HOURS_GIVE = [2, 6, 12, 24, 48];
const HOURS_ASK = [2, 6, 12, 24, 48, 72];

function workTickSoon(){
  if(!currentUser || Date.now() - lastWorkTick < 5 * 60000) return;
  lastWorkTick = Date.now();
  sb.rpc('sp_work_tick').then(() => {}, () => {});
  sb.rpc('sp_final_tick').then(() => {}, () => {});
  sb.rpc('sp_bonus_tick').then(() => {}, () => {});
  sb.rpc('sp_sub_tick').then(() => {}, () => {});
  setTimeout(() => { refreshBell(); startNotifRealtime(); }, 800);
  loadMonConfig(true);
}
async function loadWorkFor(ids){
  if(!ids || !ids.length) return;
  try {
    const { data, error } = await sb.from('sp_project_work').select('*').in('job_id', ids.slice(0, 200));
    if(!error) (data || []).forEach(w => { WORK_CACHE[w.job_id] = w; });
  } catch(e) {}
}
function fmtDT(ts){
  if(!ts) return '-';
  return new Date(ts).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}
function hms(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}
function hm(ms){
  const t = Math.max(0, Math.round(ms / 60000));
  const d = Math.floor(t / 1440), h = Math.floor((t % 1440) / 60), m = t % 60;
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
}
// where a project stands right now
function workState(w){
  if(!w) return { key: 'none' };
  const now = Date.now(), due = new Date(w.due_at).getTime(), grace = due + (Number(w.grace_hours) || 4) * 3600000;
  const remindMs = (Number(getSetting('work_reminder_hours')) || 4) * 3600000;
  if(w.phase === 'completed') return { key: 'completed', label: 'Completed', color: '#15803d', bg: '#e7f7ec', short: 'completed' };
  if(w.phase === 'cancelled') return { key: 'cancelled', label: 'Cancelled', color: '#475569', bg: '#eef2f7', short: 'cancelled' };
  if(w.phase === 'preview') return { key: 'preview', label: w.preview_on_time === false ? 'Preview sent (late)' : 'Preview sent on time ✓', color: w.preview_on_time === false ? '#b45309' : '#15803d', bg: w.preview_on_time === false ? '#fff4e0' : '#e7f7ec', short: 'preview ready' };
  if(now < due) return { key: due - now <= remindMs ? 'soon' : 'ok', label: due - now <= remindMs ? 'Due soon' : 'On track', color: due - now <= remindMs ? '#b45309' : '#1657ff', bg: due - now <= remindMs ? '#fff4e0' : '#e8efff', short: 'due in ' + hm(due - now), due, grace };
  if(now < grace) return { key: 'grace', label: 'Grace period', color: '#b45309', bg: '#fff4e0', short: 'grace ' + hm(grace - now) + ' left', due, grace };
  return { key: 'late', label: 'Late', color: '#c62828', bg: '#fdecec', short: 'late by ' + hm(now - grace), due, grace };
}
function workChip(w, job){

  if(st.key === 'none' || st.key === 'completed' || st.key === 'cancelled') return '';
  const icon = { ok: '⏳', soon: '⏰', grace: '⚠️', late: '🔴', preview: '👀' }[st.key] || '';
  return `<span class="wk-chip" style="color:${st.color}; background:${st.bg};">${icon} ${esc(st.key === 'preview' ? st.label : st.short)}</span>`;
}

// live countdowns (one timer for the whole screen)
function startWorkTimer(){
  if(workTimer) clearInterval(workTimer);
  workTimer = setInterval(() => {
    const els = document.querySelectorAll('.wk-count[data-due]');
    if(!els.length){ clearInterval(workTimer); workTimer = null; return; }
    const now = Date.now();
    els.forEach(el => {
      const due = Number(el.dataset.due), grace = Number(el.dataset.grace);
      if(now < due) el.textContent = hms(due - now);
      else if(now < grace) el.textContent = hms(grace - now);
      else el.textContent = '+' + hms(now - grace);
      const cap = el.parentElement && el.parentElement.querySelector('.wk-cap');
      if(cap) cap.textContent = el.dataset.cap ? (now < due ? el.dataset.cap : 'time is up — the Sphere team will review') : (now < due ? 'left until the deadline' : now < grace ? 'grace time left' : 'late by');
    });
  }, 1000);
}

// ---- upload with a progress bar (falls back to the normal upload)
async function uploadWithProgress(path, blob, onProgress, bucket){
  bucket = bucket || PROJECT_BUCKET;
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if(!token) throw new Error('Please log in again.');
  const url = SUPABASE_URL + '/storage/v1/object/' + bucket + '/' + path.split('/').map(encodeURIComponent).join('/');
  try {
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
      xhr.upload.onprogress = e => { if(e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(Object.assign(new Error('Upload failed (' + xhr.status + ')'), { http: xhr.status, body: xhr.responseText }));
      xhr.onerror = () => reject(Object.assign(new Error('network'), { network: true }));
      xhr.send(blob);
    });
  } catch(e) {
    if(!e.network) throw new Error(((() => { try { return JSON.parse(e.body).message; } catch(x) { return ''; } })()) || e.message);
    const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || 'application/octet-stream', upsert: false });
    if(error) throw error;
    if(onProgress) onProgress(1);
  }
}

function prepWatermarkMedia(file){
  const prep = { src: URL.createObjectURL(file), v: document.createElement('video'), actx: null };
  const v = prep.v;
  v.setAttribute('playsinline', ''); v.playsInline = true; v.preload = 'auto'; v.crossOrigin = 'anonymous';
  v.style.cssText = 'position:fixed; left:0; top:0; width:2px; height:2px; opacity:0.01; pointer-events:none; z-index:-1;';

  try { prep.actx = new (window.AudioContext || window.webkitAudioContext)(); if(prep.actx.state === 'suspended') prep.actx.resume().catch(() => {}); } catch(e) { prep.actx = null; }
  try { v.muted = true; const pp = v.play(); const back = () => { if(prep.started) return; v.pause(); v.muted = false; try { v.currentTime = 0; } catch(e) {} }; if(pp && pp.then) pp.then(back, () => { v.muted = false; }); else back(); } catch(e) { v.muted = false; }
  return prep;
}
function freeWatermarkMedia(prep){
  if(!prep) return;
  try { prep.v.pause(); prep.v.removeAttribute('src'); prep.v.load(); prep.v.remove(); } catch(e) {}
  try { URL.revokeObjectURL(prep.src); } catch(e) {}
  if(prep.actx) prep.actx.close().catch(() => {});
}
async function watermarkVideo(file, label, onProgress, prep){
  if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error('This browser cannot add the watermark. Use Chrome on a computer or Android — or share a link below.');
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  if(!mime) throw new Error('This browser cannot record video. Use Chrome on a computer or Android — or share a link below.');
  if(!prep) prep = prepWatermarkMedia(file);
  const v = prep.v;
  let wake = null;
  try { if(navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch(e) {}   // keep the screen on while it works
  try {
    if(!(v.readyState >= 1 && isFinite(v.duration) && v.duration > 0)) await new Promise((res, rej) => {
      const ok = () => { if(v.readyState >= 1) res(); };
      v.addEventListener('loadedmetadata', ok); v.addEventListener('loadeddata', ok); v.addEventListener('canplay', ok);
      v.onerror = () => rej(new Error('This video cannot be read here. Try exporting it as MP4 (H.264) — or share a link below.'));
      setTimeout(() => rej(new Error('Your phone could not open this video here. Share it as a link below instead (YouTube unlisted or Google Drive).')), 20000);
    });
    if(v.currentTime > 0){ v.pause(); v.currentTime = 0; await new Promise(r => { v.onseeked = r; setTimeout(r, 1500); }); }
    const dur = v.duration;
    if(!isFinite(dur) || dur <= 0) throw new Error('Could not read the video length.');
    if(dur > previewMaxMin() * 60) throw new Error(`The preview is longer than ${previewMaxMin()} minutes. Share it as a link instead (add the SPHERE watermark in your editing app).`);
    const scale = Math.min(1, 1280 / Math.max(v.videoWidth || 1280, v.videoHeight || 720));
    const W = Math.max(2, Math.round((v.videoWidth || 1280) * scale / 2) * 2), H = Math.max(2, Math.round((v.videoHeight || 720) * scale / 2) * 2);
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const stream = canvas.captureStream(25);
    let actx = prep.actx;
    try {
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const node = actx.createMediaElementSource(v), dest = actx.createMediaStreamDestination();
      node.connect(dest);                       // record the sound without playing it aloud
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    } catch(e) { actx = null; }
    const targetMB = Math.min(45, fileMaxMB() - 3);
    const vbr = Math.max(350000, Math.min(2500000, Math.floor(targetMB * 8 * 1048576 / dur) - 96000));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: vbr, audioBitsPerSecond: 96000 });
    const chunks = [];
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => { rec.onstop = res; });
    const big = Math.round(W * 0.17), small = Math.max(12, Math.round(W * 0.022)), tile = Math.max(14, Math.round(W * 0.035));
    let x = W * 0.08, y = H * 0.12, dx = Math.max(1.2, W / 420), dy = Math.max(1, H / 360);
    const draw = () => {
      ctx.drawImage(v, 0, 0, W, H);
      ctx.save();
      // faint tiled text so the video cannot be cropped clean
      ctx.globalAlpha = 0.13; ctx.fillStyle = '#fff'; ctx.font = `800 ${tile}px Arial, sans-serif`;
      ctx.translate(W / 2, H / 2); ctx.rotate(-0.42);
      for(let ty = -H; ty < H; ty += tile * 3) for(let tx = -W; tx < W; tx += tile * 12) ctx.fillText('SPHERE PREVIEW', tx + (Math.round(ty / (tile * 3)) % 2) * tile * 6, ty);
      ctx.restore(); ctx.save();
      // the big moving SPHERE
      ctx.font = `900 ${big}px Arial, sans-serif`; ctx.textBaseline = 'top';
      const tw = ctx.measureText('SPHERE').width;
      x += dx; y += dy;
      if(x < 0 || x + tw > W){ dx = -dx; x = Math.max(0, Math.min(x, W - tw)); }
      if(y < 0 || y + big > H){ dy = -dy; y = Math.max(0, Math.min(y, H - big)); }
      ctx.globalAlpha = 0.42; ctx.lineWidth = Math.max(2, big / 16); ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText('SPHERE', x, y); ctx.fillStyle = '#ffffff'; ctx.fillText('SPHERE', x, y);
      // project label
      ctx.globalAlpha = 0.8; ctx.font = `700 ${small}px Arial, sans-serif`; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(label, 10, H - 8); ctx.fillText(label, 10, H - 8);
      ctx.restore();
    };
    let timer = null, done = false;
    const loop = () => { if(done) return; draw(); if(onProgress) onProgress(Math.min(0.999, v.currentTime / dur)); };
    v.onended = () => { done = true; draw(); setTimeout(() => { try { rec.stop(); } catch(e) {} }, 300); };
    if(actx && actx.state === 'suspended') await actx.resume();
    draw();
    rec.start(1000);
    prep.started = true; v.muted = false;
    try { await v.play(); }
    catch(e){ try { rec.stop(); } catch(x) {} throw new Error('The video could not start playing here. Tap “Choose video” again, or share a link below.'); }
    if(v.requestVideoFrameCallback){ const f = () => { loop(); if(!done) v.requestVideoFrameCallback(f); }; v.requestVideoFrameCallback(f); }
    timer = setInterval(loop, 40);   // also keeps drawing if the frame callback pauses
    const guard = setTimeout(() => { if(!done){ done = true; try { rec.stop(); } catch(e) {} } }, (dur * 1.6 + 20) * 1000);
    await stopped;
    clearInterval(timer); clearTimeout(guard);
    const type = mime.split(';')[0];
    const blob = new Blob(chunks, { type });
    if(blob.size < 1000) throw new Error('The watermark could not be added. Keep this screen open while it works, or share a link instead.');
    if(blob.size > fileMaxMB() * 1048576) throw new Error(`The watermarked preview is bigger than ${fileMaxMB()} MB. Make a shorter or smaller preview, or share a link.`);
    return { blob, ext: type.includes('mp4') ? 'mp4' : 'webm', duration: dur, width: W, height: H };
  } finally {
    if(wake) wake.release().catch(() => {});
    freeWatermarkMedia(prep);
  }
}

async function startPreviewUpload(jobId, input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!/^video\//.test(file.type || '') && !/\.(mov|mp4|m4v|webm)$/i.test(file.name || '')){ alert('Please choose a video file.'); return; }
  const prep = (window.MediaRecorder && HTMLCanvasElement.prototype.captureStream) ? prepWatermarkMedia(file) : null;   // must happen inside the tap (iPhone)
  const job = await getJob(jobId);
  const note = ((document.getElementById('pvNote') || {}).value || '').trim();
  let begun = null;
  try {
    setUpStatus('pvStatus', 'Opening your video…', 0);
    const label = 'SPHERE PREVIEW · ' + projectCode(job) + ' · ' + new Date().toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
    // v2.22.34: if this phone cannot add the watermark (often iPhone), the video is sent as it is and Sphere
    // shows its moving watermark on top while the client watches (download stays off)
    let out, started = false;
    try {
      out = await Promise.race([
        watermarkVideo(file, label, p => { started = true; setUpStatus('pvStatus', 'Adding the SPHERE watermark… ' + Math.round(p * 100) + '%', p); }, prep),
        new Promise((_, rej) => setTimeout(() => { if(!started) rej(new Error('stuck')); }, 25000))
      ]);
    } catch(we) {
      freeWatermarkMedia(prep);
      if(started && we && we.message !== 'stuck') throw we;
      if(file.size > 52428800) throw new Error('This phone could not add the watermark, and the video is bigger than 50 MB. Share it as a link below instead (YouTube unlisted or Google Drive) — Sphere still shows its watermark on top.');
      setUpStatus('pvStatus', 'Sending with Sphere\'s on-screen watermark…', 0);
      const ext = ((file.name || '').match(/\.([a-z0-9]{2,4})$/i) || [, 'mp4'])[1].toLowerCase();
      out = { blob: file.type ? file : new Blob([file], { type: ext === 'mov' ? 'video/quicktime' : 'video/' + ext }), ext, duration: await quickVideoDuration(file) };
    }
    setUpStatus('pvStatus', 'Uploading the preview… 0%', 0);
    const { data: b, error: bErr } = await sb.rpc('sp_files_begin', { p_job: jobId, p_kind: 'preview', p_name: 'preview.' + out.ext, p_mime: out.blob.type, p_size: out.blob.size });
    if(bErr) throw new Error(filesRpcError(bErr));
    begun = b;
    await uploadWithProgress(b.path, out.blob, p => setUpStatus('pvStatus', 'Uploading the preview… ' + Math.round(p * 100) + '%', p));
    const { data: fin, error: fErr } = await sb.rpc('sp_files_finish', { p_id: b.id, p_ok: true, p_duration: out.duration, p_note: note || null });
    if(fErr) throw new Error(filesRpcError(fErr));
    setUpStatus('pvStatus', '✅ Preview v' + b.version + ' sent', 1);
    alert('Preview v' + b.version + ' sent 👀' + (fin && fin.on_time === false ? ' (after the deadline)' : '') + '\nThe client can watch it inside Sphere.');
    currentJobId = jobId; nav('projectStatus');
  } catch(e) {
    freeWatermarkMedia(prep);
    if(begun) sb.rpc('sp_files_finish', { p_id: begun.id, p_ok: false, p_duration: null, p_note: null }).then(() => {}, () => {});
    setUpStatus('pvStatus', '⚠️ ' + (e.message || e), null);
    alert(e.message || 'Could not send the preview');
  }
}
function quickVideoDuration(file){
  return new Promise(res => {
    try {
      const v = document.createElement('video'), u = URL.createObjectURL(file); v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const done = d => { try { URL.revokeObjectURL(u); } catch(e) {} res(d); };
      v.onloadedmetadata = () => done(isFinite(v.duration) ? Math.round(v.duration) : null); v.onerror = () => done(null);
      setTimeout(() => done(null), 6000); v.src = u;
    } catch(e) { res(null); }
  });
}

        <input type="file" multiple style="display:none;" onchange="uploadProjectFiles('${job.id}', this)"></label>
      <div id="pfStatus"></div>
      <details style="margin-top:10px;"><summary><b>🔗 Big files (over ${fileMaxMB()} MB, even 1 GB+)</b></summary>
        <ol class="muted" style="font-size:12px; margin:8px 0 8px 18px; line-height:1.6;"><li>Upload to Google Drive (or Dropbox / WeTransfer / OneDrive)</li><li>Share → <b>Anyone with the link</b> → <b>Viewer</b></li><li>Copy the link and paste it here — only your editor sees it</li></ol>
        <div class="field"><input id="pfLink" placeholder="https://drive.google.com/…"></div>
        <div class="field"><input id="pfLinkName" maxlength="120" placeholder="What is it? (e.g. All raw footage, 6 GB)"></div>
        <button class="btn btn-outline" id="pfLinkBtn" onclick="addProjectLink('${job.id}')">Add link</button></details>` : ''}
  </div>`;
}
async function uploadProjectFiles(jobId, input){
  const picked = Array.from(input.files || []);
  input.value = '';
  if(!picked.length) return;
  const max = fileMaxMB() * 1048576;
  const tooBig = picked.filter(f => f.size > max);
  if(tooBig.length) alert(tooBig.map(f => f.name).join(', ') + '\n\nThese are bigger than ' + fileMaxMB() + ' MB. Share them as a Google Drive / Dropbox / WeTransfer link (see "Big files").');
  const ok = picked.filter(f => f.size <= max && f.size > 0);
  let done = 0, failed = 0;
  for(const f of ok){
    let b = null;
    try {
      const { data, error } = await sb.rpc('sp_files_begin', { p_job: jobId, p_kind: 'client_file', p_name: f.name, p_mime: f.type || 'application/octet-stream', p_size: f.size });
      if(error) throw new Error(filesRpcError(error));
      b = data;
      await uploadWithProgress(b.path, f, p => setUpStatus('pfStatus', `Uploading ${done + 1} of ${ok.length}: ${f.name} — ${Math.round(p * 100)}%`, p));
      const { error: fe } = await sb.rpc('sp_files_finish', { p_id: b.id, p_ok: true, p_duration: null, p_note: null });
      if(fe) throw new Error(filesRpcError(fe));
      done++;
    } catch(e) {
      failed++;
      if(b) sb.rpc('sp_files_finish', { p_id: b.id, p_ok: false, p_duration: null, p_note: null }).then(() => {}, () => {});
      alert('Could not upload ' + f.name + ': ' + (e.message || e));
    }
  }
  if(ok.length) alert(`${done} file${done === 1 ? '' : 's'} uploaded ✅${failed ? ' · ' + failed + ' failed' : ''}. Your editor has been told.`);
  currentJobId = jobId; nav('projectStatus');
}
async function addProjectLink(jobId){
  const url = ((document.getElementById('pfLink') || {}).value || '').trim();
  const name = ((document.getElementById('pfLinkName') || {}).value || '').trim();
  if(!/^https:\/\/\S+$/i.test(url)){ alert('Paste the full link (it starts with https://)'); return; }
  const btn = document.getElementById('pfLinkBtn'); if(btn) btn.disabled = true;
  const { error } = await sb.rpc('sp_files_add_link', { p_job: jobId, p_kind: 'client_file', p_url: url, p_name: name || null, p_note: null });
  if(btn) btn.disabled = false;
  if(error){ alert(filesRpcError(error)); return; }
  alert('Link added ✅ Only your editor can see it.');
  currentJobId = jobId; nav('projectStatus');
}
async function openProjectFile(fileId, path){
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(PROJECT_BUCKET).createSignedUrl(path, 600);
  if(error || !data){ if(w) w.close(); alert('This file could not be opened.'); return; }
  if(w) w.location = data.signedUrl; else window.location.href = data.signedUrl;
}
async function removeProjectFile(jobId, fileId){
  if(!confirm('Remove this file from the project?')) return;
  const { data, error } = await sb.rpc('sp_files_remove', { p_id: fileId });
  if(error){ alert(filesRpcError(error)); return; }
  if(data && data.path) await sb.storage.from(PROJECT_BUCKET).remove([data.path]);
  currentJobId = jobId; nav('projectStatus');
}

/* ============ PART 11: REVISIONS + CHANGE REQUESTS ============
   Revisions: after a preview, the client asks for changes. First free_revisions (3)
   free; from the 4th the client pays revision_fee (₹50, all for the editor) first.
   The editor gets revision_hours (24) for the next preview; that preview closes it.
   Change requests: client describes new work + extra price + extra time + files/link
   → editor accepts / rejects → client pays the extra (if any) → applied: new
   requirements, new deadline, extra amount; old values kept on the request.
   Extra money: Razorpay via the sphere-extra-payment Edge Function, or UPI + an
   admin confirming the transaction ID. */
const CR_HOURS = [0, 12, 24, 48, 72];
async function loadRevisionData(jobId){
  const [r, c, x] = await Promise.all([
    sb.from('sp_revisions').select('*').eq('job_id', jobId).order('number', { ascending: true }).then(v => v, () => ({ data: null, error: true })),
    sb.from('sp_change_requests').select('*').eq('job_id', jobId).order('created_at', { ascending: true }).then(v => v, () => ({ data: null })),
    sb.from('sp_extra_payments').select('*').eq('job_id', jobId).then(v => v, () => ({ data: null }))
  ]);
  return { ready: !r.error, revs: r.data || [], crs: c.data || [], extras: x.data || [] };
}
function revStatusChip(st){
  const m = { open: ['warn', 'Editor working'], awaiting_payment: ['bad', 'Payment needed'], delivered: ['ok', 'Delivered'], cancelled: ['', 'Cancelled'],
              pending: ['warn', 'Waiting for editor'], accepted_awaiting_payment: ['bad', 'Accepted — payment needed'], applied: ['ok', 'Applied'], rejected: ['', 'Rejected'] }[st] || ['', st];
  return `<span class="bid-chip ${m[0]}">${m[1]}</span>`;
}
async function revisionsSection(job, w, files, isClient, isEditor){
  if(!(isClient || isEditor || isAdminUser(getCurrentUser()))) return '';
  if(!['in-progress', 'delivered', 'approved', 'closed'].includes(job.status)) return '';
  const d = await loadRevisionData(job.id);
  if(!d.ready) return '';
  const free = Number(getSetting('free_revisions')) || 3, fee = Number(getSetting('revision_fee')) || 50;
  const used = d.revs.filter(r => r.status !== 'cancelled').length;
  const openRev = d.revs.find(r => r.status === 'open'), payRev = d.revs.find(r => r.status === 'awaiting_payment');
  const openCr = d.crs.find(c => c.status === 'pending' || c.status === 'accepted_awaiting_payment');
  const extraFor = (kind, id) => d.extras.find(x => x.kind === kind && x.ref_id === id);
  const inProgress = job.status === 'in-progress';
  const canRevise = isClient && inProgress && w && w.phase === 'preview' && !openRev && !payRev;
  const nextPaid = used + 1 > free;
  let html = `<div class="card"><b>🔁 Revisions & changes</b>
    <div class="rv-sum">
      <div><b>${Math.min(used, free)} / ${free}</b><span>free revisions used</span></div>
      <div><b>${used >= free ? '₹' + fee : 'Free'}</b><span>next revision</span></div>
      ${job.extraAmount ? `<div><b>${rupees(job.extraAmount)}</b><span>extra work added</span></div>` : ''}
      ${w && w.original_due_at && Math.abs(new Date(w.original_due_at) - new Date(w.due_at)) > 60000 ? `<div><b style="font-size:13px;">${fmtDT(w.due_at)}</b><span>revised deadline (was ${fmtDT(w.original_due_at)})</span></div>` : ''}
    </div>`;
  // open revision
  if(openRev) html += `<div class="card rv-open" style="margin:8px 0;"><b>🔁 Revision #${openRev.number} — ${isEditor ? 'the client wants:' : 'editor is working on it'}</b>
      <p style="font-size:13px; margin:6px 0; white-space:pre-wrap;">${esc(openRev.notes)}</p>
      <p class="muted" style="font-size:12px;">Next preview due ${fmtDT(openRev.new_due_at)}${openRev.preview_version ? ' · about preview v' + openRev.preview_version : ''}</p></div>`;
  // revision waiting for ₹50
  if(payRev){
    const x = extraFor('revision', payRev.id);
    html += `<div class="card" style="border:1.5px solid #c62828; margin:8px 0;"><b>💳 Revision #${payRev.number} needs ${rupees(payRev.fee)}</b>
      <p style="font-size:13px; margin:6px 0;">${esc(payRev.notes)}</p>
      ${isClient ? `<p class="muted" style="font-size:12px; margin-bottom:8px;">${free} revisions were free. This one unlocks after payment — the full amount goes to your editor.</p>
        ${x ? extraPayButtons(x, job) : ''}
        <button class="btn btn-outline" style="margin-top:8px;" onclick="cancelRevision('${payRev.id}', '${job.id}')">Cancel this revision</button>` : `<p class="muted" style="font-size:12px;">Waiting for the client to pay. You will be told when it unlocks.</p>`}</div>`;
  }
  // client: ask for a revision
  if(canRevise) html += `<div class="field" style="margin-top:10px;"><label>What should change in the preview?</label>
      <textarea id="revNotes" maxlength="2000" placeholder="Example: 0:12 cut the drone shot, music a bit lower, end logo bigger" style="min-height:80px;"></textarea></div>
      <button class="btn ${nextPaid ? 'btn-outline' : 'btn-primary'}" onclick="requestRevision('${job.id}')">🔁 Ask for revision #${used + 1}${nextPaid ? ' — ' + rupees(fee) : ' (free)'}</button>`;
  else if(isClient && inProgress && w && w.phase === 'active' && !openRev && !payRev) html += `<p class="muted" style="font-size:12px; margin-top:8px;">You can ask for a revision after the editor sends a preview.</p>`;
  // change requests
  if(openCr){
    const x = extraFor('change', openCr.id);
    html += `<div class="card rv-open" style="margin:10px 0;"><b>📝 Change request</b> ${revStatusChip(openCr.status)}
      <p style="font-size:13px; margin:6px 0; white-space:pre-wrap;">${esc(openCr.details)}</p>
      <p class="muted" style="font-size:12px;">${openCr.extra_price > 0 ? 'Extra price: <b>' + rupees(openCr.extra_price) + '</b> · ' : 'No extra price · '}${openCr.extra_hours ? 'Extra time: +' + openCr.extra_hours + ' h' : 'Same deadline'}</p>
      ${openCr.link ? `<p style="font-size:12px;">${linkOrText(openCr.link)}</p>` : ''}
      ${(openCr.file_ids || []).length ? `<p class="muted" style="font-size:12px;">📎 ${(openCr.file_ids || []).length} file(s) added to Project files</p>` : ''}
      ${openCr.editor_note ? `<p style="font-size:12px;">Editor: “${esc(openCr.editor_note)}”</p>` : ''}
      ${isEditor && openCr.status === 'pending' ? `<div class="field" style="margin-top:8px;"><input id="crNote" maxlength="300" placeholder="Note for the client (optional)"></div>
        <div class="cl-row"><button class="btn btn-primary" onclick="answerChange('${openCr.id}', '${job.id}', true)">Accept</button><button class="btn btn-outline" onclick="answerChange('${openCr.id}', '${job.id}', false)">Reject</button></div>` : ''}
      ${isEditor && openCr.status === 'accepted_awaiting_payment' ? `<p class="muted" style="font-size:12px;">You accepted. Waiting for the client to pay ${rupees(openCr.extra_price)}.</p>` : ''}
      ${isClient && openCr.status === 'pending' ? `<p class="muted" style="font-size:12px;">Waiting for the editor to accept or reject.</p>` : ''}
      ${isClient && openCr.status === 'accepted_awaiting_payment' && x ? `<p style="font-size:12px; margin:6px 0;">✅ The editor accepted. Pay to start the new work.</p>${extraPayButtons(x, job)}` : ''}
      ${isClient ? `<button class="btn btn-outline" style="margin-top:8px;" onclick="cancelChange('${openCr.id}', '${job.id}')">Cancel request</button>` : ''}</div>`;
  } else if(isClient && inProgress){
    html += `<details class="card" style="margin-top:10px;"><summary><b>📝 Ask for a change (new work)</b></summary>
      <p class="muted" style="font-size:12px; margin:8px 0;">For something new — an extra version, more length, new scenes. The editor accepts or rejects; if you offer extra money you pay it after they accept.</p>
      <div class="field"><label>What do you need?</label><textarea id="crDetails" maxlength="1500" placeholder="Example: also make a 15 sec teaser for Instagram from the same footage" style="min-height:80px;"></textarea></div>
      <div class="field"><label>Extra price you offer (₹, optional)</label><input id="crPrice" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div class="field"><label>Extra time for the editor</label><select id="crHours">${CR_HOURS.map(h => `<option value="${h}">${h ? '+' + h + ' hours' : 'No extra time'}</option>`).join('')}</select></div>
      <div class="field"><label>Link (optional)</label><input id="crLink" placeholder="https://drive.google.com/…"></div>
      <div class="field"><label>Files (optional, up to ${fileMaxMB()} MB each)</label><input id="crFiles" type="file" multiple></div>
      <div id="crStatus"></div>
      <button class="btn btn-primary" id="crBtn" onclick="sendChangeRequest('${job.id}')">Send change request</button></details>`;
  }
  // history
  const hist = [
    ...d.revs.map(r => ({ at: r.created_at, html: `<div class="rv-item"><b>🔁 Revision #${r.number}</b> ${revStatusChip(r.status)} ${r.is_paid ? `<span class="bid-chip">paid ${rupees(r.fee)}</span>` : '<span class="bid-chip">free</span>'}
        <p>${esc(r.notes)}</p><p class="muted">${fmtDT(r.created_at)}${r.new_due_at ? ' · due ' + fmtDT(r.new_due_at) : ''}${r.delivered_version ? ' · delivered as preview v' + r.delivered_version : ''}</p></div>` })),
    ...d.crs.map(c => ({ at: c.created_at, html: `<div class="rv-item"><b>📝 Change request</b> ${revStatusChip(c.status)}
        <p>${esc(c.details)}</p>
        <p class="muted">${fmtDT(c.created_at)}${c.extra_price > 0 ? ' · +' + rupees(c.extra_price) : ''}${c.extra_hours ? ' · +' + c.extra_hours + ' h' : ''}</p>
        ${c.status === 'applied' ? `<p class="muted">Deadline ${fmtDT(c.old_due_at)} → <b>${fmtDT(c.new_due_at)}</b> · extra total ${rupees(c.old_extra_amount)} → ${rupees(c.new_extra_amount)}</p>` : ''}
        ${c.editor_note ? `<p class="muted">Editor: “${esc(c.editor_note)}”</p>` : ''}</div>` }))
  ].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if(hist.length) html += `<details style="margin-top:10px;"><summary class="muted" style="font-size:13px;"><b>History (${hist.length})</b></summary>${hist.map(h => h.html).join('')}</details>`;
  return html + `</div>`;
}

// ---- client actions
async function requestRevision(jobId){
  const notes = ((document.getElementById('revNotes') || {}).value || '').trim();
  if(notes.length < 5){ alert('Write what should change.'); return; }
  const { data, error } = await sb.rpc('sp_rev_request', { p_job: jobId, p_notes: notes });
  if(error){ alert(revError(error)); return; }
  if(data && data.needs_payment) alert(`Revision #${data.number} saved 💳\n\nYour ${getSetting('free_revisions')} free revisions are used. Pay ${rupees(data.amount)} to send it to the editor.`);
  else alert(`Revision #${data.number} sent 🔁 The editor has ${getSetting('revision_hours')} hours for the next preview.${data && data.free_left !== undefined ? '\nFree revisions left: ' + data.free_left : ''}`);
  currentJobId = jobId; nav('projectStatus');
}
async function cancelRevision(revId, jobId){
  if(!confirm('Cancel this unpaid revision?')) return;
  const { error } = await sb.rpc('sp_rev_cancel', { p_rev: revId });
  if(error){ alert(revError(error)); return; }
  currentJobId = jobId; nav('projectStatus');
}
async function sendChangeRequest(jobId){
  const details = ((document.getElementById('crDetails') || {}).value || '').trim();
  const price = Number((document.getElementById('crPrice') || {}).value || 0);
  const hours = Number((document.getElementById('crHours') || {}).value || 0);
  const link = ((document.getElementById('crLink') || {}).value || '').trim();
  const picked = Array.from(((document.getElementById('crFiles') || {}).files) || []);
  if(details.length < 10){ alert('Describe the change (at least 10 letters).'); return; }
  if(price < 0 || price > 1000000){ alert('Check the extra price.'); return; }
  if(link && !/^https:\/\/\S+$/i.test(link)){ alert('The link must start with https://'); return; }
  const btn = document.getElementById('crBtn'); if(btn) btn.disabled = true;
  const ids = [];
  try {
    for(const f of picked){
      if(f.size > fileMaxMB() * 1048576) throw new Error(f.name + ' is bigger than ' + fileMaxMB() + ' MB — add it as a link.');
      const { data: b, error } = await sb.rpc('sp_files_begin', { p_job: jobId, p_kind: 'client_file', p_name: f.name, p_mime: f.type || 'application/octet-stream', p_size: f.size });
      if(error) throw new Error(filesRpcError(error));
      await uploadWithProgress(b.path, f, p => setUpStatus('crStatus', 'Uploading ' + f.name + ' — ' + Math.round(p * 100) + '%', p));
      const { error: fe } = await sb.rpc('sp_files_finish', { p_id: b.id, p_ok: true, p_duration: null, p_note: 'For a change request' });
      if(fe) throw new Error(filesRpcError(fe));
      ids.push(b.id);
    }
    const { error } = await sb.rpc('sp_cr_create', { p_job: jobId, p_details: details, p_extra_price: price, p_extra_hours: hours, p_link: link || null, p_file_ids: ids });
    if(error) throw new Error(revError(error));
    alert('Change request sent 📝 The editor will accept or reject it.');
    currentJobId = jobId; nav('projectStatus');
  } catch(e) {
    if(btn) btn.disabled = false;
    alert(e.message || e);
  }
}
async function cancelChange(crId, jobId){
  if(!confirm('Cancel this change request?')) return;
  const { error } = await sb.rpc('sp_cr_cancel', { p_cr: crId });
  if(error){ alert(revError(error)); return; }
  currentJobId = jobId; nav('projectStatus');
}
// ---- editor action
async function answerChange(crId, jobId, accept){
  const note = ((document.getElementById('crNote') || {}).value || '').trim();
  if(!confirm(accept ? 'Accept this change? The deadline and price change as shown.' : 'Reject this change?')) return;
  const { data, error } = await sb.rpc('sp_cr_answer', { p_cr: crId, p_accept: accept, p_note: note || null });
  if(error){ alert(revError(error)); return; }
  alert(!accept ? 'Rejected. The client has been told.' : data && data.status === 'applied' ? 'Accepted ✅ The change is now part of the project.' : 'Accepted ✅ The client will pay the extra price, then you can start.');
  currentJobId = jobId; nav('projectStatus');
}
function revError(error){
  if(/sp_rev_|sp_cr_|sp_extra|schema cache|does not exist|Could not find/i.test((error && error.message) || '')) return 'This needs the latest database update (011_revisions_changes.sql).';
  return (error && error.message) || 'Something went wrong';
}

// ---- paying extras (Razorpay via sphere-extra-payment, or UPI + transaction ID)
function extraPayButtons(x, job){
  if(x.status === 'paid') return '<p style="font-size:12px; color:#15803d;">✅ Paid</p>';
  return `${x.utr ? `<p class="muted" style="font-size:12px; margin-bottom:6px;">UPI ID ${esc(x.utr)} sent — Sphere is checking it.</p>` : ''}
    <button class="btn btn-primary" id="xPay_${x.id}" onclick="payExtra('${x.id}', '${job.id}')">📲 Pay ${rupees(x.amount)} with UPI</button>
    <p class="muted" style="font-size:11px; margin-top:6px;">Opens your UPI app (GPay, PhonePe, Paytm…). Unlocks automatically after payment.</p>`;
}
async function payExtra(extraId, jobId){
  const btn = document.getElementById('xPay_' + extraId); if(btn) btn.disabled = true;
  let order = null;
  try {
    const { data, error } = await sb.functions.invoke('sphere-extra-payment', { body: { action: 'create', extraId, expectedKeyId: RAZORPAY_KEY_ID } });
    if(!error && data && data.ok) order = data;
    else if(data && data.paid){ alert('Already paid ✅'); currentJobId = jobId; return nav('projectStatus'); }
  } catch(e) {}
  if(!order || typeof Razorpay === 'undefined'){
    if(btn) btn.disabled = false;
    alert('Payment could not start right now. Please try again in a minute — nothing was charged.');
    const d = btn && btn.parentElement && btn.parentElement.querySelector('details'); if(d) d.open = true;
    return;
  }
  const user = getCurrentUser();
  const rzp = spRazorpay({
    key: order.key_id || RAZORPAY_KEY_ID, amount: order.amount, currency: order.currency, order_id: order.order_id,
    name: 'Sphere — Syahi Films', description: 'Extra payment',
    prefill: { name: user?.name || '', email: user?.email || '', contact: user?.phone || '' }, theme: { color: '#1657ff' },
    handler: async function(r){
      const { data: v, error: ve } = await sb.functions.invoke('sphere-extra-payment', { body: { action: 'verify', extraId, order_id: r.razorpay_order_id, payment_id: r.razorpay_payment_id, signature: r.razorpay_signature } });
      if(!ve && v && v.valid) alert('Payment successful ✅');
      else alert('We could not confirm the payment yet. Payment ID: ' + r.razorpay_payment_id + '\nKeep this ID and contact Support — check transaction status before retrying to avoid a duplicate payment.');
      currentJobId = jobId; nav('projectStatus');
    },
    modal: { ondismiss: function(){ if(btn) btn.disabled = false; } }
  });
  rzp.on('payment.failed', function(resp){ if(btn) btn.disabled = false; alert('Payment failed: ' + ((resp.error && resp.error.description) || '') + '\nIf an amount was debited, check its status before retrying.'); });
  rzp.open();
}
async function submitExtraUtr(extraId, jobId){
  const utr = ((document.getElementById('xUtr_' + extraId) || {}).value || '').replace(/\s+/g, '');
  if(!/^[A-Za-z0-9]{10,22}$/.test(utr)){ alert('Enter the UPI transaction ID (usually 12 digits).'); return; }
  const { error } = await sb.rpc('sp_extra_submit_utr', { p_extra: extraId, p_utr: utr });
  if(error){ alert(revError(error)); return; }
  alert('Thank you ✅ Sphere will check your payment and unlock it.');
  currentJobId = jobId; nav('projectStatus');
}

// ---- admin: UPI extras waiting for a check
async function loadExtrasQueue(){

function extrasQueueSection(q){

      <p style="font-size:12px;">UPI transaction ID: <b>${esc(x.utr)}</b> · ${fmtDT(x.created_at)} · Project SPH-${String(x.job_id).replace(/-/g, '').slice(0, 6).toUpperCase()}</p>

/* ============ PART 12: FINAL APPROVAL + DISPUTES + REFUNDS ============

   → dispute with a full case file). No answer in 10 h → Sphere team review.

let FINAL_UI_SHOWN = false;   // the new decision card is on screen → hide the old single button

async function loadFinalData(jobId){
  const [d, r] = await Promise.all([

    sb.from('sp_refunds').select('*').eq('job_id', jobId).order('created_at', { ascending: false }).then(v => v, () => ({ data: null }))
  ]);
  return { ready: !d.error, disputes: d.data || [], refunds: r.data || [] };

function refundCard(rf, isClient){

              refunded: ['Refunded ✅', 'The money is on its way — banks take 5–7 working days.'], failed: ['Refund is being retried', 'Something went wrong; the Sphere team is on it.'], rejected: ['Refund not approved', ''] }[rf.status] || [rf.status, ''];

  const note = ((document.getElementById('caseNote') || {}).value || '').trim();

  const ask = { release: 'Release the payment to the editor?', refund: 'Send a FULL refund to the client? This cannot be undone.', redo: 'Send the project back to the editor to fix?' }[decision];
  if(!confirm(ask)) return;
  const { data, error } = await sb.rpc('sp_case_decide', { p_dispute: disputeId, p_decision: decision, p_note: note, p_pin: ADMIN_PIN });
  if(error){ alert(finalError(error)); if(/PIN/i.test(error.message || '')) ADMIN_PIN = ''; return; }
  if(data && data.next === 'release-payout'){
    const { data: r, error: e2 } = await sb.functions.invoke('release-payout', { body: { jobId: data.job_id } });
    alert(e2 ? 'Release failed: ' + await functionError(e2) : (r && r.payout === 'released' ? 'Released ✅' : 'Approved ✅ — see the manual payout list.'));
  } else if(data && data.next === 'refund-payment'){
    await sb.rpc('sp_refund_mark', { p_refund: data.refund_id, p_status: 'processing', p_error: null });
    const { error: e3 } = await sb.functions.invoke('refund-payment', { body: { jobId: data.job_id } });
    if(e3){ const msg = await functionError(e3); await sb.rpc('sp_refund_mark', { p_refund: data.refund_id, p_status: 'failed', p_error: msg }); alert('Refund failed: ' + msg + '\nYou can try again from Admin Panel.'); }
    else alert('Refund started ✅ The client gets the money in 5–7 days.');
  } else {
    alert('Done ✅ The editor has been told to fix and resubmit.');
  }
  nav('admin');
}

function pcvTime(ts){
  const time = Date.parse(ts || '');
  return Number.isFinite(time) ? time : 0;
}
function pcvSortTime(e){
  if(PCV_SORT === 'login') return pcvTime(e.last_login);
  if(PCV_SORT === 'video') return pcvTime(e.proof_at);
  if(PCV_SORT === 'payment') return pcvTime(e.fee_at);
  if(PCV_SORT === 'joined') return pcvTime(e.joined);
  return Math.max(pcvTime(e.last_activity), pcvTime(e.last_seen), pcvTime(e.last_login),
    pcvTime(e.proof_at), pcvTime(e.fee_at), pcvTime(e.joined));
}
function pcvRecentEvent(e){
  const options = [
    {key:'login', label:'Login', time:e.last_login},
    {key:'video', label:'Video sent', time:e.proof_at},
    {key:'payment', label:'Payment', time:e.fee_at},
    {key:'joined', label:'Joined', time:e.joined}
  ];
  if(PCV_SORT !== 'activity') return options.find(x => x.key === PCV_SORT) || options[0];
  return [{key:'seen',label:'Active',time:e.last_seen}, ...options]
    .sort((a,b) => pcvTime(b.time) - pcvTime(a.time))[0];
}
function pcvAgo(ts){
  const time = pcvTime(ts);
  if(!time) return '';
  const minutes = Math.max(0, Math.floor((Date.now() - time) / 60000));
  if(minutes < 1) return 'just now';
  if(minutes < 60) return minutes + 'm ago';
  if(minutes < 1440) return Math.floor(minutes / 60) + 'h ago';
  if(minutes < 10080) return Math.floor(minutes / 1440) + 'd ago';
  return fmtDT(ts);
}
function pcvRecentLabel(e){
  const event = pcvRecentEvent(e);
  if(!pcvTime(event.time)) return '<small style="display:block; opacity:.65; margin-top:3px; font-size:11px;">No ' + esc(event.label.toLowerCase()) + ' recorded</small>';
  return '<small title="' + esc(event.label + ': ' + fmtDT(event.time)) + '" style="display:block; opacity:.85; margin-top:3px; font-size:11px;">🕒 ' +
    esc(event.label) + ': ' + esc(pcvAgo(event.time)) + '</small>';

function pcvFiltered(){

async function adminProjectAction(jobId, action){
  if(needPin()) return;
  const q = { flag: 'Why is this project suspicious?', clear: 'Why is it fine now?', open_review: 'Why should the Sphere team review this project?', add_time: 'Why does the editor get more time?', close_unpaid: 'Why close this unpaid job? (the client sees this)' }[action];
  let hours = null;
  if(action === 'add_time'){ const hv = prompt('How many hours (1–168)?', '24'); if(hv === null) return; hours = parseInt(hv, 10); if(!(hours >= 1 && hours <= 168)){ alert('1–168 hours'); return; } }
  const reason = adminReason(q); if(!reason) return;
  try {
    const res = await adminRpc('sp_admin_project_action', { p_job: jobId, p_action: action, p_reason: reason, p_hours: hours, p_pin: ADMIN_PIN });
    if(action === 'open_review' && res && res.dispute_id) return nav('caseFile', { disputeId: res.dispute_id });
    alert('Done ✅ Saved in the audit log.');
  } catch(e) { alert(e.message); if(/PIN/i.test(e.message)) ADMIN_PIN = ''; }
  nav('adminProject', { jobId });
}

/* ============ PART 15: MONETIZATION ============
   ₹29 verification and ₹199 Editor Pro are rows in sp_fee_payments. The app only
   STARTS a payment (sp_fee_start); it becomes PAID only on the server — the
   sphere-extra-payment Edge Function after Razorpay's signature check, or an admin
   confirming a UPI transaction ID. Paying ₹29 never approves anyone.
   Pro benefits and Sponsored slots come from sp_monetization_config (Admin →
   Monetization), so they can change without touching the payment code. */
let MON_CFG = null, MON_CFG_AT = 0, PRO_SET = new Set(), PRO_SET_AT = 0;
async function loadMonConfig(force){
  if(!force && MON_CFG && Date.now() - MON_CFG_AT < 300000) return MON_CFG;
  try {
    const { data, error } = await sb.from('sp_monetization_config').select('key, value');
    if(!error){ MON_CFG = {}; (data || []).forEach(r => { MON_CFG[r.key] = r.value || {}; }); MON_CFG_AT = Date.now(); }
  } catch(e) {}
  return MON_CFG;
}
function monCfg(key){ return (MON_CFG && MON_CFG[key]) || {}; }
function proBenefit(k){ const b = (monCfg('pro').benefits || {}); return k === 'free_open_bids' ? Number(b[k]) || 0 : b[k] === true; }
async function loadProSet(){
  if(Date.now() - PRO_SET_AT < 120000) return PRO_SET;
  await loadMonConfig();
  try {
    const { data, error } = await sb.from('sp_pro_public').select('editor_id');
    if(!error){ PRO_SET = new Set((data || []).map(r => r.editor_id)); PRO_SET_AT = Date.now(); }
  } catch(e) {}
  return PRO_SET;
}
function proChip(id){ return PRO_SET.has(id) && proBenefit('badge') ? '<span class="pro-chip">PRO</span>' : ''; }
const PAY_STATE = { not_started: ['Not started', '#475569', '#eef2f7'], pending: ['Pending', '#b45309', '#fff4e0'], paid: ['Paid', '#15803d', '#e7f7ec'], failed: ['Failed', '#c62828', '#fdecec'] };
function payStateChip(k){ const m = PAY_STATE[k] || PAY_STATE.not_started; return `<span class="pay-state" style="color:${m[1]}; background:${m[2]};">${m[0]}</span>`; }
const SUB_STATE = { inactive: ['Inactive', '#475569', '#eef2f7'], pending: ['Pending', '#b45309', '#fff4e0'], active: ['Active', '#15803d', '#e7f7ec'], expired: ['Expired', '#6b7280', '#f1f2f4'], failed: ['Failed', '#c62828', '#fdecec'] };
function subStateChip(k){ const m = SUB_STATE[k] || SUB_STATE.inactive; return `<span class="pay-state" style="color:${m[1]}; background:${m[2]};">${m[0]}</span>`; }

function subStatus(m){
  const s = m && m.subscription;
  if(!s) return 'inactive';
  if(s.status === 'active' && s.current_period_end && new Date(s.current_period_end) <= new Date()) return 'expired';

// ---- pay a fee: Razorpay through the server, UPI transaction ID as the fallback
async function payFee(kind, after, preFee){
  const btn = document.getElementById('feePayBtn'); if(btn) btn.disabled = true;
  const { data: f, error } = preFee ? { data: preFee, error: null } : await sb.rpc('sp_fee_start', { p_kind: kind });
  if(error){ if(btn) btn.disabled = false; alert(error.message); return; }
  let order = null;
  try {
    const { data, error: e2 } = await sb.functions.invoke('sphere-extra-payment', { body: { action: 'create', feeId: f.id, expectedKeyId: RAZORPAY_KEY_ID } });
    if(!e2 && data && data.ok) order = data;
  } catch(e) {}
  if(!order || typeof Razorpay === 'undefined'){
    if(btn) btn.disabled = false;
    if(kind === 'contact_unlock'){ alert('Online payment is not available right now. Please try again a little later — nothing was charged.'); return; }
    alert('Payment could not start right now. Please try again in a minute — nothing was charged.');
    const d = document.getElementById('feeUpi'); if(d){ d.open = true; d.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  const user = getCurrentUser();
  const rzp = spRazorpay({
    key: order.key_id || RAZORPAY_KEY_ID, amount: order.amount, currency: order.currency, order_id: order.order_id,
    name: 'Sphere — Syahi Films', description: kind === 'details_update' ? 'Details update request' : kind === 'pro' ? 'Editor Pro — 1 month' : kind === 'client_premium' ? 'Sphere Premium — 1 month' : kind === 'contact_unlock' ? 'Chat & Phone Number Access' : 'Editor verification fee (one-time)',
    prefill: { name: user?.name || '', email: user?.email || '', contact: user?.phone || '' }, theme: { color: '#1657ff' },
    handler: async function(r){
      const { data: v, error: ve } = await sb.functions.invoke('sphere-extra-payment', { body: { action: 'verify', feeId: f.id, order_id: r.razorpay_order_id, payment_id: r.razorpay_payment_id, signature: r.razorpay_signature } });
      if(!ve && v && v.valid) alert(kind === 'contact_unlock' ? 'Payment successful ✅ The phone number is unlocked.' : kind === 'client_premium' ? 'Payment successful ✅ Sphere Premium is active.' : kind === 'pro' ? 'Payment successful ✅ Sphere Pro is active.' : 'Payment successful ✅ Your verification request is with the Sphere team.');
      else alert('We could not confirm the payment yet. Payment ID: ' + r.razorpay_payment_id + '\nKeep this ID — check transaction status before retrying to avoid a duplicate payment.');
      await fetchAndSetCurrentUser(); PRO_SET_AT = 0; nav(after);
    },
    modal: { ondismiss: function(){ if(btn) btn.disabled = false; nav(after); } }
  });
  rzp.on('payment.failed', async function(resp){
    await sb.rpc('sp_fee_failed', { p_fee: f.id, p_reason: (resp.error && resp.error.description) || 'Payment failed' }).then(() => {}, () => {});
    alert('Payment failed: ' + ((resp.error && resp.error.description) || '') + '\nIf an amount was debited, check its status before retrying.');
  });
  rzp.open();
}

// ---- Sponsored cards (empty when switched off; nothing is faked)
async function fillSponsored(slot, tries){
  const el = document.getElementById('ad_' + slot);
  if(!el){ if((tries || 0) < 12) setTimeout(() => fillSponsored(slot, (tries || 0) + 1), 150); return; }
  if(el.dataset.filled) return;
  el.dataset.filled = '1';
  await loadMonConfig();
  const c = monCfg('sponsored');
  if(!c.enabled || !(c.slots || {})[slot]) return;
  try {
    const { data, error } = await sb.rpc('sp_sponsored_for', { p_slot: slot });
    const it = !error && data && data[0];
    if(!it || !document.getElementById('ad_' + slot)) return;
    el.innerHTML = `<div class="card sp-card" ${it.link ? `style="cursor:pointer;" onclick="sponsoredClick('${it.id}', ${jsq(it.link)})"` : ''}>
      <span class="sp-label">Sponsored${it.advertiser ? ' · ' + esc(it.advertiser) : ''}</span>
      <div class="sp-row">${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy">` : ''}<div style="flex:1;"><b style="font-size:14px;">${esc(it.title)}</b>${it.body ? `<p class="muted" style="font-size:12px; margin-top:2px;">${esc(it.body)}</p>` : ''}</div>
      ${it.cta && it.link ? `<span class="btn-sm" style="flex:none;">${esc(it.cta)}</span>` : ''}</div></div>`;
  } catch(e) {}
}
function sponsoredClick(id, link){

}

async function feeAdmin(id, action){

  if(action === 'reject'){ reason = adminReason('Why was the payment not found? (the editor sees this)'); if(!reason) return; }
  else if(!confirm('Mark this payment as received?')) return;
  try { await adminRpc('sp_fee_admin', { p_fee: id, p_action: action, p_reason: reason, p_pin: ADMIN_PIN }); alert('Done ✅'); }
  catch(e) { alert(e.message); if(/PIN/i.test(e.message)) ADMIN_PIN = ''; }
  nav('admin', { tab: 'money' });
}
async function saveSponsoredCfg(){
  if(needPin()) return;
  const slots = {}; document.querySelectorAll('.spSlot').forEach(x => { slots[x.dataset.k] = x.checked; });

async function addSponsored(){

async function saveMonPrices(){
  if(needPin()) return;

  const pro = JSON.parse(JSON.stringify(monCfg('pro') || {}));

const NOTIF_CATS = {

  verification: ['✔', 'Verification'], admin: ['🛠', 'Admin alerts'], preview: ['👀', 'Previews & final work'], revision: ['🔁', 'Revisions & changes'],
