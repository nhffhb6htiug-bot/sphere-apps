<style>
:root{
  --blue:#1657ff;
  --blue-dark:#0038c9;
  --bg:#e8edf9;
  --text:#111111;
  --muted:#6b7280;
  --card:#ffffff;
  --border:#e7e9ee;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{color-scheme:light;}
html,body{width:100%; overflow-x:hidden; color-scheme:light;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(180deg,#dfe6fb 0%,#eef1fb 220px,var(--bg) 220px);
  color:var(--text);
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:92px;
}
img{max-width:100%; display:block;}
.hidden{display:none !important;}
.screen{padding:16px; animation:fade .2s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* ===== TOP BAR (Home) ===== */
.topbar{
  display:flex; align-items:center; gap:8px; padding:14px 16px 8px;
}
.icon-btn{
  width:40px; height:40px; border-radius:14px;
  background:linear-gradient(145deg,#5b82ff,#1657ff);
  display:flex; align-items:center; justify-content:center; font-size:17px;
  cursor:pointer; flex-shrink:0; border:none; color:#fff;
  box-shadow:0 4px 10px rgba(22,87,255,.35), inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.15);
}
.search-box{
  flex:1; background:#fff; border-radius:30px; padding:9px 16px;
  display:flex; align-items:center; gap:8px; color:#999; border:1px solid var(--border);
  min-width:0; box-shadow:inset 0 1px 4px rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.8);
}
.search-box input{border:none; outline:none; flex:1; font-size:13px; background:transparent; min-width:0;}
.topbar-logo{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.topbar-logo img{width:26px; height:26px; border-radius:6px; object-fit:cover;}
.topbar-logo span{font-weight:900; color:var(--blue); font-size:15px;}

/* ===== SECTION TITLES ===== */
.section-title{display:flex; justify-content:space-between; align-items:center; margin:18px 0 12px; padding:0 16px;}
.section-title h3{font-size:15px; font-weight:800;}
.section-title a{font-size:12px; color:#e8543a; font-weight:700; text-decoration:none; cursor:pointer;}

/* ===== EXPLORE (circular icons) ===== */
.explore-row{
  display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:0 16px;
}
.explore-item{text-align:center; cursor:pointer;}
.explore-circle{
  width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
  background:#111; margin-bottom:6px; border:1px solid var(--border);
}
.explore-circle img{width:100%; height:100%; object-fit:cover;}
.explore-circle.ic-zoom img{transform:scale(1.42);}
.explore-item span{font-size:10px; font-weight:600; color:var(--text); line-height:1.2; display:block;}

/* ===== TOOLS & RESOURCES (3 big square cards, text baked in image) ===== */
.tools-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;
}
.tool-card{cursor:pointer; text-align:center;}
.tool-card-img{
  aspect-ratio:1/1; border-radius:18px; overflow:hidden;
  background:var(--card); border:1px solid var(--border); margin-bottom:6px;
}
.tool-card-img img{width:100%; height:100%; object-fit:cover;}
.tool-card span{font-size:11px; font-weight:600; color:var(--text); line-height:1.2; display:block;}

/* ===== SPHERE SERVICES (6 cards, 3 cols x 2 rows, text baked in image) ===== */
.services-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;
}
.service-card{
  aspect-ratio:1/1; border-radius:18px; overflow:hidden; cursor:pointer;
  background:var(--card); border:1px solid var(--border);
}
.service-card img{width:100%; height:100%; object-fit:cover;}

/* ===== GENERIC (other screens) ===== */
.header{
  background:#a7a7a7; color:#fff; padding:20px 20px 24px; margin:-16px -16px 20px -16px;
  border-radius:0 0 24px 24px;
}
.header h1{font-size:22px; font-weight:800;}
.header p{font-size:13px; opacity:.9; margin-top:4px;}
.back-btn{color:#fff; font-size:0; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.45); cursor:pointer; margin-bottom:10px; display:inline-flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; transition:transform .12s, background .12s;}
.back-btn::before{content:''; width:12px; height:12px; border-left:3px solid currentColor; border-bottom:3px solid currentColor; border-radius:2px; transform:translateX(2px) rotate(45deg);}
.back-btn:active{transform:scale(.92); background:rgba(255,255,255,.32);}

.btn{width:100%; padding:15px; border-radius:30px; border:none; font-weight:700; font-size:15px; cursor:pointer; text-align:center;}
.btn-primary{background:var(--blue); color:#fff;}
.btn-outline{background:#fff; color:var(--blue); border:2px solid var(--blue);}
.btn-dark{background:#111; color:#fff;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:20px; border:1px solid var(--border); background:#fff; cursor:pointer;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--card); font-size:14px; outline:none; color:#111 !important; -webkit-text-fill-color:#111; caret-color:#111;
}
h1,h2,h3{color:var(--text);}
.field textarea{resize:vertical; min-height:80px;}
.phone-wrap{display:flex; align-items:stretch;}
.prem-pill{margin-left:auto; flex-shrink:0; border:none; border-radius:999px; padding:8px 13px; font-weight:700; font-size:13px; color:#fff; white-space:nowrap; cursor:pointer;
  background:linear-gradient(90deg,#0a3fe0,#1e7ff0 55%,#12c8f5); box-shadow:0 4px 12px rgba(30,127,240,.3);}
.sp-dlg-wrap{position:fixed; inset:0; z-index:9999; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; padding:24px; animation:spDlgIn .15s ease-out;}
.sp-dlg{background:#fff; color:#111827; width:100%; max-width:360px; border-radius:22px; padding:22px 20px 18px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.25); border-top:5px solid #1e7ff0;}
.sp-dlg.ok{border-top-color:#16a34a;} .sp-dlg.err{border-top-color:#e11d48;}
.sp-dlg-ic{font-size:34px; line-height:1; margin-bottom:8px;} .sp-dlg-t{display:block; font-size:18px; margin-bottom:6px;}
.sp-dlg-p{font-size:14px; color:#4b5563; line-height:1.45; margin:0 0 14px;} .sp-dlg-ok{width:100%;}
.sp-dlg-raw{text-align:left; margin:-4px 0 12px; font-size:12px; color:#6b7280;} .sp-dlg-raw code{display:block; white-space:pre-wrap; word-break:break-word; background:#f3f4f6; padding:8px; border-radius:8px; margin-top:6px;}
@keyframes spDlgIn{from{opacity:0} to{opacity:1}}
.sp-load-ov{position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center;
  background:rgba(232,238,255,.30); -webkit-backdrop-filter:blur(18px) saturate(170%); backdrop-filter:blur(18px) saturate(170%);
  opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s;}
.sp-load-ov.on{opacity:1; visibility:visible; transition:opacity .2s ease;}
.sp-load-card{display:flex; flex-direction:column; align-items:center; gap:4px;}   /* no box: logo straight on the frosted page */
.sp-load-card .sp-loader{margin:6px 18px 10px;}
.sp-load-card p{margin:0;}
.home-search-bottom{display:flex; align-items:center; gap:10px;  padding:13px 16px; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 4px 14px rgba(30,64,175,.08); margin:18px 16px 6px; box-sizing:border-box;}
.home-search-bottom input{flex:1; border:none; outline:none; font-size:15px; background:transparent; min-width:0;}
.sr-row{display:flex; align-items:center; gap:12px; padding:12px 14px; margin-top:8px; cursor:pointer;}
.sr-ic{font-size:20px;}
.prem-badge{display:inline-block; margin-left:4px; font-size:.9em; line-height:1; vertical-align:1px;}
.reply-bar, .emoji-panel, .attach-sheet{position:fixed; left:50%; transform:translateX(-50%); width:100%; max-width:480px; bottom:calc(62px + env(safe-area-inset-bottom, 0px)); z-index:41; background:#fff; border-top:1px solid var(--border); box-sizing:border-box;}
.reply-bar{display:flex; align-items:center; gap:10px; padding:8px 12px;}
.reply-bar .rb-text{flex:1; min-width:0; border-left:3px solid var(--blue); padding-left:8px;} .reply-bar .rb-text b{display:block; font-size:12px; color:var(--blue);} .reply-bar .rb-text span{display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.reply-bar button{width:36px; height:36px; border:none; background:transparent; font-size:18px;}
.emoji-panel{display:grid; grid-template-columns:repeat(8, 1fr); gap:2px; padding:8px; max-height:210px; overflow-y:auto;}
.emoji-panel button{font-size:24px; height:42px; border:none; background:transparent; border-radius:10px;} .emoji-panel button:active{background:#eef2ff;}
.attach-sheet{display:flex; gap:12px; padding:12px 16px;} .attach-sheet button{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px; font-size:26px; border:1px solid var(--border); border-radius:14px; background:#f8fafc;} .attach-sheet button span{font-size:12px; font-weight:600; color:var(--text);}
.msg-quote{display:block; border-left:3px solid currentColor; opacity:.9; background:rgba(0,0,0,.06); border-radius:8px; padding:4px 8px; margin-bottom:4px; cursor:pointer; max-width:100%;}
.chat-bubble.me .msg-quote{background:rgba(255,255,255,.18);} .msg-quote b{display:block; font-size:11px;} .msg-quote span{display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat-bubble.flash{animation:msgFlash 1.4s ease;} @keyframes msgFlash{0%,100%{box-shadow:none} 25%,60%{box-shadow:0 0 0 3px #facc15}}
.chat-img{cursor:zoom-in;}
.media-preview, .img-viewer{position:fixed; inset:0; z-index:9500; background:#0b1220; display:flex; flex-direction:column; color:#fff;}
.mp-top{display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;} .mp-top button, .img-viewer > button{width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.14); color:#fff; font-size:20px;}
.mp-body{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:8px;} .mp-body img, .mp-body video{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px;}
.mp-err{background:#7f1d1d; padding:8px 14px; font-size:13px;} .mp-prog{height:4px; background:rgba(255,255,255,.2);} .mp-prog i{display:block; height:100%; width:0; background:#22c55e; transition:width .2s;}
.mp-bar{display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));} .mp-bar input{flex:1; border-radius:20px; border:none; padding:12px 14px;} .mp-bar button{width:48px; height:48px; border-radius:50%; border:none; background:#22c55e; color:#fff; font-size:20px;}
.img-viewer{align-items:center; justify-content:center;} .img-viewer > button{position:absolute; top:calc(12px + env(safe-area-inset-top, 0px)); right:12px;} .img-viewer img{max-width:100%; max-height:100%; object-fit:contain;}
.ch-seen{opacity:.9;}
.ios-tip{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom, 0px)); z-index:9450; width:calc(100% - 24px); max-width:456px; display:flex; flex-direction:column; gap:3px;
  background:#0f172a; color:#fff; border-radius:16px; padding:12px 40px 12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:13px;}
.ios-tip button{position:absolute; top:6px; right:6px; width:32px; height:32px; border:none; border-radius:50%; background:rgba(255,255,255,.15); color:#fff;}
.sp-pill{position:relative; display:inline-flex; align-items:center; gap:3px; overflow:hidden; vertical-align:2px; margin-left:6px; padding:3px 9px; border-radius:999px;
  font-size:10.5px; font-weight:800; letter-spacing:.2px; color:#fff; white-space:nowrap; line-height:1.3; box-shadow:0 2px 8px rgba(22,87,255,.28);}
.sp-pill.prem{background:linear-gradient(90deg, #1146e8, #1aa8f0);}
.sp-pill.ver{background:linear-gradient(90deg, #0b5ed7, #22c1c3);}
.sp-pill::after{content:''; position:absolute; top:0; bottom:0; width:45%; left:0; pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform:translateX(260%); animation:spShine 2.6s ease-in-out infinite;}
@keyframes spShine{0%{transform:translateX(260%);} 60%,100%{transform:translateX(-160%);}}
@media (prefers-reduced-motion: reduce){ .sp-pill::after{animation:none; display:none;} }
.help-mini{display:flex; align-items:center; gap:10px; width:100%; margin:12px 0 4px; padding:12px 14px; border:1px solid var(--border); border-radius:16px; background:#fff; text-align:left; font:inherit; cursor:pointer;}
.help-mini span{font-size:18px;} .help-mini b{font-size:14px;} .help-mini i{flex:1; font-style:normal; font-size:12px; color:var(--muted);} .help-mini em{font-style:normal; font-size:20px; color:var(--muted);}
.sec-min{width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:#fff; font-size:14px; line-height:1; cursor:pointer;}
.cl-cancel{margin-top:8px; padding:6px 12px; border-radius:999px; border:1px solid #fecaca; background:#fff5f5; color:#c62828; font-size:12px; font-weight:600; cursor:pointer;}
.rev-hist{font-size:12px; background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin:8px 0;} .rev-hist div{margin-top:3px;}
.rev-note{margin-top:8px;} .rev-note textarea{width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:10px; padding:8px; font:inherit; font-size:13px; margin-top:4px; resize:vertical;}
.chat-input-bar{box-sizing:border-box; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));}
.chat-input-bar input{min-width:0; flex:1 1 auto; height:42px; box-sizing:border-box;}
.chat-input-bar #sendBtn{flex:0 0 46px; width:46px; height:46px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 4px 12px rgba(37,99,235,.35);}
.chat-input-bar #sendBtn:disabled{opacity:.6;}
.chat-input-bar .chat-tool{flex:0 0 38px; height:42px !important;}
.msg-menu{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(70px + env(safe-area-inset-bottom, 0px)); z-index:9300; width:calc(100% - 24px); max-width:456px; background:#fff; border-radius:16px; box-shadow:0 12px 34px rgba(15,23,42,.25); overflow:hidden;}
.msg-menu button{display:block; width:100%; text-align:left; padding:14px 18px; border:none; background:#fff; font-size:15px; border-top:1px solid var(--border);}
.msg-menu button:first-child{border-top:none;} .msg-menu .danger{color:#dc2626; font-weight:600;}
.msg-menu-back{position:fixed; inset:0; z-index:9299; background:rgba(15,23,42,.25);}
.ask-notif{position:fixed; inset:0; z-index:9600; background:rgba(15,23,42,.45); display:flex; align-items:flex-end; justify-content:center;}
.ask-notif .box{width:100%; max-width:480px; background:#fff; border-radius:22px 22px 0 0; padding:22px 20px calc(18px + env(safe-area-inset-bottom, 0px)); text-align:center;}
.ask-notif .ic{font-size:40px;} .ask-notif h3{margin:8px 0 4px;} .ask-notif p{color:var(--muted); font-size:14px; margin:0 0 16px;}
.ask-notif .btn{width:100%; margin-top:8px;}
.tone-row{display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--border);} .tone-row.on{background:#eef4ff;}
.tone-play{width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--blue); font-size:14px;}
.msg-banner{position:fixed; left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top, 0px)); z-index:9400; width:calc(100% - 24px); max-width:456px; text-align:left; border:none; border-radius:16px; padding:10px 14px; background:rgba(15,23,42,.92); color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:2px;}
.msg-banner b{font-size:13px;} .msg-banner span{font-size:13px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.reply-bar[hidden], .emoji-panel[hidden], .attach-sheet[hidden], .mp-err[hidden], .mp-prog[hidden]{display:none !important;}
.sp-loading{display:flex; flex-direction:column; align-items:center; padding-top:110px; gap:6px;}
.sp-loader{position:relative; width:130px; height:130px; margin:18px;}
.sp-loader img{position:absolute; inset:0; width:100%; height:100%;}
.sp-loader-big{width:210px; height:210px; margin:0 auto 18px;}
.splash-wrap .sp-loader-big{display:block; position:relative; flex-shrink:0;}
.splash-wrap .sp-loader-big img{position:absolute; inset:0; width:100% !important; height:100% !important; max-width:none !important; margin:0 !important; border-radius:0 !important; box-shadow:none !important; animation-duration:.9s;}
.sp-loader-big .sp-l{animation-name:spLoadLb;} .sp-loader-big .sp-r{animation-name:spLoadRb;}
@keyframes spLoadLb{0%,100%{transform:translate(0,0)} 50%{transform:translate(-28px,28px)}}
@keyframes spLoadRb{0%,100%{transform:translate(0,0)} 50%{transform:translate(28px,-28px)}}
.sp-name{font-size:30px; font-weight:800; letter-spacing:.5px; line-height:1.1; margin-top:2px;
  background:linear-gradient(90deg,#0a3fe0,#1e7ff0 55%,#12c8f5); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sp-l{animation:spLoadL .9s ease-in-out infinite;}
.sp-r{animation:spLoadR .9s ease-in-out infinite;}
@keyframes spLoadL{0%,100%{transform:translate(0,0)} 50%{transform:translate(-18px,18px)}}
@keyframes spLoadR{0%,100%{transform:translate(0,0)} 50%{transform:translate(18px,-18px)}}
@media (prefers-reduced-motion: reduce){ .sp-l,.sp-r{animation:none;} }
.phone-locked{font-size:18px; letter-spacing:2px; filter:blur(3px); user-select:none; margin:6px 0;}
.phone-prefix{display:flex; align-items:center; padding:0 12px; border:1px solid var(--border); border-right:none; border-radius:12px 0 0 12px; background:#f2f2f2; font-weight:600; font-size:14px; color:#111;}
.field .phone-wrap input{border-radius:0 12px 12px 0; flex:1; min-width:0;}

.card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--border);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.avatar{width:56px; height:56px; border-radius:50%; background:#d9dde3; display:flex; align-items:center; justify-content:center; font-size:22px; color:#888; margin-bottom:10px; overflow:hidden;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.menu-item{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:13px 14px; margin-bottom:10px; cursor:pointer; transition:transform .08s ease, box-shadow .15s ease;}
.menu-item:active{transform:scale(.99);}
.menu-item:hover{box-shadow:0 4px 14px rgba(22,87,255,.08);}
.mi-icon{width:40px; height:40px; flex:0 0 40px; border-radius:12px; background:#eef3ff; color:var(--blue); display:flex; align-items:center; justify-content:center;}
.mi-icon svg{width:20px; height:20px;}
.mi-text{flex:1; display:flex; flex-direction:column; min-width:0;}
.mi-text b{font-size:15px; font-weight:600; color:#111;}
.mi-text small{font-size:12px; color:var(--muted); margin-top:2px;}
.mi-chev{color:#b3b9c6; display:flex;} .mi-chev svg{width:18px; height:18px;}

function esc(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Part C: big inline (data:) images are turned into a blob URL once and reused — the Home page HTML
// stays small and the phone does not decode ~200 KB of icons again on every visit.
const IMG_URL_CACHE = new Map();
function cachedSrc(src){
  if(typeof src !== 'string' || src.length < 2000 || !src.startsWith('data:')) return src;
  let u = IMG_URL_CACHE.get(src);
  if(!u){
    try {
      const comma = src.indexOf(','), mime = (src.slice(5, comma).split(';')[0]) || 'image/png';
      const bin = atob(src.slice(comma + 1)), arr = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      u = URL.createObjectURL(new Blob([arr], { type: mime }));
    } catch(e) { u = src; }
    IMG_URL_CACHE.set(src, u);
  }
  return u;
}

}

const MAX_RAW_FILES = 5, MAX_RAW_MB = 50;
function rawUrl(path){ return path ? registerSigned(RAW_BUCKET, path, sb.storage.from(RAW_BUCKET).getPublicUrl(path).data.publicUrl) : ''; }
async function uploadRawFiles(fileList, statusEl){
  const files = Array.from(fileList || []);
  for(const f of files){
    if(!/^(image|video)\//.test(f.type)) throw new Error(`"${f.name}" is not a photo or video`);
    if(f.size > MAX_RAW_MB * 1024 * 1024) throw new Error(`"${f.name}" is bigger than ${MAX_RAW_MB} MB. Share big videos as a Google Drive / WeTransfer link.`);
  }
  const out = [];
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(statusEl) statusEl.textContent = `Uploading ${i + 1} of ${files.length}: ${f.name}…`;
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
    const path = `${currentUser.id}/raw/${Date.now()}_${i}.${ext}`;
    const { error } = await sb.storage.from(RAW_BUCKET).upload(path, f, { contentType: f.type, upsert: false });
    if(error){
      if(out.length) await sb.storage.from(RAW_BUCKET).remove(out.map(x => x.path));
      throw error;
    }
    out.push({ path, name: f.name.slice(0, 80), type: f.type, size: f.size });
  }
  if(statusEl) statusEl.textContent = '';
  return out;
}

function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo could not be opened. Try a JPG or PNG.')); };
    im.src = url;
  });
}
// Phone ki badi photo ko upload se pehle chhota karo (5 MB -> ~200 KB)
async function compressImage(file, maxDim, quality){
  const im = await loadImageFile(file);
  const scale = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * scale), h = Math.round(im.naturalHeight * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('Could not process the photo')), 'image/jpeg', quality || 0.82));
}
async function uploadImage(file, folder, maxDim){
  if(!file) throw new Error('Choose a photo first');
  if(!file.type.startsWith('image/')) throw new Error('Only photos can be uploaded here (JPG/PNG). For videos, add a YouTube or Drive link.');
  if(file.size > 25 * 1024 * 1024) throw new Error('Photo is larger than 25 MB');
  const blob = await compressImage(file, maxDim || 1280);
  const path = `${currentUser.id}/${folder}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });

  return path;
}

function pushSupported(){ return !IN_ANDROID_APP && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushB64uToBytes(s){ const t = String(s).replace(/-/g, '+').replace(/_/g, '/'); const b = atob(t + '='.repeat((4 - t.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); }
function pushBytesToB64u(buf){ let s = ''; new Uint8Array(buf).forEach(x => { s += String.fromCharCode(x); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function ensurePush(){
  if(!pushSupported() || Notification.permission !== 'granted' || !getCurrentUser()) return false;
  try { if(localStorage.getItem('sp_push_off:' + getCurrentUser().id) === '1') return false; } catch(e) {}
  try {
    const reg = await navigator.serviceWorker.ready;
    let key = null;
    const r = await sb.rpc('sp_push_public_key'); if(!r.error) key = r.data;
    if(!key){ const f = await sb.functions.invoke('sphere-push', { body: { action: 'init' } }); key = f && f.data && f.data.publicKey; }
    if(!key){ reportCrash('Push: no server key'); return false; }
    let sub = await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey && pushBytesToB64u(sub.options.applicationServerKey) !== key){ try { await sub.unsubscribe(); } catch(e) {} sub = null; }
    if(!sub){
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushB64uToBytes(key) }); }
      catch(e){ reportCrash('Push: subscribe failed: ' + String(e && e.message || e).slice(0, 120)); return false; }
    }
    const j = sub.toJSON();
    const { error } = await sb.rpc('sp_push_subscribe', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) });
    if(error){ reportCrash('Push: save failed: ' + String(error.message || '').slice(0, 120)); return false; }
    PUSH_ON = true; return true;
  } catch(e){ reportCrash('Push: ' + String(e && e.message || e).slice(0, 120)); return false; }
}

    const reg = await navigator.serviceWorker.getRegistration(); if(!reg) return;
    const sub = await reg.pushManager.getSubscription(); if(!sub) return;
    try { await sb.rpc('sp_push_unsubscribe', { p_endpoint: sub.endpoint }); } catch(e) {}
    await sub.unsubscribe();
  } catch(e) {}
  PUSH_ON = false; PUSH_TRIED_FOR = null;
}

let NAV_SEQ = 0;     // Part 19.1: only the newest navigation may change the screen
async function nav(screen, data){
  if(getCurrentUser() && PUSH_TRIED_FOR !== getCurrentUser().id && pushSupported() && Notification.permission === 'granted'){ PUSH_TRIED_FOR = getCurrentUser().id; setTimeout(ensurePush, 500); }
  if(PENDING_OPEN && screen === 'home' && getCurrentUser()){ const to = PENDING_OPEN; PENDING_OPEN = null; setTimeout(() => nav(to), 0); }
  if(getCurrentUser() && Date.now() - LAST_PING_AT > 45000){ LAST_PING_AT = Date.now(); seenPing(); }
  if(getCurrentUser()) armNativeNotifPrompt();
  // a chat opened from a notification link waits until the user can really see it (e.g. after adding a phone number)
  if(PENDING_CHAT && screen === 'home' && getCurrentUser()){ if(++PENDING_TRIES > 3) PENDING_CHAT = null; else { const id = PENDING_CHAT; setTimeout(() => startChat(id), 0); } }
  if(screen !== 'chatThread' && chatPresence) stopChatPresence();   // left the chat: stop sharing online status
  const mySeq = ++NAV_SEQ;
  // PART 2: every screen is checked against the user's role before it opens
  const gate = await routeGate(screen);
  if(mySeq !== NAV_SEQ) return;              // the person already moved on while this was checked
  if(!gate.ok){
    if(gate.msg) alert(gate.msg);
    if(gate.to && gate.to !== screen) return nav(gate.to);
    return;
  }
  currentScreenName = screen;
  window.scrollTo(0,0);
  const visibleScreens = ['home','chatList','jobs','portfolio','profile'];
  bottomNav.classList.toggle('hidden', !visibleScreens.includes(screen));
  renderBottomNav();
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===screen));
  if(visibleScreens.includes(screen)) refreshChatBadge();
  const renderer = SCREENS[screen];
  if(renderer){
    const result = renderer(data);
    if(result instanceof Promise){
      // Main tabs open at once from the last copy (no loader), then the fresh copy replaces it quietly.
      const key = swrKey(screen, data);
      const cached = key ? SCREEN_CACHE.get(key) : null;
      if(cached){ hideLoadOverlay(); app.innerHTML = cached; }
      // Part C: show the loading screen only if the screen is slow (no flash on fast screens)
      const loaderTimer = cached ? null : setTimeout(() => { if(mySeq === NAV_SEQ) showLoadOverlay(); }, 180);
      const html = await result;
      if(loaderTimer) clearTimeout(loaderTimer);
      if(mySeq !== NAV_SEQ) return;            // a newer screen was opened while this one was loading
      hideLoadOverlay();
      if(key) SCREEN_CACHE.set(key, html);
      if(html !== cached){ const y = cached ? window.scrollY : 0; app.innerHTML = html; if(cached) window.scrollTo(0, y); }
      if(netIsDown()) netNotice();
    } else {
      hideLoadOverlay();
      app.innerHTML = result;
    }
  }
}

const SWR_SCREENS = new Set(['home', 'chatList', 'jobs', 'notifications', 'profile', 'portfolio', 'allEditors']);
const SCREEN_CACHE = new Map();
function swrKey(screen, data){
  if(!SWR_SCREENS.has(screen)) return null;
  const u = getCurrentUser(); if(!u) return null;
  let d = ''; try { d = JSON.stringify(data || null); } catch(e) { return null; }
  return u.id + '|' + (u.role || '') + '|' + screen + '|' + d;
}

function friendlyAuthError(error){
  const m = String(error && error.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'Wrong email or password. Forgot it? Tap "Forgot password?".';
  if(m.includes('email not confirmed')) return 'Please confirm your email first — open the link we emailed you (check Spam too), then log in.';
  if(m.includes('already registered')) return 'An account with this email already exists. Please log in.';
  if(m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Please try again in an hour.';
  if(m.includes('password should be')) return 'Password must be at least 6 characters.';
  return error.message;
}
async function forgotPassword(){
  let email = (document.getElementById('loginEmail').value || '').trim();
  if(!email) email = (prompt('Enter your email:') || '').trim();
  if(!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ alert(friendlyAuthError(error)); return; }
  alert('✉️ We sent a password reset link to ' + email + '. Tap the link in the email (check Spam too).');
}

  { const pw = passwordProblem(a); if(pw){ alert(pw); return; } }
  if(a !== b){ alert('Passwords do not match'); return; }
  const { error } = await sb.auth.updateUser({ password: a });

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if(!email||!pass){ alert('Enter your email and password'); return; }
  const wait = loginWaitSeconds();
  if(wait > 0){ alert('Too many wrong tries. Please wait ' + wait + ' seconds.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ loginFailed(); alert(friendlyAuthError(error)); return; }
  loginOk();
  const user = await fetchAndSetCurrentUser();
  if(!user){
    // account hai par profile adhoori hai -> role + number le lo
    const { data:{ user: authUser } } = await sb.auth.getUser();
    pendingAuthUser = authUser; nav('chooseRole'); return;
  }
  nav(user.role==='admin' ? 'admin' : 'home');
}

async function doSignup(){
  const name=document.getElementById('suName').value.trim();

  const pass=document.getElementById('suPass').value.trim();
  if(!name||!email||!pass){ alert('Please fill all fields'); return; }

let workJobs = [], workMine = [], workFilter = 'All';
function renderWorkList(){
  const list = workJobs.filter(j => workFilter === 'All' ? true
    : workFilter === 'My categories' ? workMine.includes(j.category) : j.category === workFilter);
  if(!list.length) return `<p class="muted">No open jobs ${workFilter === 'All' ? '' : 'in ' + esc(workFilter) + ' '}right now. We will notify you when new work is posted.</p>`;
  return list.map(j => `
      <div class="card" onclick="currentJobId='${j.id}'; nav('jobBidScreen')">
        <span class="tag">${esc(j.category)}</span>${j.language ? `<span class="tag">🗣 ${esc(j.language)}</span>` : ''}
        <p class="muted" style="font-size:13px; margin:6px 0;">${esc(j.desc).slice(0,70)}...</p>
        <p>Budget: <b>₹${j.budget}</b> ${j.deadline?`• Due ${fmtDate(j.deadline)}`:''}</p>
      </div>`).join('');
}
function setWorkFilter(v){
  workFilter = v;
  document.querySelectorAll('#workFilter .pick-chip').forEach(el => el.classList.toggle('on', el.dataset.v === v));

let aiHistory = [];
let aiBusy = false;
function aiChips(){
  const u = getCurrentUser();
  const list = u && u.role === 'editor'
    ? ['✍️ Write a bid message for me', '💡 How can I get more jobs?', '🎨 Tips to improve my portfolio', '💰 How do payouts work?']
    : ['✍️ Help me write a job post', '🎬 Suggest an editor for a wedding video', '📱 Best editor for Reels under ₹1000', '💳 How does payment work?'];
  return list.map(t => `<button class="ai-chip" onclick="sendAI(this.textContent.replace(/^\\S+\\s/, ''))">${t}</button>`).join('');
}
function aiFormat(t){
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/^\s*[-*•]\s+/gm, '• ');
  h = h.replace(/(SF-EDT-\d{3,5})/g, '<span class="ed-code" onclick="openEditorByCode(\'$1\')">$1</span>');
  return h.replace(/\n/g, '<br>');
}
function renderAIMessages(){
  const box = document.getElementById('aiBox');
  if(!box) return;
  const u = getCurrentUser();
  const hello = `<div class="chat-bubble them ai-bubble">Hi ${esc((u && u.name || '').split(' ')[0] || 'there')}! 👋 I'm <b>Sphere AI</b>. ${u && u.role === 'editor'

}

async function sendAI(preset){
  if(aiBusy) return;
  const input = document.getElementById('aiInput');
  const text = String(preset || (input && input.value) || '').trim();
  if(!text) return;
  if(input) input.value = '';
  aiHistory.push({ role: 'user', text });
  aiBusy = true; renderAIMessages();
  const { data, error } = await sb.functions.invoke('sphere-ai', { body: { messages: aiHistory.slice(-12) } });
  aiBusy = false;
  if(error || !data || !data.reply){
    const msg = error ? await functionError(error) : 'Sphere AI could not answer. Please try again.';
    aiHistory.push({ role: 'model', text: '⚠️ ' + msg });
    renderAIMessages();
    aiHistory.pop(); aiHistory.pop();   // failed turn is not sent again as context
    const db = document.getElementById('aiDraftBtn');
    if(db && !aiHistory.some(m => m.role === 'user')) db.style.display = 'none';
    return;
  }
  aiHistory.push({ role: 'model', text: data.reply });
  if(aiHistory.length > 24) aiHistory = aiHistory.slice(-24);
  renderAIMessages();
}
async function aiDraftJob(){
  if(aiBusy) return;
  const btn = document.getElementById('aiDraftBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Writing your job post…'; }
  const { data, error } = await sb.functions.invoke('sphere-ai', { body: { action: 'draft_job', messages: aiHistory.slice(-12) } });
  if(btn){ btn.disabled = false; btn.textContent = '📝 Turn this chat into a job post'; }
  if(error || !data || !data.draft){ alert(error ? await functionError(error) : 'Could not create the job post. Please try again.'); return; }
  nav('postJob', { prefill: data.draft });
}

function editorPrice(e){ return parseInt(String(e.price || '').replace(/[^\d]/g, '')) || 0; }
async function runSmartMatch(){
  const cat = document.getElementById('smCat').value;
  const budget = Number(document.getElementById('smBudget').value) || 0;
  const box = document.getElementById('smResults');
  box.innerHTML = '<p class="muted center-text" style="margin:14px 0;">Searching…</p>';
  const editors = (await getVerifiedEditors()).filter(e => (e.categories.length ? e.categories : [e.category]).includes(cat));
  const score = e => (e.rating || 0) * 2 + Math.min(Number(e.experience) || 0, 10) * 0.3 + (e.reviews || 0) * 0.05;
  let list = budget ? editors.filter(e => editorPrice(e) && editorPrice(e) <= budget) : editors.slice();
  list.sort((a, b) => score(b) - score(a));
  let note = '';
  if(list.length === 0 && editors.length > 0){
    list = editors.slice().sort((a, b) => editorPrice(a) - editorPrice(b)).slice(0, 4);
    note = `<p class="muted" style="margin:12px 0;">No editors within ₹${budget}. Here are the most affordable ones:</p>`;
  }
  if(list.length === 0){
    box.innerHTML = `<p class="muted" style="margin:14px 0;">No verified editors in ${esc(cat)} yet. Post a job — new editors will apply.</p>
      <button class="btn btn-outline" onclick="nav('postJob')">+ Post Job</button>`;
    return;
  }
  box.innerHTML = note + `<h3 style="margin:16px 0 10px;">Top matches</h3><div class="grid2">${renderEditorCards(list.slice(0, 6))}</div>`;
}

function youtubeThumb(url){
  const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
}
function renderPortfolio(e, items, editable){
  const tiles = [];
  (items || []).forEach(it => {
    const img = it.image_path ? mediaUrl(it.image_path) : youtubeThumb(it.video_url);
    const bg = img ? `background:#111 url('${esc(img)}') center/cover;` : 'background:linear-gradient(135deg,#0b3d91,#0e6ba8);';
    const inner = `${it.video_url ? '<div class="play-ic">▶</div>' : ''}<div class="pf-title">${esc(it.title)}</div>`;
    const del = editable ? `<button class="pf-del" onclick="event.preventDefault(); event.stopPropagation(); deletePortfolioItem('${it.id}', ${jsq(it.image_path || '')})">✕</button>` : '';
    tiles.push(it.video_url && /^https?:\/\//i.test(it.video_url)
      ? `<a class="portfolio-item" href="${esc(it.video_url)}" target="_blank" rel="noopener noreferrer" style="${bg}">${del}${inner}</a>`
      : `<div class="portfolio-item" style="${bg}" onclick="safeOpen(${jsq(img)})">${del}${inner}</div>`);
  });
  const links = [];
  if(e && e.sample) links.push({ title: 'Sample Video', url: e.sample });
  if(e && e.portfolio) links.push({ title: 'Portfolio', url: e.portfolio });
  links.filter(l => /^https?:\/\//i.test(l.url)).forEach(l => {
    const th = youtubeThumb(l.url);
    const bg = th ? `background:#000 url('${th}') center/cover;` : 'background:linear-gradient(135deg,#0b3d91,#0e6ba8);';
    tiles.push(`<a class="portfolio-item" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" style="${bg}">
      <div class="play-ic">▶</div><div class="pf-title">${esc(l.title)}</div></a>`);
  });
  const head = `<div class="section-title" style="padding:0; margin-top:16px;"><h3>Portfolio</h3></div>`;
  if(tiles.length === 0) return head + `<p class="muted">No portfolio items yet.</p>`;
  return head + `<div class="portfolio-grid">${tiles.join('')}</div>`;
}

async function addPortfolioItem(){
  const title = document.getElementById('pwTitle').value.trim();
  const file = document.getElementById('pwPhoto').files[0];
  const video = document.getElementById('pwVideo').value.trim();
  if(!title){ alert('Enter a title'); return; }

  const btn = document.getElementById('pwBtn');

function fmtTime(iso){ try { return new Date(iso).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); } catch(e){ return ''; } }
function dayKey(iso){ const d = new Date(iso); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(iso){
  const d = new Date(iso), t = new Date(), y = new Date(Date.now() - 86400000);
  if(dayKey(iso) === dayKey(t.toISOString())) return 'Today';
  if(dayKey(iso) === dayKey(y.toISOString())) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDur(sec){ sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function tickHtml(m){
  if(m.read_at) return '<span class="tick read" title="Seen">✓✓</span>';
  if(m.delivered_at) return '<span class="tick" title="Delivered">✓✓</span>';
  return '<span class="tick" title="Sent">✓</span>';
}
function msgPreview(m){
  if(m.media_type === 'image') return '📷 Photo' + (m.text ? ' · ' + m.text : '');
  if(m.media_type === 'video') return '🎥 Video' + (m.text ? ' · ' + m.text : '');
  if(m.media_type === 'audio') return '🎤 Voice message (' + fmtDur(m.duration_sec) + ')';
  return m.text || '';
}
function bubbleHtml(m, meId){
  const mine = m.sender_id === meId;
  let media = '';
  if(m.media_path){
    const u = esc(chatUrl(m.media_path));
    if(m.media_type === 'image') media = `<img class="chat-img" src="${u}" loading="lazy" alt="Photo" role="button" tabindex="0" onclick="openImageViewer(this.src)">`;
    else if(m.media_type === 'video') media = `<video class="chat-video" src="${u}" controls preload="metadata" playsinline></video>`;
    else if(m.media_type === 'audio') media = `<audio class="chat-audio" src="${u}" controls preload="none"></audio>`;
  }
  const modCls = m.mod_status === 'held' ? ' held' : m.mod_status === 'removed' ? ' removed' : '';
  MSG_INDEX.set(String(m.id), { mine, text: m.text || '', media: m.media_type || '' });
  const quote = m.reply_to ? replyQuoteHtml(String(m.reply_to)) : '';
  const tag = m.job_id && typeof currentChatJob !== 'undefined' && !currentChatJob ? `<small class="msg-proj" onclick="openProjectChat('${esc(m.job_id)}', '${esc(mine ? m.receiver_id : m.sender_id)}')">📁 ${'SPH-' + String(m.job_id).replace(/-/g, '').slice(0, 6).toUpperCase()}</small>` : '';
  return `<div class="chat-bubble ${mine ? 'me' : 'them'}${modCls}" data-id="${esc(m.id)}">${tag}${quote}${media}${m.text ? `<div>${esc(m.text)}</div>` : ''}<span class="msg-meta">${m.media_type === 'audio' ? '🎤 ' + fmtDur(m.duration_sec) + ' · ' : ''}${fmtTime(m.created_at)}${mine ? tickHtml(m) : ''}</span></div>`;
}
let lastChatDay = '';
function withDay(m, meId){
  if(m && HIDDEN_MSGS.has(String(m.id))) return '';          // "Delete for me"
  const k = dayKey(m.created_at);
  const sep = k !== lastChatDay ? `<div class="chat-day"><span>${dayLabel(m.created_at)}</span></div>` : '';
  lastChatDay = k;
  return sep + bubbleHtml(m, meId);
}

// ---- delivered / seen ----
async function markDelivered(){
  if(!currentUser) return;
  await sb.from('sp_messages').update({ delivered_at: new Date().toISOString() }).eq('receiver_id', currentUser.id).is('delivered_at', null);
}
async function markRead(otherId){
  if(!currentUser || !otherId) return;
  await sb.from('sp_messages').update({ read_at: new Date().toISOString() })
    .eq('receiver_id', currentUser.id).eq('sender_id', otherId).is('read_at', null);
  refreshChatBadge();
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && currentScreenName === 'chatThread' && currentChatWith) markRead(currentChatWith);
  if(!document.hidden && currentUser){ catchUpChat(); try { refreshBell(); } catch(e) {} }
});

// ---- Part 21: live-update health + catch-up ----
// Realtime reconnects by itself but does not resend what arrived while it was down. So: when it
// (re)connects or the app comes back to the screen, fetch only the messages newer than the last one
// shown (no duplicates: every bubble carries its id). A light 10-second check runs ONLY while live
// updates are not connected.
let THREAD_SINCE = null, RT_OK = { msg: false, notif: false }, rtPollTimer = null, catchingUp = false;
function rtStatus(kind){
  return (status) => {
    const was = RT_OK[kind]; RT_OK[kind] = (status === 'SUBSCRIBED');
    if(RT_OK[kind] && !was){ if(kind === 'msg') catchUpChat(); else { try { refreshBell(); } catch(e) {} } }
    rtPollSchedule();
  };
}
function rtPollSchedule(){
  const need = !!currentUser && (!RT_OK.msg || !RT_OK.notif);
  if(need && !rtPollTimer) rtPollTimer = setInterval(() => { if(document.hidden || !currentUser) return; catchUpChat(); try { refreshBell(); } catch(e) {} }, 10000);
  if(!need && rtPollTimer){ clearInterval(rtPollTimer); rtPollTimer = null; }
}
async function catchUpChat(){
  if(!currentUser) return;
  const box = document.getElementById('chatBox');
  if(!box || currentScreenName !== 'chatThread' || !currentChatWith || !THREAD_SINCE || catchingUp){ refreshChatBadge(); return; }
  catchingUp = true;
  try {
    const me = currentUser.id;
    let q = sb.from('sp_messages').select('*')
      .or(`and(sender_id.eq.${me},receiver_id.eq.${currentChatWith}),and(sender_id.eq.${currentChatWith},receiver_id.eq.${me})`)
      .gt('created_at', THREAD_SINCE);
    if(currentChatJob) q = q.eq('job_id', currentChatJob);
    const { data } = await q.order('created_at', { ascending: true }).limit(100);
    let added = 0;
    (data || []).forEach(m => {
      if(m.created_at > THREAD_SINCE) THREAD_SINCE = m.created_at;
      if(box.querySelector(`.chat-bubble[data-id="${m.id}"]`)) return;
      if(box.querySelector('p.muted.center-text')) box.innerHTML = '';
      box.insertAdjacentHTML('beforeend', withDay(m, me)); added++;
    });
    if(added){ scrollChat(); if(!document.hidden) markRead(currentChatWith); }
  } catch(e) {} finally { catchingUp = false; refreshChatBadge(); }
}

  prefs = prefs || getMsgPrefs();

                 tag: 'chat-' + m.sender_id, renotify: true, data: { url: '/?chat=' + encodeURIComponent(m.sender_id), chatWith: m.sender_id } };
  try {

// ---- live updates ----
function listenForMessages(){
  if(msgChannel || !currentUser) return;
  const me = currentUser.id;
  msgChannel = sb.channel('sphere-messages-' + me)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sp_messages', filter: `receiver_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      const box = document.getElementById('chatBox');
      const inThread = !!box && currentScreenName === 'chatThread' && m.sender_id === currentChatWith && (!currentChatJob || m.job_id === currentChatJob);
      if(inThread && box.querySelector(`.chat-bubble[data-id="${m.id}"]`)) return;   // already shown (catch-up got it first)
      if(inThread){
        if(m.created_at && (!THREAD_SINCE || m.created_at > THREAD_SINCE)) THREAD_SINCE = m.created_at;
        box.insertAdjacentHTML('beforeend', withDay(m, me));
        scrollChat();
        if(!document.hidden) markRead(m.sender_id); else markDelivered();
      } else {
        markDelivered();
      }
      alertIncoming(m, inThread);
      refreshChatBadge();
      if(currentScreenName === 'chatList') nav('chatList');
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sp_messages', filter: `sender_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      if((m.text && m.text.includes('📵')) || (m.mod_status && m.mod_status !== 'ok')){ refreshBubble(m); return; }
      const t = document.querySelector(`.chat-bubble[data-id="${m.id}"] .tick`);
      if(t) t.outerHTML = tickHtml(m);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sp_messages', filter: `receiver_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      if((m.text && m.text.includes('📵')) || (m.mod_status && m.mod_status !== 'ok')) refreshBubble(m);
    })
    .subscribe(rtStatus('msg'));
}

  ]);

async function insertMessage(row){
  const user = getCurrentUser();
  const base = { sender_id: user.id, receiver_id: currentChatWith, text: '' };
  if(currentChatJob) base.job_id = currentChatJob;
  if(REPLY_TO && !('reply_to' in row)) row = Object.assign({}, row, { reply_to: REPLY_TO.id });
  let { data, error } = await sb.from('sp_messages').insert(Object.assign({}, base, row)).select().single();
  if(error && row.reply_to && /reply_to|column|schema cache/i.test(error.message || '')){
    const r2 = Object.assign({}, row); delete r2.reply_to;   // database without replies yet (034): send as a normal message
    ({ data, error } = await sb.from('sp_messages').insert(Object.assign({}, base, r2)).select().single());
  }
  if(error && base.job_id && /job_id|column|schema cache/i.test(error.message || '')){
    delete base.job_id;   // database not updated yet (009)
    ({ data, error } = await sb.from('sp_messages').insert(Object.assign(base, row)).select().single());
  }
  if(error){
    if(/blocked/i.test(error.message || '')) alert('Message not sent — one of you has blocked the other.');
    else if(/row-level security/i.test(error.message || '')) alert('Message not sent. You cannot message this person right now.');
    else if(!dbErr(error)) alert('This message could not be sent. Please try again.');
    return null;
  }
  const box = document.getElementById('chatBox');
  if(box){

let SENDING = false;
async function sendMsg(){
  const input = document.getElementById('chatInput'); if(!input) return;
  const text = input.value.trim();
  if(!text || SENDING) return;                       // repeated taps never send twice
  SENDING = true; const btn = document.getElementById('sendBtn'); if(btn) btn.disabled = true;
  try {
    const ok = await insertMessage({ text });
    if(ok){ input.value = ''; clearReply(); }        // clear only after it was really sent
  } finally {
    SENDING = false; if(btn) btn.disabled = false;
    try { input.focus({ preventScroll: true }); } catch(e) { input.focus(); }   // keyboard stays open
  }
}

async function uploadChatFile(blobOrFile, ext, type){
  const user = getCurrentUser();
  const path = `${user.id}/chat/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from(CHAT_BUCKET).upload(path, blobOrFile, { contentType: type, upsert: false });
  if(error) throw error;
  return path;
}

async function sendChatMedia(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const kind = f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : null;
  if(!kind){ alert('You can send photos and videos here.'); return; }
  if(f.size > CHAT_MAX_MB * 1024 * 1024){ alert(`File is bigger than ${CHAT_MAX_MB} MB. Share big videos as a Google Drive link.`); return; }
  const btn = document.getElementById('sendBtn'); if(btn) btn.disabled = true;
  try {
    const ext = (f.name.split('.').pop() || (kind === 'image' ? 'jpg' : 'mp4')).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
    const path = await uploadChatFile(f, ext, f.type);
    const caption = (document.getElementById('chatInput').value || '').trim();
    if(caption) document.getElementById('chatInput').value = '';
    await insertMessage({ text: caption, media_path: path, media_type: kind, media_name: f.name.slice(0, 80) });
  } catch(e){ alert('Upload failed: ' + (e.message || e)); }
  if(btn) btn.disabled = false;
}

// ---- voice messages ----
let recMedia = null, recChunks = [], recStart = 0, recTimer = null, recStream = null;
function recording(){ return !!(recMedia && recMedia.state === 'recording'); }
function showRecBar(on){
  const bar = document.getElementById('recBar'), input = document.getElementById('chatInput'), mic = document.getElementById('micBtn');
  if(bar) bar.style.display = on ? 'flex' : 'none';
  if(input) input.style.display = on ? 'none' : '';
  if(mic) mic.style.display = on ? 'none' : '';
}
async function startVoice(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    alert('Voice messages are not supported here. Please use Chrome.'); return;
  }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ alert('Please allow the microphone to send voice messages.'); return; }
  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  recMedia = new MediaRecorder(recStream, type ? { mimeType: type } : undefined);
  recChunks = [];
  recMedia.ondataavailable = (e) => { if(e.data && e.data.size) recChunks.push(e.data); };
  recMedia.start();
  recStart = Date.now();
  showRecBar(true);
  recTimer = setInterval(() => {
    const sec = (Date.now() - recStart) / 1000;
    const t = document.getElementById('recTime'); if(t) t.textContent = fmtDur(sec);
    if(sec >= 120) stopVoice(true);   // max 2 minutes
  }, 500);
}
function stopVoice(send){
  if(!recMedia) return;
  clearInterval(recTimer);
  const media = recMedia; recMedia = null;
  media.onstop = async () => {
    if(recStream) recStream.getTracks().forEach(t => t.stop());
    showRecBar(false);
    const secs = Math.round((Date.now() - recStart) / 1000);
    if(!send || secs < 1) return;
    const type = (media.mimeType || 'audio/webm').split(';')[0];
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    try {
      const path = await uploadChatFile(new Blob(recChunks, { type }), ext, type);
      await insertMessage({ media_path: path, media_type: 'audio', media_name: 'Voice message', duration_sec: secs });
    } catch(e){ alert('Voice message failed: ' + (e.message || e)); }
  };
  media.stop();
}

async function extendDeadline(jobId){
  const d = document.getElementById('newDeadline').value;
  if(!d){ alert('Choose a new deadline'); return; }
  if(d < todayIST()){ alert('Deadline cannot be in the past'); return; }
  if(!await updateJob(jobId, { deadline: d })) return;
  alert('Job reopened ✅');
  currentJobId = jobId; nav('projectStatus');
}
async function addRawFiles(jobId, input){
  const job = await getJob(jobId);
  if(!job) return;
  if(job.rawFiles.length + input.files.length > MAX_RAW_FILES){ alert(`You can attach up to ${MAX_RAW_FILES} files per job`); input.value = ''; return; }
  try {
    const added = await uploadRawFiles(input.files, document.getElementById('rawAddStatus'));
    if(!await updateJob(jobId, { raw_files: [...job.rawFiles, ...added] })){
      await sb.storage.from(RAW_BUCKET).remove(added.map(x => x.path)); return;
    }
    if(job.assignedEditor) await notify(job.assignedEditor, 'New files added 📎', `The client added ${added.length} file(s) to your ${job.category} project.`);
    currentJobId = jobId; nav('projectStatus');
  } catch(e){ alert('Upload failed: ' + (e.message || e)); input.value = ''; }
}
async function removeRawFile(jobId, idx){
  if(!confirm('Remove this file?')) return;
  const job = await getJob(jobId);
  if(!job || !job.rawFiles[idx]) return;
  const f = job.rawFiles[idx];
  if(!await updateJob(jobId, { raw_files: job.rawFiles.filter((_, i) => i !== idx) })) return;
  await sb.storage.from(RAW_BUCKET).remove([f.path]);
  currentJobId = jobId; nav('projectStatus');
}
async function uploadDelivery(jobId){

async function savePayoutAccount(editorId){
  const acc = document.getElementById('acc_' + editorId).value.trim();
  if(acc && !/^acc_[A-Za-z0-9]{8,}$/.test(acc)){ alert('Account ID must start with "acc_" (copy it from Razorpay Route > Linked Accounts).'); return; }
  const { error } = await sb.from('profiles').update({ razorpay_account_id: acc || null }).eq('id', editorId);
  if(dbErr(error)) return;
  if(acc) await notify(editorId, 'Payout account ready ✅', 'Your payout account is set up. Payments will now go straight to your bank.');
  alert('Saved!');
  nav('admin');
}
async function markPaidManually(jobId){
  const ref = prompt('Enter the UPI / bank transfer reference (UTR) number:');
  if(ref === null) return;
  const job = await getJob(jobId);
  if(!job) return;
  const { error } = await sb.from('sp_jobs').update({ payout_status: 'paid-manually', razorpay_transfer_id: ref.trim() || 'manual' }).eq('id', jobId);
  if(dbErr(error)) return;
  await notify(job.assignedEditor, 'Payment Sent 💸', `₹${job.editorAmount || editorShare(job.lockedAmount)} has been sent to you.${ref.trim() ? ' Ref: ' + ref.trim() : ''}`);
  nav('admin');
}
async function resolveReport(reportId, reporterId, againstId){

async function loadSuspicious(){
  let lim = 3;
  try {
    const { data } = await sb.from('sp_settings').select('value').eq('key', 'strike_limit').maybeSingle();
    const v = parseInt(String(data && data.value).replace(/\D/g, ''), 10);
    if(v > 0) lim = v;
  } catch(e) {}
  const { data: flags, error } = await sb.from('sp_mod_flags').select('*').or(`strike_count.gte.${lim},is_suspended.eq.true`);
  if(error){ console.warn('Suspicious list not ready:', error.message); return { ready: false, list: [], lim }; }
  const { data: outRep } = await sb.from('sp_reports').select('against_id, chat_user_id').eq('status', 'open').eq('reason', OUTSIDE_DEAL_REASON);
  const map = {};
  const fill = f => { map[f.user_id] = Object.assign(map[f.user_id] || { id: f.user_id, reports: 0 }, { strikes: f.strike_count, suspended: f.is_suspended, warnedAt: f.warned_at }); };
  (flags || []).forEach(fill);
  (outRep || []).forEach(r => { const id = r.chat_user_id || r.against_id; if(!id) return; map[id] = map[id] || { id, strikes: 0, suspended: false, reports: 0 }; map[id].reports++; });
  const ids = Object.keys(map);
  if(ids.length === 0) return { ready: true, list: [], lim };
  const { data: more } = await sb.from('sp_mod_flags').select('*').in('user_id', ids);
  (more || []).forEach(fill);
  const { data: st } = await sb.from('sp_mod_strikes').select('user_id, source, original_text, created_at').in('user_id', ids).eq('cleared', false).order('created_at', { ascending: false }).limit(300);
  (st || []).forEach(m => { const x = map[m.user_id]; x.samples = x.samples || []; if(x.samples.length < 3) x.samples.push(m); });
  const people = await getProfilesByIds(ids);
  const list = ids.map(id => Object.assign(map[id], { p: people[id] }))
    .sort((a, b) => (b.strikes + b.reports * 2) - (a.strikes + a.reports * 2));
  return { ready: true, list, lim };
}

/* ============ PART 2: AUTH + ROLE ACCESS ============
   Who can open which screen. nav() asks routeGate() first.
   Access levels:
     public       — anyone, even logged out (welcome, login, sign up, password reset)
     auth         — logged in, profile not finished yet (pick role, add phone)
     user         — any finished account (Client, Editor or Admin)
     client       — Client mode (clients, editors switched to Client, admins in Admin mode)
     editor       — Editor mode (editors, admins switched to Editor)
     editorAccount— an Editor account in any mode, or an admin in Editor mode
     admin        — Admin accounts only
   This protects the screens. The database (RLS + triggers) protects the data. */
const ROUTE_ACCESS = Object.freeze({
  splash: 'public', onboard1: 'public', onboard2: 'public', onboard3: 'public',
  authLanding: 'public', login: 'public', signup: 'public', resetPassword: 'public',
  chooseRole: 'auth', addPhone: 'auth',
  home: 'user', profile: 'user', settingsScreen: 'user', notifications: 'user',
  chatList: 'user', chatThread: 'user', chatInfo: 'user',
  support: 'user', report: 'user', myReports: 'user', sphereAI: 'user',
  categories: 'user', categoryDetail: 'user', allEditors: 'user', verifiedEditorsScreen: 'user',
  editorProfile: 'user', jobs: 'user', projectStatus: 'user', portfolio: 'user',
  escrowScreen: 'user', vaultScreen: 'user', editProfile: 'user', previewPlayer: 'user', notifSettings: 'user', premiumScreen: 'client',
  postJob: 'client', applications: 'client', payment: 'client', savedList: 'client', ratings: 'client',
  jobBidScreen: 'editor',
  editorDetails: 'editorAccount', verificationStatus: 'editorAccount', editorProfileEdit: 'editorAccount', proScreen: 'editorAccount',
  admin: 'admin', caseFile: 'admin', adminClassic: 'admin', adminProject: 'admin', adminUser: 'admin'
});
// Screens that belong to one job: only the people in that job (or an admin) may open them.
const JOB_SCREENS = Object.freeze({ projectStatus: 'party', applications: 'owner', payment: 'owner', ratings: 'owner', previewPlayer: 'member' });

function routeAccess(screen){ return ROUTE_ACCESS[screen] || 'user'; }
function hasRouteAccess(level, u){
  switch(level){
    case 'public': return true;
    case 'auth': return !!(u || pendingAuthUser);
    case 'user': return !!u;
    case 'client': return isClientRole(u);
    case 'editor': return usingMode(u, ROLES.EDITOR);
    case 'editorAccount': return isEditorAccount(u) || (isAdminUser(u) && usingMode(u, ROLES.EDITOR));
    case 'admin': return isAdminUser(u);
    default: return !!u;
  }
}
async function routeGate(screen){
  const level = routeAccess(screen);
  const u = getCurrentUser();
  if(level === 'public') return { ok: true };
  if(!u && !(level === 'auth' && pendingAuthUser)) return { ok: false, to: 'authLanding' };
  if(!hasRouteAccess(level, u)){
    if(level === 'admin') return { ok: false, to: 'home', msg: 'This page is for admins only.' };
    if(level === 'editor' || level === 'editorAccount'){
      return { ok: false, to: 'home', msg: isEditorAccount(u) || isAdminUser(u)
        ? 'This is part of Editor mode. Switch to Editor from Settings.'
        : 'This page is for editors. You can become an editor from Settings.' };
    }
    if(level === 'client') return { ok: false, to: 'home', msg: isAdminUser(u)
      ? 'This is part of Admin mode. Switch back to Admin mode from Settings.'
      : 'This is part of Client mode. Switch to Client from Settings to hire editors.' };
    return { ok: false, to: 'home' };
  }
  const rule = JOB_SCREENS[screen];
  if(rule && typeof currentJobId !== 'undefined' && currentJobId){
    const job = await getJob(currentJobId);
    if(job){
      const owner = job.clientId === u.id;
      const party = owner || job.assignedEditor === u.id;
      const allowed = isAdminUser(u) || (rule === 'owner' ? owner : rule === 'member' ? party : (party || job.status === 'open'));
      if(!allowed) return { ok: false, to: 'jobs', msg: 'You do not have access to this project.' };
    }
  }
  return { ok: true };
}

// Account status straight from the database (role, ✔ tick, suspension). Never blocks login if it fails.
async function loadAccountStatus(u){
  try {
    const { data, error } = await sb.rpc('sp_core_whoami');
    if(error || !data) return;
    u.suspended = !!data.suspended;
    if(data.role && normRole(data.role) && normRole(data.role) !== u.baseRole) console.warn('Sphere: role changed on the server, reloading profile next time.');
  } catch(e) {}
}

  return `<div class="card" style="border:1.5px solid #c62828; margin:12px 16px 0;">
    <b style="color:#c62828;">⛔ Your account is suspended</b>

// Everything that belongs to the logged-in account is cleared on logout / session end
let loggingOut = false;
function clearSessionState(){
  if(msgChannel){ try { sb.removeChannel(msgChannel); } catch(e){} msgChannel = null; }
  RT_OK = { msg: false, notif: false }; if(rtPollTimer){ clearInterval(rtPollTimer); rtPollTimer = null; }
  currentUser = null;
  pendingAuthUser = null;
  ADMIN_PIN = '';
  if(typeof currentChatWith !== 'undefined') currentChatWith = null;
  if(typeof currentJobId !== 'undefined') currentJobId = null;
  if(typeof aiHistory !== 'undefined') aiHistory = [];
}

// Session ended somewhere else (logged out in another tab, or the login expired) → back to the welcome screen
sb.auth.onAuthStateChange((event) => {
  if(event !== 'SIGNED_OUT' || loggingOut) return;
  const wasIn = !!currentUser;
  clearSessionState();
  if(wasIn && routeAccess(currentScreenName) !== 'public'){
    setTimeout(() => { alert('You have been logged out. Please log in again.'); nav('authLanding'); }, 0);
  }
});

// One project as the client sees it: friendly status, what (if anything) they need to do
function clientProjectView(j, bidCount, editor, user){
  const key = isExpired(j) ? 'expired' : (j.status === 'delivered' && ['disputed', 'team_review'].includes(j.reviewState)) ? j.reviewState : (CLIENT_STATUS[j.status] ? j.status : 'open');
  let action = '';
  if(key === 'open' && bidCount > 0) action = bidCount + (bidCount === 1 ? ' bid' : ' bids') + ' received — choose an editor';
  if(key === 'negotiating' && j.proposedBy && j.proposedBy !== user.id) action = 'The editor sent a price — reply';
  if(key === 'payment-pending') action = 'Pay to start the work';
  if(key === 'delivered') action = 'Watch the final video — release payment or tell us what is wrong';
  const w = WORK_CACHE[j.id];
  if(w && key === 'in-progress'){
    if(w.pending_extension_hours) action = 'The editor asked for more time — reply';
    else if(w.phase === 'preview') action = 'Preview is ready — have a look';
    else if(workState(w).key === 'late') action = 'The editor is late — you can give more time';
  }
  return {
    job: j, key, meta: CLIENT_STATUS[key], action, bids: bidCount,
    active: CLIENT_ACTIVE.includes(key),
    editorName: editor ? (editor.name || 'Editor') : '',
    amount: Number(j.lockedAmount || j.budget || 0)
  };
}
async function loadClientProjects(user){
  const { data, error } = await sb.from('sp_jobs').select('*').eq('client_id', user.id).order('created_at', { ascending: false });
  if(error){ console.error(error); return { ok: false, items: [], stats: clientStats([]) }; }
  const list = (data || []).map(mapJob);
  const openIds = list.filter(j => j.status === 'open' && !isExpired(j)).map(j => j.id);
  const bids = {};
  if(openIds.length){
    const { data: apps } = await sb.from('sp_applications').select('job_id').in('job_id', openIds);
    (apps || []).forEach(a => { bids[a.job_id] = (bids[a.job_id] || 0) + 1; });
  }
  const edIds = [...new Set(list.map(j => j.assignedEditor).filter(Boolean))];
  const eds = edIds.length ? await getProfilesByIds(edIds) : {};
  await loadWorkFor(list.filter(j => j.assignedEditor).map(j => j.id));
  const items = list.map(j => clientProjectView(j, bids[j.id] || 0, eds[j.assignedEditor], user));
  return { ok: true, items, stats: clientStats(items) };
}
function clientStats(items){
  return {
    total: items.length,
    active: items.filter(x => x.active).length,
    needYou: items.filter(x => x.action).length,
    done: items.filter(x => x.key === 'approved' || x.key === 'closed').length,
    spent: items.filter(x => CLIENT_PAID.includes(x.key)).reduce((t, x) => t + x.amount, 0)
  };
}
function rupees(n){ return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function clientStatusChip(meta){
  return `<span class="cl-status" style="color:${meta.color}; background:${meta.bg};">${esc(meta.label)}</span>`;
}

let CLIENT_DASH_CACHE = { uid: null, html: '' };   // Part C: last client dashboard, shown at once on return
async function renderClientDashboard(){
  const box = document.getElementById('clientDash');
  const user = getCurrentUser();
  if(!box || !isClientRole(user)) return;
  const res = await loadClientProjects(user);
  const el = document.getElementById('clientDash');
  if(!el) return;   // user already left Home
  const first = esc(String(user.name || '').split(' ')[0] || 'there');
  const st = res.stats;
  CLIENT_DASH_CACHE.uid = user.id;
  if(!res.ok){
    el.innerHTML = CLIENT_DASH_CACHE.html = `<div class="cl-hello">${avatarHtml(user)}<div><b>Hi, ${first}${premiumBadgeSlot(user.id)} 👋</b><span>Couldn't load your projects. Pull down to refresh.</span></div>${premiumPill()}</div>`;

    <div class="cl-stats">

      <div class="cl-stat ${st.needYou ? 'warn' : ''}" onclick="nav('jobs', { tab: 'active' })"><b>${st.needYou}</b><span>Need you</span></div>
      <div class="cl-stat" onclick="nav('jobs', { tab: 'history' })"><b>${st.done}</b><span>Completed</span></div>
    </div>
    ${needs.length ? `<div class="section-title" style="padding:0; margin-top:4px;"><h3>Needs your action</h3><button class="sec-min" aria-label="${needsMin() ? 'Show' : 'Hide'} needs your action" onclick="toggleNeedsMin()">${needsMin() ? '➕' : '➖'}</button></div>${needsMin() ? '' : needs.map(x => clientProjectCard(x, true)).join('')}` : ''}

    <div id="ad_client_home"></div>`;
  fillSponsored('client_home');

}

// ---- My Projects (client view of the Jobs tab)
async function clientProjectsScreen(user, data){
  const tab = (data && ['active', 'history', 'all', 'drafts'].includes(data.tab)) ? data.tab : 'active';
  const [res, drafts] = await Promise.all([loadClientProjects(user), loadJobDrafts()]);
  const items = res.items;
  const groups = {
    active: items.filter(x => x.active).sort((a, b) => (b.action ? 1 : 0) - (a.action ? 1 : 0)),
    history: items.filter(x => !x.active),
    all: items
  };
  groups.drafts = drafts;
  const list = groups[tab];
  const tabBtn = (k, label) => `<button class="${tab === k ? 'on' : ''}" onclick="nav('jobs', { tab: '${k}' })">${label} (${groups[k].length})</button>`;
  return `
  <div class="header"><h1>My Projects</h1><p>${res.stats.total ? `${res.stats.total} total · ${rupees(res.stats.spent)} paid through Sphere` : 'Everything you hire for, in one place'}</p></div>
  <div class="screen" style="padding-top:0;">
    <button class="btn btn-primary" style="margin-bottom:16px;" onclick="nav('postJob')">+ Post New Job</button>
    <div class="cl-tabs">${tabBtn('active', 'Active')}${tabBtn('history', 'History')}${tabBtn('all', 'All')}${tabBtn('drafts', 'Drafts')}</div>
    ${!res.ok ? '<p class="muted">Could not load your projects. Please try again.</p>' : ''}
    ${tab === 'drafts'
      ? (drafts.length ? drafts.map(jobDraftCard).join('') : `<div class="card cl-empty"><div class="cl-empty-ic">📝</div><b>No drafts</b><p>When you tap "Save as draft" while posting a job, it waits here until you post it.</p><button class="btn btn-primary" onclick="nav('postJob')">Post a job</button></div>`)
      : `${res.ok && list.length === 0 ? clientEmptyState(items.length === 0 ? 'all' : tab) : ''}${list.map(x => clientProjectCard(x, false)).join('')}`}
  </div>`;
}

async function editProfilePhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try {
    const old = currentUser.avatar;
    const path = await uploadImage(file, 'avatar', 400);
    const { error } = await sb.from('profiles').update({ avatar_url: path }).eq('id', currentUser.id);
    if(error){ await removeMedia(path); throw error; }
    await removeMedia(old);
    await fetchAndSetCurrentUser();
    const box = document.getElementById('epAvatar');
    if(box) box.innerHTML = avatarHtml(getCurrentUser(), 'margin:0 auto 8px; width:84px; height:84px; font-size:34px;');
  } catch(e){ alert('Photo upload failed: ' + (e.message || e)); }
}
async function saveEditProfile(){
  const u = getCurrentUser();
  const name = document.getElementById('epName').value.trim();
  if(name.length < 2 || name.length > 60){ alert('Name must be 2–60 characters'); return; }
  const phone = readPhone('epPhone');
  if(!phone) return;
  const changes = {};
  if(name !== u.name) changes.full_name = name;
  if(phone !== cleanIndianPhone(u.phone)) changes.phone = phone;
  if(Object.keys(changes).length === 0){ nav('profile'); return; }
  const btn = document.getElementById('epSave'); if(btn) btn.disabled = true;
  const { error } = await sb.from('profiles').update(changes).eq('id', u.id);
  if(btn) btn.disabled = false;
  if(dbErr(error)) return;
  await fetchAndSetCurrentUser();
  if(changes.full_name) contactCheck(name, (getCurrentUser() || {}).name);
  alert('Profile saved ✅');
  nav('profile');
}

async function profileUpdate(changes){
  let { error } = await sb.from('profiles').update(changes).eq('id', currentUser.id);
  if(error && /column|schema cache|does not exist|Could not find/i.test(error.message || '')){
    const old = Object.fromEntries(Object.entries(changes).filter(([k]) => !PART4_COLUMNS.includes(k)));
    if(Object.keys(old).length === 0) return { error: { message: 'This needs the latest database update (004_editor_profile.sql).' }, skipped: true };
    ({ error } = await sb.from('profiles').update(old).eq('id', currentUser.id));
    return { error, skipped: true };
  }
  return { error, skipped: false };
}

// ---- Work + rating numbers for one editor (from jobs assigned to them + reviews)
async function loadEditorWork(user){
  const [mine, rates] = await Promise.all([
    sb.from('sp_jobs').select('*').eq('assigned_editor', user.id).order('created_at', { ascending: false }),
    sb.from('sp_ratings').select('stars, review, created_at').eq('editor_id', user.id).order('created_at', { ascending: false })
  ]);
  const jobs = (mine.data || []).map(mapJob);
  await loadWorkFor(jobs.filter(j => EDITOR_ACTIVE.includes(j.status)).map(j => j.id));
  const r = rates.data || [];
  const done = jobs.filter(j => EDITOR_DONE.includes(j.status));
  return {
    ok: !mine.error,
    jobs,
    active: jobs.filter(j => EDITOR_ACTIVE.includes(j.status)),
    done,
    earned: done.reduce((t, j) => t + Number(j.editorAmount || editorShare(j.lockedAmount || j.budget)), 0),
    rating: r.length ? Math.round(r.reduce((t, x) => t + Number(x.stars || 0), 0) / r.length * 10) / 10 : 0,
    reviews: r.length,
    lastReviews: r.filter(x => x.review).slice(0, 3)
  };
}
function editorJobAction(j, user){
  if(j.status === 'negotiating' && j.proposedBy && j.proposedBy !== user.id) return 'The client sent a price — reply';
  const w = WORK_CACHE[j.id];
  if(j.status === 'in-progress' && w){
    if(w.phase === 'preview') return 'Preview sent — waiting for the client';
    if(w.pending_extension_hours) return 'Waiting for the client to answer your time request';
    const st = workState(w);
    if(st.key === 'late') return 'LATE — send the preview now';
    if(st.key === 'grace') return 'Deadline passed — send the preview in the grace time';
    return 'Send the preview — ' + st.short;
  }
  if(j.status === 'in-progress') return 'Work on it and deliver the video';
  return '';
}
function editorJobCard(j, user){
  const m = EDITOR_STATUS[isExpired(j) ? 'refunded' : j.status] || EDITOR_STATUS.open;
  const label = isExpired(j) ? 'Expired' : m.label;
  const action = j.assignedEditor === user.id ? editorJobAction(j, user) : '';
  const amount = j.assignedEditor === user.id && j.lockedAmount ? Number(j.editorAmount || editorShare(j.lockedAmount)) : Number(j.budget || 0);
  return `<div class="card cl-proj ${action ? 'cl-action' : ''}" onclick="openJob('${esc(j.id)}')">

}

  return `<div class="btn-row" style="margin-top:8px; flex-wrap:wrap;">

    ${st === 'rejected' ? `<button class="btn-sm" onclick="edReview('${e.id}','reopen')">↩️ Re-open</button>` : `<button class="btn-sm" style="color:#c62828;" onclick="edReview('${e.id}','reject')">✖ Reject</button>`}
  </div>`;
}
async function edReview(id, action){
  if(needPin()) return;
  let note = null;
  if(action === 'reject'){
    note = prompt('Reason for rejecting (the editor will see this):', '');
    if(note === null) return;
    if(!note.trim()){ alert('Please write a reason.'); return; }
  } else if(action === 'reject_fee'){
    note = prompt('Message for the editor (optional):', 'We could not find your verification payment. Please check the transaction ID and submit it again.');
    if(note === null) return;
  } else if(!confirm({ confirm_fee: 'Mark the ₹' + VERIFY_FEE + ' fee as received?', reopen: 'Re-open this application?' }[action])) return;
  const { error } = await sb.rpc('sp_ed_review', { p_editor: id, p_action: action, p_note: note, p_pin: ADMIN_PIN });
  if(error){ alert(error.message); if(/PIN/i.test(error.message)){ ADMIN_PIN = ''; nav('admin'); } return; }
  alert({ confirm_fee: 'Fee marked as received ✅', reject_fee: 'Editor asked to pay again', reject: 'Application rejected — the editor has been told', reopen: 'Application re-opened' }[action]);
  nav('admin');
}

  };

    // database not updated yet (005) — post with the original fields
    const old = Object.fromEntries(Object.entries(row).filter(([k]) => !PART5_JOB_COLUMNS.includes(k)));
    const extra = [v.video_length && 'Length: ' + v.video_length, v.video_format && 'Format: ' + v.video_format, v.style_notes && 'Style: ' + v.style_notes, v.reference_links && 'References: ' + v.reference_links].filter(Boolean).join('\n');
    if(extra) old.description = v.description + '\n\n' + extra;

  const label = v.title || v.category;
