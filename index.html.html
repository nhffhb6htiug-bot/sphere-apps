<style>
:root{
  --blue:#1657ff;
  --blue-dark:#0038c9;
  --bg:#e8edf9;
  --text:#111111;
  --muted:#6b7280;
  --card:#ffffff;
  --border:#e7e9ee;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{color-scheme:light;}
html,body{width:100%; overflow-x:hidden; color-scheme:light;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(180deg,#dfe6fb 0%,#eef1fb 220px,var(--bg) 220px);
  color:var(--text);
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:92px;
}
img{max-width:100%; display:block;}
.hidden{display:none !important;}
.screen{padding:16px; animation:fade .2s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* ===== TOP BAR (Home) ===== */
.topbar{
  display:flex; align-items:center; gap:8px; padding:14px 16px 8px;
}
.icon-btn{
  width:40px; height:40px; border-radius:14px;
  background:linear-gradient(145deg,#5b82ff,#1657ff);
  display:flex; align-items:center; justify-content:center; font-size:17px;
  cursor:pointer; flex-shrink:0; border:none; color:#fff;
  box-shadow:0 4px 10px rgba(22,87,255,.35), inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.15);
}
.search-box{
  flex:1; background:#fff; border-radius:30px; padding:9px 16px;
  display:flex; align-items:center; gap:8px; color:#999; border:1px solid var(--border);
  min-width:0; box-shadow:inset 0 1px 4px rgba(0,0,0,.08), 0 1px 0 rgba(255,255,255,.8);
}
.search-box input{border:none; outline:none; flex:1; font-size:13px; background:transparent; min-width:0;}
.topbar-logo{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.topbar-logo img{width:26px; height:26px; border-radius:6px; object-fit:cover;}
.topbar-logo span{font-weight:900; color:var(--blue); font-size:15px;}

/* ===== SECTION TITLES ===== */
.section-title{display:flex; justify-content:space-between; align-items:center; margin:18px 0 12px; padding:0 16px;}
.section-title h3{font-size:15px; font-weight:800;}
.section-title a{font-size:12px; color:#e8543a; font-weight:700; text-decoration:none; cursor:pointer;}

/* ===== EXPLORE (circular icons) ===== */
.explore-row{
  display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:0 16px;
}
.explore-item{text-align:center; cursor:pointer;}
.explore-circle{
  width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
  background:#111; margin-bottom:6px; border:1px solid var(--border);
}
.explore-circle img{width:100%; height:100%; object-fit:cover;}
.explore-item span{font-size:10px; font-weight:600; color:var(--text); line-height:1.2; display:block;}

/* ===== TOOLS & RESOURCES (3 big square cards, text baked in image) ===== */
.tools-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;
}
.tool-card{cursor:pointer; text-align:center;}
.tool-card-img{
  aspect-ratio:1/1; border-radius:18px; overflow:hidden;
  background:var(--card); border:1px solid var(--border); margin-bottom:6px;
}
.tool-card-img img{width:100%; height:100%; object-fit:cover;}
.tool-card span{font-size:11px; font-weight:600; color:var(--text); line-height:1.2; display:block;}

/* ===== SPHERE SERVICES (6 cards, 3 cols x 2 rows, text baked in image) ===== */
.services-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;
}
.service-card{
  aspect-ratio:1/1; border-radius:18px; overflow:hidden; cursor:pointer;
  background:var(--card); border:1px solid var(--border);
}
.service-card img{width:100%; height:100%; object-fit:cover;}

/* ===== GENERIC (other screens) ===== */

.btn{width:100%; padding:15px; border-radius:30px; border:none; font-weight:700; font-size:15px; cursor:pointer; text-align:center;}
.btn-primary{background:var(--blue); color:#fff;}

.field .phone-wrap input{border-radius:0 12px 12px 0; flex:1; min-width:0;}

<script>
const SUPABASE_URL = 'https://pwcchgjsgkwrsvbzqspp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_M8dweSjU8gW45msJ_Gt4Lw_eAm3RALW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const RAZORPAY_KEY_ID = 'rzp_test_TgjXNstdNBkSsP';
let currentUser = null;
let pendingAuthUser = null;

async function signInWithGoogle(){
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin,
      // Har baar Google ki saari accounts ki list dikhao (sirf pehli baar nahi)
      queryParams: { prompt: 'select_account' }
    }
  });
  if(error){ alert(error.message); }
}

function getMode(uid){ try { return localStorage.getItem('sphere_mode_' + uid); } catch(e){ return null; } }
function setMode(uid, m){ try { localStorage.setItem('sphere_mode_' + uid, m); } catch(e){} }
function toAppUser(profile){
  if(!profile) return null;
  const baseRole = (profile.role||'').toLowerCase();
  // Editor chahe toh Client mode me bhi app use kar sakta hai (editors hire karna, job post karna)
  const role = (baseRole === 'editor' && getMode(profile.id) === 'client') ? 'client' : baseRole;
  return {
    id: profile.id,
    role,
    baseRole,
    name: profile.full_name,
    email: profile.email,
    phone: profile.phone,
    category: (profile.categories && profile.categories[0]) || '',
    skills: (profile.skills||[]).join(', '),
    experience: profile.experience_years || '',
    price: profile.price_range || '',
    sample: profile.sample_video_url || '',
    portfolio: profile.portfolio_url || '',
    payoutAccount: profile.razorpay_account_id || '',
    avatar: profile.avatar_url || '',
    verified: !!profile.is_verified,
    verificationNote: profile.verification_note || '',
    code: profile.verification_code,
    rating: 0, reviews: 0
  };
}
async function fetchAndSetCurrentUser(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ currentUser = null; return null; }
  let { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  const meta = user.user_metadata || {};
  if((!profile || !profile.role) && meta.role){
    // Email signup ke baad pehli login: profile ab banao (signup ke waqt bhari details se)
    const { error } = await sb.from('profiles').upsert({
      id: user.id, role: meta.role, full_name: meta.full_name || user.email.split('@')[0],
      email: user.email, phone: meta.phone || ''
    }, { onConflict: 'id' });
    if(error) console.error(error);
    ({ data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
  }
  if(profile && !profile.role) profile = null;  // role abhi chuna nahi -> chooseRole screen
  // Onboarding adhoora (role/number kabhi confirm nahi kiya) -> Client/Editor + number wali screen dikhao
  if(profile && String(profile.role).toUpperCase() !== 'ADMIN' && !cleanIndianPhone(profile.phone)) profile = null;
  currentUser = toAppUser(profile);
  return currentUser;
}

function esc(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

function getCurrentUser(){ return currentUser; }

let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; });
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW', err)); });
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function installAppItem(){
  if(isStandalone()) return '';
  return menuItem('mobile', 'Install the Sphere app', 'installApp()', { sub: 'Open Sphere from your home screen, full screen' });
}
function installBanner(){
  if(isStandalone()) return '';
  try { if(localStorage.getItem('sphere_install_hide') === '1') return ''; } catch(e){}
  return `<div class="install-banner" id="installBanner">
    <img src="/icon-192.png" alt="">
    <div class="ib-text"><b>Get the Sphere app</b>Full screen, opens from your home screen</div>
    <button class="ib-btn" onclick="installApp()">Install</button>
    <button class="ib-x" title="Hide" onclick="hideInstallBanner()">✕</button></div>`;
}
function hideInstallBanner(){
  try { localStorage.setItem('sphere_install_hide', '1'); } catch(e){}
  const b = document.getElementById('installBanner'); if(b) b.remove();
}
function inAppBrowser(){ return /(FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\))/i.test(navigator.userAgent); }
async function installApp(){
  if(installPrompt){
    installPrompt.prompt();
    const choice = await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    if(choice && choice.outcome === 'accepted') alert('Sphere is being added to your home screen ✅');
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(inAppBrowser() || !installPrompt && !ios && document.referrer.includes('whatsapp')){
    alert('To install: open this link in Chrome (menu ⋮ → "Open in Chrome"), then tap Install.');
    return;
  }
  alert(ios
    ? 'On iPhone: open in Safari, tap the Share button (square with arrow), then "Add to Home Screen".'
    : 'In Chrome, open the menu (⋮) and tap "Install app" or "Add to Home screen". If you opened this link from WhatsApp, first tap ⋮ → "Open in Chrome".');
}
// India ki aaj ki date (YYYY-MM-DD) — deadline isi se check hoti hai
function todayIST(){ return new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10); }
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(String(d).slice(0, 10) + 'T00:00:00');
  return isNaN(dt) ? esc(d) : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function isExpired(j){ return !!(j && j.status === 'open' && j.deadline && String(j.deadline).slice(0, 10) < todayIST()); }
function notExpiredFilter(){ return 'deadline.is.null,deadline.gte.' + todayIST(); }
const RAW_BUCKET = 'sphere-raw';
const MAX_RAW_FILES = 5, MAX_RAW_MB = 50;
function rawUrl(path){ return path ? sb.storage.from(RAW_BUCKET).getPublicUrl(path).data.publicUrl : ''; }
async function uploadRawFiles(fileList, statusEl){
  const files = Array.from(fileList || []);
  for(const f of files){
    if(!/^(image|video)\//.test(f.type)) throw new Error(`"${f.name}" is not a photo or video`);
    if(f.size > MAX_RAW_MB * 1024 * 1024) throw new Error(`"${f.name}" is bigger than ${MAX_RAW_MB} MB. Share big videos as a Google Drive / WeTransfer link.`);
  }
  const out = [];
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(statusEl) statusEl.textContent = `Uploading ${i + 1} of ${files.length}: ${f.name}…`;
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
    const path = `${currentUser.id}/raw/${Date.now()}_${i}.${ext}`;
    const { error } = await sb.storage.from(RAW_BUCKET).upload(path, f, { contentType: f.type, upsert: false });
    if(error){
      if(out.length) await sb.storage.from(RAW_BUCKET).remove(out.map(x => x.path));
      throw error;
    }
    out.push({ path, name: f.name.slice(0, 80), type: f.type, size: f.size });
  }
  if(statusEl) statusEl.textContent = '';
  return out;
}
function renderRawFiles(files, opts){
  opts = opts || {};
  if(!files || !files.length) return '';
  return `<div class="raw-grid">${files.map((f, i) => {
    const url = rawUrl(f.path);
    const del = opts.removable ? `<button class="raw-del" onclick="event.preventDefault(); event.stopPropagation(); removeRawFile('${opts.jobId}', ${i})">✕</button>` : '';
    return String(f.type || '').startsWith('image/')
      ? `<a class="raw-tile" href="${esc(url)}" target="_blank" rel="noopener">${del}<img src="${esc(url)}" alt="" loading="lazy"><span class="rt-name">${esc(f.name)}</span></a>`
      : `<a class="raw-tile" href="${esc(url)}" target="_blank" rel="noopener">${del}<span class="rt-play">▶</span><span class="rt-name">${esc(f.name)}</span></a>`;
  }).join('')}</div>`;
}

function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo could not be opened. Try a JPG or PNG.')); };
    im.src = url;
  });
}
// Phone ki badi photo ko upload se pehle chhota karo (5 MB -> ~200 KB)
async function compressImage(file, maxDim, quality){
  const im = await loadImageFile(file);
  const scale = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * scale), h = Math.round(im.naturalHeight * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('Could not process the photo')), 'image/jpeg', quality || 0.82));
}
async function uploadImage(file, folder, maxDim){
  if(!file) throw new Error('Choose a photo first');
  if(!file.type.startsWith('image/')) throw new Error('Only photos can be uploaded here (JPG/PNG). For videos, add a YouTube or Drive link.');
  if(file.size > 25 * 1024 * 1024) throw new Error('Photo is larger than 25 MB');
  const blob = await compressImage(file, maxDim || 1280);
  const path = `${currentUser.id}/${folder}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if(error) throw error;
  return path;
}
async function removeMedia(path){
  if(path) { const { error } = await sb.storage.from(MEDIA_BUCKET).remove([path]); if(error) console.error(error); }
}

function cleanIndianPhone(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if(d.length === 12 && d.startsWith('91')) d = d.slice(2);
  if(d.length === 11 && d.startsWith('0')) d = d.slice(1);
  if(!/^[6-9]\d{9}$/.test(d)) return null;
  if(/^(\d)\1{9}$/.test(d)) return null;
  if(['6789012345', '7890123456', '8901234567', '9012345678', '9876543210'].includes(d)) return null;
  return '+91' + d;
}

async function attachRatings(users){
  if(users.length === 0) return users;
  const { data } = await sb.from('sp_ratings').select('editor_id, stars').in('editor_id', users.map(u => u.id));
  const agg = {};
  (data || []).forEach(r => {
    agg[r.editor_id] = agg[r.editor_id] || { sum: 0, n: 0 };
    agg[r.editor_id].sum += r.stars; agg[r.editor_id].n++;
  });
  users.forEach(u => {
    const a = agg[u.id];
    u.rating = a ? Math.round(a.sum / a.n * 10) / 10 : 0;
    u.reviews = a ? a.n : 0;
  });
  return users;
}

}

function onboardScreen(i){
  const d = onboardData[i];
  const isLast = i===onboardData.length-1;
  return `<div class="top-skip"><span onclick="nav('authLanding')">Skip ›</span></div>
  <div class="onboard-wrap">
    <div class="onboard-img" style="background:none;">${img(d.img,'🎬')}</div>
    <h2>${d.title}</h2>
    <p class="muted" style="margin-top:10px; padding:0 10px;">${d.desc}</p>
    <div class="dots">${onboardData.map((_,idx)=>`<div class="dot ${idx===i?'active':''}"></div>`).join('')}</div>
    <div style="padding:0 20px;">
      <button class="btn btn-primary" onclick="nav('${isLast?'authLanding':'onboard'+(i+2)}')">${isLast?'Get Started':'Next'}</button>
    </div>
  </div>`;
}
SCREENS.onboard1 = ()=> onboardScreen(0);
SCREENS.onboard2 = ()=> onboardScreen(1);
SCREENS.onboard3 = ()=> onboardScreen(2);

SCREENS.chooseRole = () => `
  <div class="screen">
    <h2>Welcome!</h2>
    <p class="muted" style="margin-bottom:20px;">How do you want to use Sphere?</p>
    <div class="field">
      <span class="pill active" id="grClient" onclick="selectGoogleRole('client')">Client</span>
      <span class="pill" id="grEditor" onclick="selectGoogleRole('editor')">Editor</span>
    </div>
    ${phoneField('grPhone')}
    <button class="btn btn-primary" onclick="confirmGoogleRole()">Continue</button>
  </div>`;
let googleSelectedRole = 'client';
function selectGoogleRole(r){
  googleSelectedRole = r;
  document.getElementById('grClient').classList.toggle('active', r==='client');
  document.getElementById('grEditor').classList.toggle('active', r==='editor');
}
async function confirmGoogleRole(){
  const u = pendingAuthUser;
  const phone = readPhone('grPhone');
  if(!phone) return;
  const name = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || u.email.split('@')[0];
  const { error } = await sb.from('profiles').upsert({
    id: u.id, role: googleSelectedRole.toUpperCase(), full_name: name, email: u.email, phone
  }, { onConflict: 'id' });
  if(error){ alert(error.message); return; }
  await fetchAndSetCurrentUser();
  if(!currentUser){ alert('Could not save your profile. Please try again.'); return; }
  if(currentUser.role !== googleSelectedRole){
    alert('Your account is already set up as ' + (currentUser.role === 'editor' ? 'Editor' : 'Client') + '. To change your role, contact Support.');
  }
  if(currentUser.role==='editor'){ nav('editorDetails'); } else { nav('home'); }
}

  <div class="screen">
    <button class="back-btn" style="color:#111" onclick="nav('authLanding')">‹</button>
    <h2>Welcome Back</h2>
    <p class="muted" style="margin-bottom:20px;">Login to continue</p>
    <div class="field"><label>Email</label><input id="loginEmail" placeholder="example@email.com"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <p style="text-align:right; margin:-6px 0 14px;"><span class="link" style="font-size:13px;" onclick="forgotPassword()">Forgot password?</span></p>
    <button class="btn btn-primary" onclick="doLogin()">Log In</button>
    <p class="center-text muted" style="margin-top:16px;">Don't have an account? <span class="link" onclick="nav('signup')">Sign Up</span></p>
  </div>`;

function friendlyAuthError(error){
  const m = String(error && error.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'Wrong email or password. Forgot it? Tap "Forgot password?".';
  if(m.includes('email not confirmed')) return 'Please confirm your email first — open the link we emailed you (check Spam too), then log in.';
  if(m.includes('already registered')) return 'An account with this email already exists. Please log in.';
  if(m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Please try again in an hour.';
  if(m.includes('password should be')) return 'Password must be at least 6 characters.';
  return error.message;
}
async function forgotPassword(){
  let email = (document.getElementById('loginEmail').value || '').trim();
  if(!email) email = (prompt('Enter your email:') || '').trim();
  if(!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ alert(friendlyAuthError(error)); return; }
  alert('✉️ We sent a password reset link to ' + email + '. Tap the link in the email (check Spam too).');
}
SCREENS.resetPassword = () => `
  <div class="screen">
    <h2>New Password</h2>
    <p class="muted" style="margin-bottom:20px;">Set your new password</p>
    <div class="field"><label>New password</label><input id="npPass" type="password" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm password</label><input id="npPass2" type="password"></div>
    <button class="btn btn-primary" onclick="saveNewPassword()">Save Password</button>
  </div>`;
async function saveNewPassword(){
  const a = document.getElementById('npPass').value, b = document.getElementById('npPass2').value;
  if(a.length < 6){ alert('Password must be at least 6 characters'); return; }
  if(a !== b){ alert('Passwords do not match'); return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if(error){ alert(friendlyAuthError(error)); return; }
  alert('Password updated ✅');
  IS_RECOVERY = false;
  const user = await fetchAndSetCurrentUser();
  nav(user ? (user.role==='admin' ? 'admin' : 'home') : 'authLanding');
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if(!email||!pass){ alert('Enter your email and password'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ alert(friendlyAuthError(error)); return; }
  const user = await fetchAndSetCurrentUser();
  if(!user){
    // account hai par profile adhoori hai -> role + number le lo
    const { data:{ user: authUser } } = await sb.auth.getUser();
    pendingAuthUser = authUser; nav('chooseRole'); return;
  }
  nav(user.role==='admin' ? 'admin' : 'home');
}

SCREENS.signup = () => `
  <div class="screen">
    <button class="back-btn" style="color:#111" onclick="nav('authLanding')">‹</button>
    <h2>Create Account</h2>
    <div class="field"><label>Full Name</label><input id="suName" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input id="suEmail" placeholder="example@email.com"></div>
    ${phoneField('suPhone')}
    <div class="field"><label>Password</label><input id="suPass" type="password" placeholder="••••••••"></div>
    <div class="field">
      <label>I am a</label>
      <div>
        <span class="pill active" id="roleClient" onclick="selectRole('client')">Client</span>
        <span class="pill" id="roleEditor" onclick="selectRole('editor')">Editor</span>
      </div>
    </div>
    <button class="btn btn-primary" onclick="doSignup()">Continue</button>
    <p class="center-text muted" style="margin-top:16px;">Already have an account? <span class="link" onclick="nav('login')">Log In</span></p>
  </div>`;
let selectedRole = 'client';
function selectRole(r){
  selectedRole = r;
  document.getElementById('roleClient').classList.toggle('active', r==='client');
  document.getElementById('roleEditor').classList.toggle('active', r==='editor');
}
async function doSignup(){
  const name=document.getElementById('suName').value.trim();
  const email=document.getElementById('suEmail').value.trim();
  const pass=document.getElementById('suPass').value.trim();
  if(!name||!email||!pass){ alert('Please fill all fields'); return; }
  const phone = readPhone('suPhone');
  if(!phone) return;
  if(pass.length < 6){ alert('Password must be at least 6 characters'); return; }
  const { data, error } = await sb.auth.signUp({
    email, password: pass,
    options: { data: { full_name: name, role: selectedRole.toUpperCase(), phone }, emailRedirectTo: window.location.origin }
  });
  if(error){
    alert(friendlyAuthError(error));
    if(String(error.message).toLowerCase().includes('already registered')){
      nav('login'); setTimeout(() => { const el = document.getElementById('loginEmail'); if(el) el.value = email; }, 50);
    }
    return;
  }
  if(!data.session){
    alert('Account created! ✉️ We sent a confirmation link to your email. Open it, then log in here.');
    nav('login');
    return;
  }
  await fetchAndSetCurrentUser();
  if(!currentUser){ alert('Could not create your profile. Please log in again.'); nav('login'); return; }
  if(selectedRole==='editor'){ nav('editorDetails'); } else { nav('home'); }
}

const FAQ = [
  { q: 'How does payment work?', a: 'The client pays inside the app. The money stays in escrow until the editor delivers and the client approves. After approval, the editor gets paid.' },
  { q: 'What is a verified editor?', a: 'The Sphere team checks every editor on a call and reviews their sample work. Approved editors get a unique code (like SF-EDT-1234) and a ✔ Verified badge.' },
  { q: 'How do I choose an editor?', a: 'Post a job — verified editors in that category send bids. Compare their profiles and prices, then select one. Or tap "Hire Now" on any editor profile.' },
  { q: 'How do I send raw footage?', a: 'Attach photos or short videos (up to 50 MB each) when posting a job, or add a Google Drive / WeTransfer link for bigger files. All your project files appear in the Vault.' },
  { q: 'How do I become an editor?', a: 'Tap "Become an Editor" in your Profile (or pick Editor at sign-up), fill in your details and sample link. Our team will call you to verify.' }
];

SCREENS.sphereAI = () => `
  <div class="header"><button class="back-btn" onclick="nav('home')">‹</button><h1>Smart Match</h1><p>Find the right editor for your project</p></div>
  <div class="screen" style="padding-top:0;">
    <div class="card">
      <div class="field"><label>What kind of video do you need edited?</label>
        <select id="smCat">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Your budget (₹ per video)</label>
        <input id="smBudget" type="number" inputmode="numeric" placeholder="1000"></div>
      <button class="btn btn-primary" onclick="runSmartMatch()">Show best editors</button>
    </div>
    <div id="smResults"></div>
    <h3 style="margin:20px 0 10px;">Frequently asked questions</h3>
    ${FAQ.map(f=>`<details class="card"><summary><b>${f.q}</b></summary><p class="muted" style="margin-top:8px;">${f.a}</p></details>`).join('')}
  </div>`;

function editorPrice(e){ return parseInt(String(e.price || '').replace(/[^\d]/g, '')) || 0; }
async function runSmartMatch(){
  const cat = document.getElementById('smCat').value;
  const budget = Number(document.getElementById('smBudget').value) || 0;
  const box = document.getElementById('smResults');
  box.innerHTML = '<p class="muted center-text" style="margin:14px 0;">Searching…</p>';
  const editors = (await getVerifiedEditors()).filter(e => e.category === cat);
  const score = e => (e.rating || 0) * 2 + Math.min(Number(e.experience) || 0, 10) * 0.3 + (e.reviews || 0) * 0.05;
  let list = budget ? editors.filter(e => editorPrice(e) && editorPrice(e) <= budget) : editors.slice();
  list.sort((a, b) => score(b) - score(a));
  let note = '';
  if(list.length === 0 && editors.length > 0){
    list = editors.slice().sort((a, b) => editorPrice(a) - editorPrice(b)).slice(0, 4);
    note = `<p class="muted" style="margin:12px 0;">No editors within ₹${budget}. Here are the most affordable ones:</p>`;
  }
  if(list.length === 0){
    box.innerHTML = `<p class="muted" style="margin:14px 0;">No verified editors in ${esc(cat)} yet. Post a job — new editors will apply.</p>
      <button class="btn btn-outline" onclick="nav('postJob')">+ Post Job</button>`;
    return;
  }
  box.innerHTML = note + `<h3 style="margin:16px 0 10px;">Top matches</h3><div class="grid2">${renderEditorCards(list.slice(0, 6))}</div>`;
}

SCREENS.savedList = async () => {
  const user = getCurrentUser();
  const { data, error } = await sb.from('sp_saved').select('editor_id').eq('user_id', user.id).order('created_at', { ascending: false });
  if(error) console.error(error);
  const ids = (data || []).map(r => r.editor_id);
  const map = await getProfilesByIds(ids);
  const list = ids.map(id => map[id]).filter(Boolean);
  return `
  <div class="header"><button class="back-btn" onclick="nav('home')">‹</button><h1>Saved Editors</h1><p>Editors you saved</p></div>
  <div class="screen" style="padding-top:0;">
    ${list.length===0
      ? `<p class="muted">You have not saved any editors yet. Tap <b>🤍 Save Editor</b> on an editor's profile.</p>
         <button class="btn btn-outline" style="margin-top:12px;" onclick="nav('allEditors')">Browse editors</button>`
      : `<div class="grid2">${renderEditorCards(list)}</div>`}
  </div>`;
};
async function toggleSaveEditor(editorId){
  const btn = document.getElementById('saveBtn');
  const saved = btn.dataset.saved === '1';
  btn.disabled = true;
  if(saved){
    const { error } = await sb.from('sp_saved').delete().eq('user_id', currentUser.id).eq('editor_id', editorId);
    btn.disabled = false;

function youtubeThumb(url){
  const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
}
function renderPortfolio(e, items, editable){
  const tiles = [];
  (items || []).forEach(it => {
    const img = it.image_path ? mediaUrl(it.image_path) : youtubeThumb(it.video_url);
    const bg = img ? `background:#111 url('${esc(img)}') center/cover;` : 'background:linear-gradient(135deg,#0b3d91,#0e6ba8);';
    const inner = `${it.video_url ? '<div class="play-ic">▶</div>' : ''}<div class="pf-title">${esc(it.title)}</div>`;
    const del = editable ? `<button class="pf-del" onclick="event.preventDefault(); event.stopPropagation(); deletePortfolioItem('${it.id}', '${esc(it.image_path || '')}')">✕</button>` : '';
    tiles.push(it.video_url && /^https?:\/\//i.test(it.video_url)
      ? `<a class="portfolio-item" href="${esc(it.video_url)}" target="_blank" rel="noopener noreferrer" style="${bg}">${del}${inner}</a>`
      : `<div class="portfolio-item" style="${bg}" onclick="window.open('${esc(img)}', '_blank')">${del}${inner}</div>`);
  });
  const links = [];
  if(e && e.sample) links.push({ title: 'Sample Video', url: e.sample });
  if(e && e.portfolio) links.push({ title: 'Portfolio', url: e.portfolio });
  links.filter(l => /^https?:\/\//i.test(l.url)).forEach(l => {
    const th = youtubeThumb(l.url);
    const bg = th ? `background:#000 url('${th}') center/cover;` : 'background:linear-gradient(135deg,#0b3d91,#0e6ba8);';
    tiles.push(`<a class="portfolio-item" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" style="${bg}">
      <div class="play-ic">▶</div><div class="pf-title">${l.title}</div></a>`);
  });
  const head = `<div class="section-title" style="padding:0; margin-top:16px;"><h3>Portfolio</h3></div>`;
  if(tiles.length === 0) return head + `<p class="muted">No portfolio items yet.</p>`;
  return head + `<div class="portfolio-grid">${tiles.join('')}</div>`;
}

  });

  alert('Job posted successfully!');
  nav('jobs');
}

async function addPortfolioItem(){

let currentChatWith = null;

function startChat(otherUserId){
  const user = getCurrentUser();

function listenForMessages(){
  if(msgChannel || !currentUser) return;
  msgChannel = sb.channel('sphere-messages-' + currentUser.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sp_messages', filter: `receiver_id=eq.${currentUser.id}` }, (payload) => {
      const m = payload.new;
      const box = document.getElementById('chatBox');
      if(box && m.sender_id === currentChatWith){
        box.insertAdjacentHTML('beforeend', `<div class="chat-bubble them">${esc(m.text)}</div>`);
        window.scrollTo(0, document.body.scrollHeight);
      }
    })
    .subscribe();
}
SCREENS.chatList = async () => {
  const user = getCurrentUser();
  const { data, error } = await sb.from('sp_messages').select('*')
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`)
    .order('created_at', { ascending: false }).limit(500);

  const latest = {};
  (data || []).forEach(m => {
    const other = m.sender_id === user.id ? m.receiver_id : m.sender_id;

};
SCREENS.chatThread = async () => {
  const user = getCurrentUser();
  if(!currentChatWith){ setTimeout(() => nav('chatList'), 0); return ''; }
  const other = (await getProfilesByIds([currentChatWith]))[currentChatWith];
  const { data, error } = await sb.from('sp_messages').select('*')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${currentChatWith}),and(sender_id.eq.${currentChatWith},receiver_id.eq.${user.id})`)
    .order('created_at', { ascending: true }).limit(500);
  if(error) console.error(error);
  listenForMessages();
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
  return `

  </div>

};
async function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const user = getCurrentUser();
  input.value = '';
  const { error } = await sb.from('sp_messages').insert({ sender_id: user.id, receiver_id: currentChatWith, text });
  if(dbErr(error)){ input.value = text; return; }
  const box = document.getElementById('chatBox');
  if(box){
    box.insertAdjacentHTML('beforeend', `<div class="chat-bubble me">${esc(text)}</div>`);
    window.scrollTo(0, document.body.scrollHeight);
  }
  notify(currentChatWith, 'New Message', `${user.name}: ${text.slice(0, 80)}`);
}

async function functionError(error){
  try { const body = await error.context.json(); return body.error || error.message; } catch(e) { return error.message; }
}
async function payWithRazorpay(jobId){
  const job = await getJob(jobId);
  if(!job) return;
  if(typeof Razorpay === 'undefined'){ alert('The payment page did not load. Check your internet and try again.'); return; }
  const user = getCurrentUser();
  try {
    // Amount server khud job se nikalta hai — app se bheja hua amount use nahi hota
    const { data: order, error } = await sb.functions.invoke('create-razorpay-order', { body: { jobId } });
    if(error || !order || !order.id){
      alert('Could not start the payment: ' + (error ? await functionError(error) : 'unknown'));
      return;
    }
    const rzp = new Razorpay({
      key: RAZORPAY_KEY_ID,
      amount: order.amount,
      currency: order.currency,
      name: 'Sphere — Syahi Films',
      description: job.category,
      order_id: order.id,
      prefill: { name: user.name, email: user.email, contact: user.phone||'' },
      theme: { color: '#1657ff' },
      handler: async function(response){
        const { data: verify, error: vErr } = await sb.functions.invoke('verify-razorpay-payment', {
          body: {
            order_id: response.razorpay_order_id,
            payment_id: response.razorpay_payment_id,
            signature: response.razorpay_signature
          }
        });
        if(!vErr && verify && verify.valid){
          alert('Payment successful ✅ Your money is safe in escrow. The editor will start now.');
          currentJobId = jobId;
          nav('projectStatus');
        } else {
          alert('We could not verify the payment. Payment ID: ' + response.razorpay_payment_id + '\nPlease note this ID and contact Support.');
        }
      },
      modal: { ondismiss: function(){ /* user ne popup band kiya */ } }
    });
    rzp.on('payment.failed', function(resp){
      alert('Payment failed: ' + ((resp.error && resp.error.description) || 'Please try again'));
    });
    rzp.open();
  } catch(e){
    alert('Something went wrong: ' + e.message);
  }
}

async function extendDeadline(jobId){
  const d = document.getElementById('newDeadline').value;
  if(!d){ alert('Choose a new deadline'); return; }
  if(d < todayIST()){ alert('Deadline cannot be in the past'); return; }
  if(!await updateJob(jobId, { deadline: d })) return;
  alert('Job reopened ✅');
  currentJobId = jobId; nav('projectStatus');
}
async function addRawFiles(jobId, input){
  const job = await getJob(jobId);
  if(!job) return;
  if(job.rawFiles.length + input.files.length > MAX_RAW_FILES){ alert(`You can attach up to ${MAX_RAW_FILES} files per job`); input.value = ''; return; }
  try {
    const added = await uploadRawFiles(input.files, document.getElementById('rawAddStatus'));
    if(!await updateJob(jobId, { raw_files: [...job.rawFiles, ...added] })){
      await sb.storage.from(RAW_BUCKET).remove(added.map(x => x.path)); return;
    }
    if(job.assignedEditor) await notify(job.assignedEditor, 'New files added 📎', `The client added ${added.length} file(s) to your ${job.category} project.`);
    currentJobId = jobId; nav('projectStatus');
  } catch(e){ alert('Upload failed: ' + (e.message || e)); input.value = ''; }
}
async function removeRawFile(jobId, idx){
  if(!confirm('Remove this file?')) return;
  const job = await getJob(jobId);
  if(!job || !job.rawFiles[idx]) return;
  const f = job.rawFiles[idx];
  if(!await updateJob(jobId, { raw_files: job.rawFiles.filter((_, i) => i !== idx) })) return;
  await sb.storage.from(RAW_BUCKET).remove([f.path]);
  currentJobId = jobId; nav('projectStatus');
}
async function uploadDelivery(jobId){
  const link = document.getElementById('deliveryLink').value.trim();
  if(!link){ alert('Paste your delivery link'); return; }
  if(!/^https?:\/\//i.test(link)){ alert('Link must start with https://'); return; }
  const job = await getJob(jobId);
  if(!job) return;
  if(!await updateJob(jobId, { delivery_link: link, status: 'delivered' })) return;
  await notify(job.clientId, 'Video Delivered', 'Your editor has delivered the final video.');
  alert('Delivered! Waiting for client approval.');
  currentJobId = jobId;
  nav('projectStatus');
}
async function approveJob(jobId){
  const job = await getJob(jobId);
  if(!job) return;
  if(!confirm('Approve the video and release payment to the editor?')) return;
  const { data, error } = await sb.functions.invoke('release-payout', { body: { jobId } });
  if(error){ alert('Could not approve: ' + await functionError(error)); return; }
  alert(data && data.payout === 'released'
    ? 'Approved ✅ Payment released to the editor.'
    : 'Approved ✅ Syahi Films will pay the editor.');
  currentJobId = jobId;
  nav('projectStatus');
}

  if(!note.trim()){ alert('Please write the decision'); return; }
  const { error } = await sb.from('sp_reports').update({ status: 'resolved', admin_note: note.trim(), resolved_at: new Date().toISOString() }).eq('id', reportId);
  if(dbErr(error)) return;
  await notify([reporterId, againstId], 'Report resolved ✅', 'Syahi Films: ' + note.trim());
  nav('admin');
}
async function adminRefund(jobId){
  if(!confirm('Are you sure? The client gets a FULL refund and the editor share is taken back. This cannot be undone.')) return;
  const { error } = await sb.functions.invoke('refund-payment', { body: { jobId } });
  if(error){ alert('Refund failed: ' + await functionError(error)); return; }
  alert('Refund started ✅ The client will get the money in 5–7 days.');
  nav('admin');
}
async function adminRelease(jobId){
  if(!confirm('Have you checked the delivery? Approve and release payment to the editor?')) return;
  const { data, error } = await sb.functions.invoke('release-payout', { body: { jobId } });
  if(error){ alert('Release failed: ' + await functionError(error)); return; }
  alert(data && data.payout === 'released' ? 'Released ✅' : 'Approved ✅ — see the manual payout list.');
  nav('admin');
}
async function verifyEditor(id){
  const cat = document.getElementById('assignCat_'+id).value;
  const pinEl = document.getElementById('pin_'+id);
  const pin = (pinEl && pinEl.value || '').trim();
  if(!pin){ alert('Enter your Admin PIN'); return; }
  const { data: code, error } = await sb.rpc('sp_verify_editor', { p_editor: id, p_category: cat, p_pin: pin });
  if(error){ alert(error.message); if(pinEl) pinEl.value = ''; return; }
  alert('Editor verified ✅  Code: ' + code);
  nav('admin');
}
function adminKey(e){
  return [e.full_name, e.email, e.phone, e.verification_code, (e.categories || []).join(' ')].filter(Boolean).join(' ').toLowerCase();
}
function adminSearch(q){
  const v = String(q || '').trim().toLowerCase();
  document.querySelectorAll('.adm-ed').forEach(c => { c.style.display = !v || (c.dataset.q || '').includes(v) ? '' : 'none'; });
}
function toggleCard(btn){
  const card = btn.closest('.card');
  const collapsed = card.classList.toggle('collapsed');
  btn.innerHTML = collapsed ? UI_ICONS.plus : UI_ICONS.minus;
  btn.title = collapsed ? 'Expand' : 'Collapse';
}
function openUnverify(id, btn){
  const card = btn.closest('.card');
  if(card.classList.contains('collapsed')) toggleCard(card.querySelector('.icon-act[title="Expand"]'));
  const box = document.getElementById('unv_' + id);
  const show = box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  if(show) document.getElementById('unvReason_' + id).focus();
}
async function removeVerification(id){
  const reason = (document.getElementById('unvReason_'+id).value || '').trim();
  const pin = (document.getElementById('unvPin_'+id).value || '').trim();
  if(reason.length < 5){ alert('Write a clear reason (the editor will see it)'); return; }
  if(!pin){ alert('Enter your Admin PIN'); return; }
  if(!confirm('Remove this editor\'s verified badge? They will stop appearing to clients and cannot bid until verified again.')) return;
  const { error } = await sb.rpc('sp_unverify_editor', { p_editor: id, p_reason: reason, p_pin: pin });
  if(error){ alert(error.message); return; }
  alert('Verified badge removed. The editor has been notified.');
  nav('admin');
}
async function setAdminPin(changing){
  const n1 = (document.getElementById('pinNew').value || '').trim();
  const n2 = (document.getElementById('pinNew2').value || '').trim();
  if(!/^\d{4,8}$/.test(n1)){ alert('PIN must be 4–8 digits'); return; }
  if(n1 !== n2){ alert('PINs do not match'); return; }
  const old = changing ? (document.getElementById('pinOld').value || '').trim() : null;
  const { error } = await sb.rpc('sp_set_admin_pin', { p_new: n1, p_old: old });
  if(error){ alert(error.message); return; }
  alert('Admin PIN saved ✅');
  nav('admin');
}

(function(){
  const q = new URLSearchParams(window.location.search);
  const h = new URLSearchParams(window.location.hash.slice(1));
  const err = q.get('error_description') || h.get('error_description');
  if(err){ alert('Google login error: ' + err); }
})();
try { localStorage.removeItem('sphereDB'); } catch(e) {}
nav('splash');
