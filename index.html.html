<script>/* SPHERE DESKTOP ADAPTER v1 — desktop browser auto-detection, no user setting needed */
(function(){
  const mq=window.matchMedia&&window.matchMedia('(min-width:700px)');
  function detect(){
    const pc=document.documentElement.classList.contains('os-other')&&!!mq&&mq.matches;
    document.documentElement.classList.toggle('sphere-desktop',pc);
    return pc;
  }
  window.sphereDetectDesktop=detect;
  detect();
  if(mq){if(mq.addEventListener)mq.addEventListener('change',detect);else if(mq.addListener)mq.addListener(detect);}
})();

.kv{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}

.pin-mask{-webkit-text-security:disc; text-security:disc;}
.pin-input{letter-spacing:6px; font-weight:700; text-align:center;}
.adm-head{display:flex; align-items:center; gap:10px;}
.adm-title{flex:1; min-width:0;} .adm-title b{font-size:15px;} .adm-title small{display:block; color:var(--muted); font-size:12px; margin-top:2px;}
.icon-act{width:34px; height:34px; flex:0 0 34px; border-radius:10px; border:1px solid var(--border); background:#fff; color:#4b5563; display:flex; align-items:center; justify-content:center; cursor:pointer;}

.search-row{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin-bottom:14px;}
.search-row svg{width:18px; height:18px; color:var(--muted); flex:0 0 18px;} .search-row input{border:none; outline:none; flex:1; font-size:14px; background:transparent;}
.raw-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
.raw-tile{position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:#111; display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; font-size:11px;}

.wco-drag{display:none;}

}
.install-banner{display:flex; align-items:center; gap:10px; margin:10px 16px 0; padding:10px 12px; border-radius:14px; background:#fff; border:1.5px solid var(--blue); box-shadow:0 4px 14px rgba(22,87,255,.10);}

.install-banner .ib-text{flex:1; font-size:12px; color:var(--muted); line-height:1.35;} .install-banner .ib-text b{display:block; color:#111; font-size:14px;}
.install-banner .ib-btn{background:var(--blue); color:#fff; border:none; border-radius:18px; padding:8px 12px; font-weight:700; font-size:12px; cursor:pointer;}
.install-banner .ib-x{background:none; border:none; color:#9aa0a6; font-size:16px; cursor:pointer; padding:0 2px;}
.ai-chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
.ai-chips::-webkit-scrollbar{display:none;}
.ai-chip{flex:0 0 auto; padding:8px 12px; border-radius:18px; background:#fff; border:1px solid var(--border); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;}

.ai-note{font-size:11px; color:var(--muted); text-align:center; margin:4px 0 10px;}
.pick-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}

.pick-chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}

.bottom-nav{
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:448px;
  border-radius:28px; display:flex; justify-content:space-around; padding:10px 6px; z-index:50;
  /* Apple-style frosted glass: the page shows through, blurred */
  /* Liquid Glass: clear glass that bends colour from behind, light catching the edges */
  background:linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(14px) saturate(210%) brightness(1.06); backdrop-filter:blur(14px) saturate(210%) brightness(1.06);
  border:1px solid rgba(255,255,255,.6); overflow:hidden; isolation:isolate;
  box-shadow:0 14px 34px rgba(20,30,60,.18), 0 2px 6px rgba(20,30,60,.06),
    inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35), inset 0 0 22px rgba(255,255,255,.22);
}
.bottom-nav::before{content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:0;
  background:radial-gradient(130% 70% at 18% -20%, rgba(255,255,255,.65), transparent 55%), radial-gradient(90% 60% at 95% 130%, rgba(255,255,255,.28), transparent 60%);}
.bottom-nav button{position:relative; z-index:1;}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .bottom-nav{ background:rgba(255,255,255,.94); } .bottom-nav button.active{ background:#eaf0ff; } }
.bottom-nav button{background:none; border:none; display:flex; flex-direction:column; align-items:center; font-size:10px; color:var(--muted); gap:3px; cursor:pointer; padding:4px 10px; border-radius:16px; transition:.15s;}
.bottom-nav button.active{color:var(--blue); font-weight:700; background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.28));
  -webkit-backdrop-filter:blur(6px) saturate(180%); backdrop-filter:blur(6px) saturate(180%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,1), inset 0 -1px 2px rgba(30,64,175,.14), 0 4px 14px rgba(30,64,175,.16);}
.bottom-nav .icon{font-size:19px; display:flex; align-items:center; justify-content:center;}
.bottom-nav .icon svg{width:22px; height:22px;}

.onboard-wrap{text-align:center; padding-top:20px;}

/* v2.22.39: PC admin panel */
body.pc-admin{max-width:none; padding-bottom:0; background:#eef1f8;}
.pca{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}

.pca-side button:hover{background:#1e293b; color:#fff;}
.pca-side button.on{background:#1657ff; color:#fff; font-weight:600;}
.pca-side .n{background:#ef4444; color:#fff; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:700;}
.pca-foot{margin-top:auto; padding-top:14px; border-top:1px solid #1e293b; display:flex; flex-direction:column; gap:2px;}
.pca-lock{font-size:12px; padding:6px 12px; color:#fbbf24;} .pca-lock.ok{color:#4ade80;}
.pca-main{padding:22px 32px 60px; min-width:0;}
.pca-top{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px;}
.pca-top h1{font-size:28px; margin:0;} .pca-top .muted{font-size:13px;}
.pca-body{max-width:1240px;}
.pca-body:not(.tab-verification):not(.tab-overview){max-width:920px;}
.pca-body.tab-overview{display:grid; grid-template-columns:1fr 1fr; gap:0 16px; align-items:start;}
.pca-body.tab-overview > .ad-grid{grid-column:1/-1; grid-template-columns:repeat(4,1fr);}
.pca-body.sub .header{background:none; padding-left:0;}
.pca .card{margin-bottom:14px;}
.pcv-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.pcv-chips button{border:1px solid var(--border); background:#fff; border-radius:20px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer;}
.pcv-chips button span{color:#64748b; font-weight:700; margin-left:4px;}
.pcv-chips button.on{background:#1657ff; border-color:#1657ff; color:#fff;} .pcv-chips button.on span{color:#dbeafe;}
.pcv{display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start;}
.pcv-list,.pcv-detail{background:#fff; border:1px solid var(--border); border-radius:14px; max-height:calc(100vh - 170px); overflow:auto;}
.pcv-search{position:sticky; top:0; background:#fff; padding:10px; border-bottom:1px solid var(--border); z-index:1;}
.pcv-search input{width:100%; box-sizing:border-box;}
.pcv-item{display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; border-left:3px solid transparent;}
.pcv-item:hover{background:#f8fafc;} .pcv-item.on{background:#eef3ff; border-left-color:#1657ff;}
.pcv-item b{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pcv-item small{display:block; font-size:12px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pcv-tags{display:flex; gap:4px; margin-top:4px;} .pcv-tags i{font-style:normal; font-size:10.5px; padding:1px 6px; border-radius:6px; background:#f1f5f9; color:#64748b;}
.pcv-tags i.ok{background:#dcfce7; color:#15803d;} .pcv-tags i.warn{background:#fef3c7; color:#b45309;}
.pcv-keys{font-size:11px; padding:10px 12px;}
.pcv-detail{padding:20px 22px;}
.pcv-head{display:flex; gap:14px; align-items:center; margin-bottom:16px;} .pcv-head h2{margin:0 0 2px; font-size:21px;}
.pcv-grid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; align-items:start;}
.pcv-box{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:#fff;}
.pcv-video{margin-top:8px;} .pcv-video iframe{width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000; display:block;}
.pcv-call .num{font-size:22px; font-weight:700; margin-bottom:8px; letter-spacing:.3px;}
.pcv-call .btn-sm{text-decoration:none;}
.pcv-ck{display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-top:8px; cursor:pointer;}
.pcv-ck input{width:auto; margin-top:2px;}
.pcv-actions{display:grid; gap:8px;}
.pcv-empty{text-align:center; padding:60px 20px;}
.pcv-verified{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:0 14px;} .pcv-verified h3{grid-column:1/-1;}
/* ============================================================

body[data-sphere-screen="home"]:not(.sphere-editor-refresh) .sphere-client-home .explore-circle{
  position:relative;
  isolation:isolate;
  padding:5px;
  overflow:hidden;
  border-radius:50%;
  border:1.5px solid rgba(247,253,255,.96);
  background:linear-gradient(147deg,#dfefff 0%,#76b6ff 12%,#2161be 36%,#092a77 74%,#8edaff 94%,#e4efff 100%);
  -webkit-backdrop-filter:blur(12px) saturate(190%);
  backdrop-filter:blur(12px) saturate(190%);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.98),
    inset 0 -4px 9px rgba(8,32,116,.48),
    inset 3px 0 6px rgba(176,219,255,.55),
    0 0 0 2px rgba(134,190,255,.19),
    0 7px 12px rgba(77,62,166,.24),
    0 2px 3px rgba(255,255,255,.8);
  margin-bottom:10px;
  transition:transform .18s ease,box-shadow .18s ease;
}
body[data-sphere-screen="home"]:not(.sphere-editor-refresh) .sphere-client-home .explore-circle img{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  filter:saturate(1.13) contrast(1.06);
  box-shadow:0 0 0 1px rgba(212,238,255,.48);
}

  content:'';
  pointer-events:none;
  position:absolute;
  z-index:2;
  inset:0;
  border-radius:inherit;
  background:
    radial-gradient(ellipse 48% 24% at 26% 10%,rgba(255,255,255,.91),transparent 85%),
    radial-gradient(ellipse 42% 24% at 77% 89%,rgba(179,222,255,.65),transparent 100%),
    linear-gradient(155deg,rgba(255,255,255,.35) 1%,transparent 33%,transparent 70%,rgba(201,240,255,.28) 100%);
  box-shadow:
    inset 0 3px 2px rgba(255,255,255,.9),

    inset 3px 0 5px rgba(229,248,255,.58);
}
body[data-sphere-screen="home"]:not(.sphere-editor-refresh) .sphere-client-home .explore-circle::after{
  content:'';

  position:absolute;

  top:9%;
  left:11%;

  background:linear-gradient(90deg,transparent 2%,rgba(255,255,255,.98) 30%,rgba(255,255,255,.8) 74%,transparent 100%);

/* SPHERE GLOBAL LIQUID GLASS THEME — OCT 2026 */
/* Visual-only layer. Existing app structure, routing, payment and controls untouched.
   Values emphasise readable contrast over transparency on budget Android devices. */
:root{
  --blue:#7139e4;
  --blue-dark:#5022b8;
  --bg:#f7e0f1;
  --text:#18213e;
  --muted:#606780;
  --card:rgba(255,255,255,.84);
  --border:rgba(229,207,247,.86);
  --radius:20px;
  --glass-line:rgba(255,255,255,.92);
  --glass-shadow:0 8px 23px rgba(126,72,158,.115),inset 0 1px 2px rgba(255,255,255,.97);
  --glass-surface:linear-gradient(132deg,rgba(255,255,255,.86),rgba(255,249,253,.78) 51%,rgba(242,228,255,.8));
}
html{background:#f8e4f4;color-scheme:light;}
body:not([data-sphere-screen="home"]){
  background:
    radial-gradient(ellipse 73% 24% at 6% 0%,rgba(192,114,255,.57),transparent 83%),
    radial-gradient(ellipse 67% 31% at 101% 13%,rgba(255,213,173,.77),transparent 85%),
    radial-gradient(ellipse 68% 27% at 0% 59%,rgba(255,174,173,.58),transparent 84%),
    radial-gradient(ellipse 76% 32% at 100% 88%,rgba(192,171,255,.56),transparent 80%),
    linear-gradient(165deg,#f9d3ea 0%,#ffeadb 38%,#e8defe 74%,#f6d8f3 100%);
  background-attachment:scroll;
  color:#18213e;
}
body.sphere-editor-refresh{
  --se-blue:#7139e4;
  --se-navy:#202044;
  --se-ink:#20213f;
  --se-line:rgba(230,210,247,.95);
  --se-muted:#666b83;
  background:
    radial-gradient(ellipse 77% 30% at 5% 0%,rgba(185,113,249,.61),transparent 81%),
    radial-gradient(ellipse 74% 25% at 98% 18%,rgba(255,206,164,.63),transparent 82%),
    radial-gradient(ellipse 76% 34% at 92% 91%,rgba(202,178,254,.58),transparent 85%),
    linear-gradient(155deg,#f7d2f0,#ffe6d8 43%,#e6dcff 77%,#efd7f9);
  color:var(--text);
}
body.pc-admin{background:linear-gradient(135deg,#f5deef,#ffefe2 42%,#e9e3ff);}
body:not(.pc-admin) .screen{color:var(--text);}
body .screen .header h1, body .screen .header h2{color:#20213f;}

body .screen .header .back-btn{color:#7035dc;}
body .screen .header .ch-more{color:#7035dc !important;}
body .section-title h3{color:#252143;}
body .section-title a,body .link{color:#7139e4;}

body .card,
body.sphere-editor-refresh .card,
body .menu-item,
body .help-mini,
body .cl-stat,
body .cl-proj,
body .se-job-card,
body .se-empty,
body .nt-item,
body .se-dash-stats button,
body .se-shortcuts button,
body .se-earn-grid>div,
body .se-earning-row,

  border:1px solid var(--glass-line);
  box-shadow:var(--glass-shadow);
  border-radius:20px;
  color:var(--text);
}
body .menu-item{border-radius:18px;}

/* SPHERE BOTTOM NAV — LIQUID GLASS REFINEMENT v1 */
/* Only #bottomNav; no changes to tab routes, chat badge or app state. */
body:not(.pc-admin) #bottomNav.bottom-nav{
  bottom:calc(11px + env(safe-area-inset-bottom, 0px));
  width:calc(100% - 28px);
  max-width:448px;
  min-height:78px;
  padding:7px 8px;
  gap:3px;
  align-items:stretch;
  justify-content:space-around;
  overflow:hidden;
  isolation:isolate;
  border-radius:32px;
  border:1.5px solid rgba(255,255,255,.95);
  background:
    radial-gradient(ellipse 57% 83% at 4% 2%,rgba(255,255,255,.77),transparent 88%),
    radial-gradient(ellipse 69% 92% at 99% 100%,rgba(214,175,255,.32),transparent 88%),
    linear-gradient(137deg,rgba(255,255,255,.56) 0%,rgba(255,246,255,.36) 46%,rgba(235,205,255,.38) 100%);
  -webkit-backdrop-filter:blur(21px) saturate(205%) brightness(1.06);
  backdrop-filter:blur(21px) saturate(205%) brightness(1.06);
  box-shadow:
    0 13px 30px rgba(115,59,158,.2),
    0 3px 7px rgba(73,45,120,.06),
    inset 0 2px 2px rgba(255,255,255,.98),
    inset 0 -1.5px 3px rgba(161,112,215,.19),
    inset 2px 0 6px rgba(255,255,255,.78),
    inset -2px 0 8px rgba(218,179,255,.27);
}
body:not(.pc-admin) #bottomNav.bottom-nav::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(ellipse 43% 24% at 20% -3%,rgba(255,255,255,.96),transparent 96%),
    radial-gradient(ellipse 31% 22% at 83% 111%,rgba(255,255,255,.62),transparent 98%),
    linear-gradient(160deg,rgba(255,255,255,.43),transparent 40%,rgba(237,211,255,.13) 80%);
}
body:not(.pc-admin) #bottomNav.bottom-nav::after{
  content:'';
  position:absolute;
  z-index:0;
  pointer-events:none;
  left:7%;
  top:2px;
  width:42%;
  height:4px;
  border-radius:100%;
  transform:rotate(-3deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.96) 26%,rgba(255,255,255,.98) 75%,transparent);
  filter:blur(.8px);
}
body:not(.pc-admin) #bottomNav.bottom-nav button{
  position:relative;
  z-index:1;
  flex:1 1 0;
  min-width:0;
  min-height:62px;
  padding:7px 3px 6px;
  gap:5px;
  color:#64617a;
  border:1px solid transparent;
  border-radius:24px;
  background:transparent;
  font-size:11px;
  font-weight:650;
  line-height:1.1;
  -webkit-tap-highlight-color:transparent;
  transition:background .17s ease,color .17s ease,transform .17s ease,box-shadow .17s ease;
}
body:not(.pc-admin) #bottomNav.bottom-nav button .icon{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:25px;
  font-size:22px;
  color:inherit;
  filter:drop-shadow(0 1px 1px rgba(255,255,255,.67));
}
body:not(.pc-admin) #bottomNav.bottom-nav button .icon svg{
  width:24px;
  height:24px;
  stroke-width:2.1;
}
body:not(.pc-admin) #bottomNav.bottom-nav button.active{
  color:#6626cd;
  font-weight:800;
  border:1.4px solid rgba(255,255,255,.94);
  border-radius:25px;
  background:
    radial-gradient(ellipse 83% 33% at 42% 0%,rgba(255,255,255,.99),transparent 95%),
    linear-gradient(145deg,rgba(255,255,255,.89),rgba(249,232,255,.72) 45%,rgba(218,178,255,.73) 100%);
  -webkit-backdrop-filter:blur(9px) saturate(160%);
  backdrop-filter:blur(9px) saturate(160%);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,1),
    inset 0 -3px 7px rgba(173,120,225,.22),
    0 5px 15px rgba(131,72,189,.22),
    0 0 0 1px rgba(255,255,255,.35);
}
body:not(.pc-admin) #bottomNav.bottom-nav button.active::before{
  content:'';
  position:absolute;
  pointer-events:none;
  top:3px;
  left:14%;
  right:14%;
  height:5px;
  border-radius:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.97),transparent);
}
body:not(.pc-admin) #bottomNav.bottom-nav button.active .icon{
  color:#6e32e8;
  filter:drop-shadow(0 2px 3px rgba(142,67,222,.19));
}
body:not(.pc-admin) #bottomNav.bottom-nav button:active{
  transform:scale(.96);
}
body:not(.pc-admin) #bottomNav.bottom-nav button .nav-badge{
  top:1px;
  right:13%;
  z-index:3;
  background:#e84278;
  color:#fff;
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 2px 5px rgba(142,52,110,.24);
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  body:not(.pc-admin) #bottomNav.bottom-nav{background:rgba(255,251,255,.96);}
  body:not(.pc-admin) #bottomNav.bottom-nav button.active{background:#f3e2ff;}
}
@media(max-width:360px){
  body:not(.pc-admin) #bottomNav.bottom-nav{width:calc(100% - 18px);padding:6px 5px;gap:1px;border-radius:27px;}
  body:not(.pc-admin) #bottomNav.bottom-nav button{min-height:60px;padding:6px 1px 5px;font-size:10px;}
  body:not(.pc-admin) #bottomNav.bottom-nav button .icon svg{width:21px;height:21px;}
}
@media(prefers-reduced-motion:reduce){
  body:not(.pc-admin) #bottomNav.bottom-nav button{transition:none;}
}

/* SPHERE MOVING LIQUID NAV v2 — animated glass lens; existing tab icons/routes retained */
body:not(.pc-admin) #bottomNav.bottom-nav{touch-action:pan-y;}
body:not(.pc-admin) #bottomNav.bottom-nav .sphere-liquid-lens{
  position:absolute;left:0;top:0;z-index:1;pointer-events:none;
  width:0;height:0;opacity:0;border-radius:25px;
  border:1.5px solid rgba(255,255,255,.91);
  background:
    radial-gradient(ellipse 82% 35% at 42% 0%,rgba(255,255,255,.90),transparent 80%),
    radial-gradient(ellipse 75% 55% at 95% 103%,rgba(171,111,244,.32),transparent 93%),
    linear-gradient(145deg,rgba(255,255,255,.49),rgba(248,229,255,.27) 53%,rgba(197,153,250,.35));
  -webkit-backdrop-filter:blur(13px) saturate(240%) brightness(1.08);
  backdrop-filter:blur(13px) saturate(240%) brightness(1.08);
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.95),
    inset 0 -3px 6px rgba(140,81,206,.21),
    inset 2px 0 5px rgba(255,255,255,.67),
    inset -2px 0 7px rgba(179,122,234,.22),
    0 5px 16px rgba(105,63,160,.20),
    0 0 0 1px rgba(255,255,255,.21);
  transform:translate3d(0,0,0);
  transition:transform .54s cubic-bezier(.17,1.19,.32,1),width .32s ease,height .32s ease,opacity .16s ease;

}
body:not(.pc-admin) #bottomNav.bottom-nav .sphere-liquid-lens.ready{opacity:1;}

  content:'';position:absolute;left:13%;right:13%;top:3px;height:5px;

/* SPHERE IOS EDGE SWIPE BACK v1 — Apple UI only; Android styles untouched */
html.os-ios,html.os-ios body{overscroll-behavior-x:none;}
html.os-ios .sphere-ios-back-cue{
  position:fixed;left:0;top:50%;width:47px;height:62px;z-index:1000;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:rgba(255,255,255,.8);color:#6832d1;border:1px solid rgba(255,255,255,.94);
  border-radius:0 34px 34px 0;
  -webkit-backdrop-filter:blur(15px) saturate(190%);backdrop-filter:blur(15px) saturate(190%);
  box-shadow:2px 4px 18px rgba(63,35,120,.14),inset 0 1px 2px #fff;
  font:34px/1 -apple-system,BlinkMacSystemFont,sans-serif;
  opacity:0;transform:translate3d(-55px,-50%,0) scale(.86);
  will-change:transform,opacity;
}
html.os-ios .sphere-ios-back-cue.release{
  opacity:0!important;transform:translate3d(-55px,-50%,0) scale(.86)!important;
  transition:transform .2s ease-out,opacity .16s ease-out;
}
@media(prefers-reduced-motion:reduce){
 html.os-ios .sphere-ios-back-cue{transition:none!important;}
}

}

// SPHERE BACK NAVIGATION v3: Android/WebView + Android Chrome/PWA.
// Record the real screen sequence rather than jumping to Home or closing at each Back press.
let currentScreenName = 'splash';
let SP_NAV_TRAIL = [];
let SP_NAV_USER_KEY = null;
let SP_NAV_BACK_IN_PROGRESS = false;
let SP_LAST_EXIT_BACK = 0;
let SP_BACK_HINT_TIMER = null;
function sphereRememberNav(screen, data){
  if(screen === 'splash') return;
  const u = getCurrentUser();
  const identity = u ? u.id + '|' + u.role : 'guest';
  if(SP_NAV_USER_KEY !== identity){ SP_NAV_TRAIL = []; SP_NAV_USER_KEY = identity; }
  if(SP_NAV_BACK_IN_PROGRESS) return;
  // A completed login/sign-up starts a new session; don't back into old auth forms.
  const last = SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  if((screen === 'home' || screen === 'admin') && last &&
     ['authLanding','login','signup','otpLogin','chooseRole','onboard1','onboard2','onboard3'].includes(last.screen)){
    SP_NAV_TRAIL = [];
  }
  if(screen === 'editorDetails' && last && ['signup','chooseRole'].includes(last.screen)){
    SP_NAV_TRAIL = [];
  }
  let signature = '';
  try { signature = JSON.stringify(data ?? null); } catch(e) {}
  const current = SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  if(current && current.screen === screen && current.signature === signature) return;
  SP_NAV_TRAIL.push({ screen, data: data ?? null, signature });
  if(SP_NAV_TRAIL.length > 45) SP_NAV_TRAIL.shift();
  SP_LAST_EXIT_BACK = 0;
}

function sphereGoBack(){
  if(document.documentElement.classList.contains('os-ios') && Date.now()-sphereIosEdgeBackAt<650) return true;
  // Return true to native Android if the app handled Back; false ONLY on a second exit press.
  if(SP_NAV_BACK_IN_PROGRESS) return true;
  const root = ['home','authLanding','splash','onboard1','admin','otpLogin'];
  if(root.includes(currentScreenName)){
    if(Date.now() - SP_LAST_EXIT_BACK < 2000){ SP_LAST_EXIT_BACK = 0; return false; }
    SP_LAST_EXIT_BACK = Date.now();
    sphereBackHint();
    return true;
  }
  SP_LAST_EXIT_BACK = 0;
  let previous = null;
  if(SP_NAV_TRAIL.length > 1){
    // Go to the previous *different* page, never add a new entry during back navigation.
    SP_NAV_TRAIL.pop();
    previous = SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  }
  const fallback = currentUser
    ? (currentUser.baseRole === 'admin' && currentUser.role === 'admin' ? 'admin' : 'home')
    : 'authLanding';
  SP_NAV_BACK_IN_PROGRESS = true;
  Promise.resolve(nav(previous ? previous.screen : fallback, previous ? previous.data : undefined))
    .catch(e => console.warn('Sphere back navigation', e))
    .finally(() => { SP_NAV_BACK_IN_PROGRESS = false; });
  return true;
}

/* SPHERE IOS EDGE SWIPE BACK v3
 * Safari often SKIPS synthetic pushState guards on real edge swipes. On iOS
 * consume the native gesture at touchstart (capture, non-passive) and handle
 * back in Sphere, with an inner-edge fallback. Android logic stays untouched.
 */
let sphereIosEdgeBackAt=0;
function sphereIosSaveLeavingScreen(){
  if(!document.documentElement.classList.contains('os-ios')) return;
  const entry=SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  if(entry && entry.screen===currentScreenName) entry.iosScroll=window.scrollY;
}
function sphereIosRememberEnteredScreen(screen){
  if(!document.documentElement.classList.contains('os-ios')) return;
  const entry=SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  if(entry && entry.screen===screen && !SP_NAV_BACK_IN_PROGRESS){
    entry.iosContext={
      chatWith:currentChatWith,chatJob:currentChatJob,
      jobId:currentJobId,editorId:currentEditorId
    };
    if(typeof entry.iosScroll!=='number') entry.iosScroll=0;
  }
}
function sphereIosFallbackScreen(){
  if(currentScreenName==='chatInfo') return 'chatThread';
  if(currentScreenName==='chatThread') return 'chatList';
  if(['login','signup','chooseRole','resetPassword'].includes(currentScreenName)) return 'authLanding';
  if(['home','splash','authLanding','onboard1','admin','suspended'].includes(currentScreenName)) return null;
  const u=getCurrentUser();
  return u ? (u.baseRole==='admin' && u.role==='admin' ? 'admin' : 'home') : 'authLanding';
}
function sphereIosEdgeCanGoBack(){
  if(!document.documentElement.classList.contains('os-ios') ||
    document.body.classList.contains('pc-admin') || NAV_PENDING || SP_NAV_BACK_IN_PROGRESS) return false;
  // Never swipe away from a root tab, even if it was visited after another tab.
  if(['home','authLanding','splash','onboard1','admin','otpLogin','suspended'].includes(currentScreenName)) return false;
  if(document.querySelector('.sp-dlg-wrap:not(.hidden),.media-preview:not(.hidden),.img-viewer:not(.hidden),.sp-load-ov.on')) return false;
  const last=SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
  return ((last && last.screen===currentScreenName) ? SP_NAV_TRAIL.length>1 : SP_NAV_TRAIL.length>0)
    || !!sphereIosFallbackScreen();
}
function sphereIosEdgeGoBack(){
  if(!sphereIosEdgeCanGoBack()) return false;
  let previous=null;
  if(SP_NAV_TRAIL.length){
    const top=SP_NAV_TRAIL[SP_NAV_TRAIL.length-1];
    if(top && top.screen===currentScreenName) SP_NAV_TRAIL.pop();
    previous=SP_NAV_TRAIL[SP_NAV_TRAIL.length-1] || null;
  }
  const target=previous ? previous.screen : sphereIosFallbackScreen();
  if(!target) return false;
  if(previous && previous.iosContext){
    currentChatWith=previous.iosContext.chatWith;
    currentChatJob=previous.iosContext.chatJob;
    currentJobId=previous.iosContext.jobId;
    currentEditorId=previous.iosContext.editorId;
  }
  sphereIosEdgeBackAt=Date.now();
  SP_NAV_BACK_IN_PROGRESS=true;SP_LAST_EXIT_BACK=0;
  Promise.resolve(nav(target,previous ? previous.data : undefined)).then(()=>{
    if(previous && currentScreenName===target && previous.iosScroll>0)
      requestAnimationFrame(()=>window.scrollTo(0,previous.iosScroll));
  }).catch(e=>console.warn('Sphere iOS edge back:',e)).finally(()=>{SP_NAV_BACK_IN_PROGRESS=false;});
  return true;
}
if(document.documentElement.classList.contains('os-ios')){
  let swipe=null,cue=null;
  function edgeCue(){
    if(!cue){
      cue=document.createElement('div');cue.className='sphere-ios-back-cue';
      cue.setAttribute('aria-hidden','true');cue.textContent='‹';
      document.body.appendChild(cue);
    }
    return cue;
  }
  function clearEdge(){
    swipe=null;
    if(cue){cue.classList.add('release');cue.style.opacity='0';}
  }
  // Capture before Safari's native swipe-back starts. CSS overscroll alone
  // cannot stop WebKit's history swipe. The outer 28px must be consumed at
  // touchstart; otherwise Safari can leave the standalone PWA (white screen).
  document.addEventListener('touchstart',e=>{
    swipe=null;
    if(e.touches.length!==1) return;
    const t=e.touches[0],el=e.target;
    const x=t.clientX;
    if(x<0 || x>76) return;
    const interactive=!!(el && el.closest && el.closest('input,textarea,select,button,a,[contenteditable],#bottomNav,.chat-bubble,.msg-quote,.nt-item,.emoji-panel,.attach-sheet,.reply-bar,.media-preview,.img-viewer,[data-no-swipe-back]'));
    // Preserve taps and clicks on controls, including the top-left Back arrow.
    if(interactive) return;
    const nativeEdge=x<=28;
    if(nativeEdge && e.cancelable) e.preventDefault();
    // Even at Home, consume the system gesture, but do not navigate backwards.
    if(!sphereIosEdgeCanGoBack()) return;
    swipe={x,y:t.clientY,dx:0,dy:0,active:false};
    if(cue){cue.classList.add('release');cue.style.opacity='0';}
  },{capture:true,passive:false});
  document.addEventListener('touchmove',e=>{
    if(!swipe) return;
    if(e.touches.length!==1){clearEdge();return;}
    const t=e.touches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y;
    if(!swipe.active){
      if(dx< -8 || (Math.abs(dy)>12 && Math.abs(dy)>Math.abs(dx)*.8)){clearEdge();return;}
      // Horizontal intent must be unmistakable; normal scrolling remains.
      if(dx<35 || dx<Math.abs(dy)*2.5) return;
      swipe.active=true;
    }
    swipe.dx=dx;swipe.dy=dy;
    if(e.cancelable)e.preventDefault();
    const n=edgeCue();n.classList.remove('release');
    const p=Math.min(1,Math.max(0,dx/100));
    n.style.top=Math.max(44,Math.min(window.innerHeight-44,swipe.y))+'px';
    n.style.transform='translate3d('+(Math.min(25,dx*.22)-15)+'px,-50%,0) scale('+(0.86+p*.14)+')';
    n.style.opacity=String(Math.min(1,Math.max(0,(dx-10)/65)));
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(!swipe) return;
    const go=swipe.active && swipe.dx>=110 && Math.abs(swipe.dy)<Math.min(44,swipe.dx*.4);
    if(go && e.cancelable)e.preventDefault();
    clearEdge();
    if(go)sphereIosEdgeGoBack();
  },{passive:false});
  document.addEventListener('touchcancel',clearEdge,{passive:true});
}

// Chrome/PWA hardware-back gesture: intercept before the browser leaves Sphere.
(function sphereSetupBrowserBack(){
  if(!/^https?:$/.test(location.protocol)) return;
  const arm = () => { try { history.pushState({ sphereBackGuard: true }, '', location.href); } catch(e) {} };
  // On iOS, Safari skips pushState entries created without user activation.
  // Do NOT install a fake history entry and do NOT push another in popstate:
  // this was causing the native swipe to show a blank previous page.
  const isIOS=document.documentElement.classList.contains('os-ios');
  if(!isIOS) arm();
  window.addEventListener('popstate', () => {
    if(isIOS){
      if(!SP_NAV_BACK_IN_PROGRESS && Date.now()-sphereIosEdgeBackAt>=900)
        sphereIosEdgeGoBack();
      return;
    }
    if(sphereGoBack()) arm();
    else history.back(); // Android behavior unchanged: second Back at root can exit.
  });
})();

async function uploadRawFiles(fileList, statusEl){
  const files = Array.from(fileList || []);
  for(const f of files){
    if(!/^(image|video)\//.test(f.type)) throw new Error(`"${f.name}" is not a photo or video`);
    if(f.size > MAX_RAW_MB * 1024 * 1024) throw new Error(`"${f.name}" is bigger than ${MAX_RAW_MB} MB. Share big videos as a Google Drive / WeTransfer link.`);
  }
  const out = [];
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(statusEl) statusEl.textContent = `Uploading ${i + 1} of ${files.length}: ${f.name}…`;
    const ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';

      throw error;

function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This photo could not be opened. Try a JPG or PNG.')); };
    im.src = url;
  });
}
// Phone ki badi photo ko upload se pehle chhota karo (5 MB -> ~200 KB)
async function compressImage(file, maxDim, quality){
  const im = await loadImageFile(file);
  const scale = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * scale), h = Math.round(im.naturalHeight * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(im, 0, 0, w, h);
  return await new Promise((resolve, reject) => c.toBlob(b => b ? resolve(b) : reject(new Error('Could not process the photo')), 'image/jpeg', quality || 0.82));
}
async function uploadImage(file, folder, maxDim){
  if(!file) throw new Error('Choose a photo first');
  if(!file.type.startsWith('image/')) throw new Error('Only photos can be uploaded here (JPG/PNG). For videos, add a YouTube or Drive link.');
  if(file.size > 25 * 1024 * 1024) throw new Error('Photo is larger than 25 MB');
  const blob = await compressImage(file, maxDim || 1280);
  const path = `${currentUser.id}/${folder}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if(error) throw error;
  return path;
}

let PUSH_ON = false, PUSH_TRIED_FOR = null, PENDING_OPEN = null;

function pushSupported(){ return !IN_ANDROID_APP && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushB64uToBytes(s){ const t = String(s).replace(/-/g, '+').replace(/_/g, '/'); const b = atob(t + '='.repeat((4 - t.length % 4) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); }
function pushBytesToB64u(buf){ let s = ''; new Uint8Array(buf).forEach(x => { s += String.fromCharCode(x); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function ensurePush(){
  if(!pushSupported() || Notification.permission !== 'granted' || !getCurrentUser()) return false;
  try { if(localStorage.getItem('sp_push_off:' + getCurrentUser().id) === '1') return false; } catch(e) {}
  try {
    const reg = await navigator.serviceWorker.ready;
    let key = null;
    const r = await sb.rpc('sp_push_public_key'); if(!r.error) key = r.data;
    if(!key){ const f = await sb.functions.invoke('sphere-push', { body: { action: 'init' } }); key = f && f.data && f.data.publicKey; }
    if(!key){ reportCrash('Push: no server key'); return false; }
    let sub = await reg.pushManager.getSubscription();
    if(sub && sub.options && sub.options.applicationServerKey && pushBytesToB64u(sub.options.applicationServerKey) !== key){ try { await sub.unsubscribe(); } catch(e) {} sub = null; }
    if(!sub){
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushB64uToBytes(key) }); }
      catch(e){ reportCrash('Push: subscribe failed: ' + String(e && e.message || e).slice(0, 120)); return false; }
    }
    const j = sub.toJSON();
    const { error } = await sb.rpc('sp_push_subscribe', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent.slice(0, 200) });
    if(error){ reportCrash('Push: save failed: ' + String(error.message || '').slice(0, 120)); return false; }
    PUSH_ON = true; return true;
  } catch(e){ reportCrash('Push: ' + String(e && e.message || e).slice(0, 120)); return false; }
}
async function stopPushForThisPhone(){

    const reg = await navigator.serviceWorker.getRegistration(); if(!reg) return;
    const sub = await reg.pushManager.getSubscription(); if(!sub) return;
    try { await sb.rpc('sp_push_unsubscribe', { p_endpoint: sub.endpoint }); } catch(e) {}
    await sub.unsubscribe();
  } catch(e) {}
  PUSH_ON = false; PUSH_TRIED_FOR = null;
}

  if(!screenCacheHas(key)) return null;

  SCREEN_CACHE.delete(key);
  SCREEN_CACHE.set(key, item); // lightweight LRU recency update
  return item.html;
}
function screenCachePut(key, html){
  if(!key || typeof html !== 'string' || html.length > SCREEN_CACHE_MAX_BYTES) return;
  SCREEN_CACHE.delete(key);
  SCREEN_CACHE.set(key, { html, at: Date.now() });
  while(SCREEN_CACHE.size > SCREEN_CACHE_MAX){
    SCREEN_CACHE.delete(SCREEN_CACHE.keys().next().value);
  }
}
function swrKey(screen, data){
  if(!SWR_SCREENS.has(screen)) return null;
  const u = getCurrentUser(); if(!u) return null;
  let d = ''; try { d = JSON.stringify(data || null); } catch(e) { return null; }
  return u.id + '|' + (u.role || '') + '|' + screen + '|' + d;
}

function friendlyAuthError(error){
  const m = String(error && error.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'Wrong email or password. Forgot it? Tap "Forgot password?".';
  if(m.includes('email not confirmed')) return 'Please confirm your email first — open the link we emailed you (check Spam too), then log in.';
  if(m.includes('already registered')) return 'An account with this email already exists. Please log in.';
  if(m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Please try again in an hour.';
  if(m.includes('password should be')) return 'Password must be at least 6 characters.';
  return error.message;
}
async function forgotPassword(){

async function doLogin(){

 +'<defs><linearGradient id="'+id+'-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+palette[2]+'"/><stop offset=".46" stop-color="'+palette[0]+'"/><stop offset="1" stop-color="'+palette[1]+'"/></linearGradient>'

}

SCREENS.home = async () => {
  const user = getCurrentUser();
  if(!user){ nav('authLanding'); return ''; }
  if(user.role !== 'admin' && !cleanIndianPhone(user.phone)){ setTimeout(() => nav('addPhone'), 0); return ''; }
  if(user.role === 'editor') await loadFreeEditorOffer();
  const page = user.role==='editor' ? editorHomeScreen(user) : clientHomeScreen(user);
  const top = installBanner() + accountStatusBanner(user) + (user.role === 'editor' ? freeEditorBanner(user) : '');
  return page instanceof Promise ? page.then(h => top + h) : top + page;
};

  if(!list.length) return `<div class="se-empty">${editorAsset('available')}<b>No open jobs in this category</b><p>Try a different filter to discover projects.</p></div>`;

}

function aiChips(){
  const u = getCurrentUser();
  const list = u && u.role === 'editor'
    ? ['✍️ Write a bid message for me', '💡 How can I get more jobs?', '🎨 Tips to improve my portfolio', '💰 How do payouts work?']
    : ['✍️ Help me write a job post', '🎬 Suggest an editor for a wedding video', '📱 Best editor for Reels under ₹1000', '💳 How does payment work?'];
  return list.map(t => `<button class="ai-chip" onclick="sendAI(this.textContent.replace(/^\\S+\\s/, ''))">${t}</button>`).join('');
}
function aiFormat(t){
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/^\s*[-*•]\s+/gm, '• ');
  h = h.replace(/(SF-EDT-\d{3,5})/g, '<span class="ed-code" onclick="openEditorByCode(\'$1\')">$1</span>');
  return h.replace(/\n/g, '<br>');
}
function renderAIMessages(){
  const box = document.getElementById('aiBox');
  if(!box) return;
  const u = getCurrentUser();
  const hello = `<div class="chat-bubble them ai-bubble">Hi ${esc((u && u.name || '').split(' ')[0] || 'there')}! 👋 I'm <b>Sphere AI</b>. ${u && u.role === 'editor'
    ? 'I can help you write bids, improve your profile and grow on Sphere.'

// v2.22.28: one quiet retry if the phone briefly loses the connection; a failed message shows "Not delivered · Try again" like iMessage
async function aiInvoke(body){
  let r = await sb.functions.invoke('sphere-ai', { body });
  const netErr = e => e && /Failed to send a request|FunctionsFetchError|Load failed|NetworkError|fetch/i.test((e.name || '') + ' ' + (e.message || ''));
  if(netErr(r.error)){ await new Promise(z => setTimeout(z, 1200)); r = await sb.functions.invoke('sphere-ai', { body }); }
  return r;
}
function aiContext(){ return aiHistory.filter(m => !m.failed).slice(-12).map(m => ({ role: m.role, text: m.text })); }
let aiBusySince = 0;
async function sendAI(preset, retryIdx){
  if(aiBusy && Date.now() - aiBusySince < 60000) return;     // a stuck request never blocks Sphere AI for good
  aiBusySince = Date.now();
  let text = '';
  if(retryIdx != null){ const m = aiHistory[retryIdx]; if(!m) return; text = m.text; aiHistory.splice(retryIdx, 1); }
  else {
    const input = document.getElementById('aiInput');
    text = String(preset || (input && input.value) || '').trim();
    if(!text) return;
    if(input) input.value = '';
  }
  aiHistory.push({ role: 'user', text });
  aiBusy = true; renderAIMessages();
  const { data, error } = await aiInvoke({ messages: aiContext() });
  aiBusy = false;
  if(error || !data || !data.reply){
    const last = aiHistory[aiHistory.length - 1];
    let msg = error ? await functionError(error) : '';
    if(!msg || /Failed to send a request|Load failed|NetworkError|fetch/i.test(msg)) msg = 'Sphere AI could not be reached. Check your internet and try again.';
    last.failed = true; last.err = msg;
    renderAIMessages();
    return;
  }
  aiHistory.push({ role: 'model', text: data.reply });
  if(aiHistory.length > 24) aiHistory = aiHistory.slice(-24);
  renderAIMessages();
}
async function aiDraftJob(){
  if(aiBusy) return;
  const btn = document.getElementById('aiDraftBtn');

}

function editorPrice(e){ return parseInt(String(e.price || '').replace(/[^\d]/g, '')) || 0; }
async function runSmartMatch(){
  const cat = document.getElementById('smCat').value;
  const budget = Number(document.getElementById('smBudget').value) || 0;
  const box = document.getElementById('smResults');
  box.innerHTML = '<p class="muted center-text" style="margin:14px 0;">Searching…</p>';
  const editors = (await getVerifiedEditors()).filter(e => (e.categories.length ? e.categories : [e.category]).includes(cat));
  const score = e => (e.rating || 0) * 2 + Math.min(Number(e.experience) || 0, 10) * 0.3 + (e.reviews || 0) * 0.05;
  let list = budget ? editors.filter(e => editorPrice(e) && editorPrice(e) <= budget) : editors.slice();
  list.sort((a, b) => score(b) - score(a));
  let note = '';
  if(list.length === 0 && editors.length > 0){
    list = editors.slice().sort((a, b) => editorPrice(a) - editorPrice(b)).slice(0, 4);
    note = `<p class="muted" style="margin:12px 0;">No editors within ₹${budget}. Here are the most affordable ones:</p>`;
  }
  if(list.length === 0){
    box.innerHTML = `<p class="muted" style="margin:14px 0;">No verified editors in ${esc(cat)} yet. Post a job — new editors will apply.</p>
      <button class="btn btn-outline" onclick="nav('postJob')">+ Post Job</button>`;
    return;
  }
  box.innerHTML = note + `<h3 style="margin:16px 0 10px;">Top matches</h3><div class="grid2 sp-editor-directory">${renderEditorCards(list.slice(0, 6))}</div>`;
}

function renderPortfolio(e, items, editable){

    tiles.push(it.video_url && /^https?:\/\//i.test(it.video_url)
      ? `<a class="portfolio-item pf-entry" data-pf-category="${esc(portfolioCategoryOf(it))}" href="${esc(it.video_url)}" target="_blank" rel="noopener noreferrer" style="${bg}">${del}${inner}</a>`
      : `<div class="portfolio-item pf-entry" data-pf-category="${esc(portfolioCategoryOf(it))}" style="${bg}" onclick="safeOpen(${jsq(img)})">${del}${inner}</div>`);

async function loadPortfolio(editorId){
  const { data, error } = await sb.from('sp_portfolio').select('*').eq('editor_id', editorId).order('created_at', { ascending: false });

async function addPortfolioItem(){
  const title = document.getElementById('pwTitle').value.trim();
  const category = document.getElementById('pwCategory')?.value || '';
  const file = document.getElementById('pwPhoto').files[0];
  const video = document.getElementById('pwVideo').value.trim();
  if(!title){ alert('Enter a title'); return; }
  if(!CATEGORIES.includes(category)){ alert('Choose a portfolio category'); return; }
  if(video && !/^https?:\/\//i.test(video)){ alert('Video link must start with https://'); return; }
  if(!file && !youtubeThumb(video)){ alert('Choose a photo or add a YouTube link'); return; }
  const btn = document.getElementById('pwBtn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const { count } = await sb.from('sp_portfolio').select('id', { count: 'exact', head: true }).eq('editor_id', currentUser.id);
    if((count || 0) >= MAX_PORTFOLIO_ITEMS) throw new Error(`Max ${MAX_PORTFOLIO_ITEMS} items. Remove an old one first.`);
    const path = file ? await uploadImage(file, 'portfolio', 1280) : null;
    const { data: pRow, error } = await sb.from('sp_portfolio').insert({ editor_id: currentUser.id, title, category, image_path: path, video_url: video || null }).select('title').single();
    if(error){ await removeMedia(path); throw error; }
    contactCheck(title, pRow && pRow.title);
    nav('portfolio');
  } catch(e){
    alert('Upload failed: ' + (e.message || e));
    btn.disabled = false; btn.textContent = 'Add to Portfolio';
  }
}
async function deletePortfolioItem(id, path){
  if(!confirm('Remove this item from your portfolio?')) return;
  const { error } = await sb.from('sp_portfolio').delete().eq('id', id);
  if(dbErr(error)) return;
  await removeMedia(path);
  nav('portfolio');
}
async function editName(){

  const name = (prompt('Your name', u.name || '') || '').trim();

  if(name.length < 2 || name.length > 60){ alert('Name must be 2–60 characters'); return; }
  const { error } = await sb.from('profiles').update({ full_name: name }).eq('id', u.id);
  if(dbErr(error)) return;
  await fetchAndSetCurrentUser();
  contactCheck(name, (getCurrentUser() || {}).name);

}
async function changeAvatar(input){
  const file = input.files[0];
  if(!file) return;
  try {
    const old = currentUser.avatar;
    const path = await uploadImage(file, 'avatar', 400);
    const { error } = await sb.from('profiles').update({ avatar_url: path }).eq('id', currentUser.id);
    if(error){ await removeMedia(path); throw error; }
    await removeMedia(old);
    await fetchAndSetCurrentUser();
    nav('profile');
  } catch(e){ alert('Photo upload failed: ' + (e.message || e)); }

const CHAT_BUCKET = 'sphere-chat';
const CHAT_MAX_MB = 50;
function chatUrl(p){ return p ? registerSigned(CHAT_BUCKET, p, sb.storage.from(CHAT_BUCKET).getPublicUrl(p).data.publicUrl) : ''; }
function fmtTime(iso){ try { return new Date(iso).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); } catch(e){ return ''; } }
function dayKey(iso){ const d = new Date(iso); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(iso){
  const d = new Date(iso), t = new Date(), y = new Date(Date.now() - 86400000);
  if(dayKey(iso) === dayKey(t.toISOString())) return 'Today';
  if(dayKey(iso) === dayKey(y.toISOString())) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDur(sec){ sec = Math.max(0, Math.round(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function tickHtml(m){
  if(m.read_at) return '<span class="tick read" title="Seen">✓✓</span>';
  if(m.delivered_at) return '<span class="tick" title="Delivered">✓✓</span>';
  return '<span class="tick" title="Sent">✓</span>';
}
function msgPreview(m){
  if(m.media_type === 'image') return '📷 Photo' + (m.text ? ' · ' + m.text : '');
  if(m.media_type === 'video') return '🎥 Video' + (m.text ? ' · ' + m.text : '');
  if(m.media_type === 'audio') return '🎤 Voice message (' + fmtDur(m.duration_sec) + ')';
  return m.text || '';
}
function bubbleHtml(m, meId){
  const mine = m.sender_id === meId;
  let media = '';
  if(m.media_path){
    const u = esc(chatUrl(m.media_path));
    if(m.media_type === 'image') media = `<img class="chat-img" src="${u}" loading="lazy" alt="Photo" role="button" tabindex="0" onclick="openImageViewer(this.src)">`;
    else if(m.media_type === 'video') media = `<video class="chat-video" src="${u}" controls preload="metadata" playsinline></video>`;
    else if(m.media_type === 'audio') media = `<audio class="chat-audio" src="${u}" controls preload="none"></audio>`;
  }
  const modCls = m.mod_status === 'held' ? ' held' : m.mod_status === 'removed' ? ' removed' : '';
  MSG_INDEX.set(String(m.id), { mine, text: m.text || '', media: m.media_type || '' });
  const quote = m.reply_to ? replyQuoteHtml(String(m.reply_to)) : '';
  const tag = m.job_id && typeof currentChatJob !== 'undefined' && !currentChatJob ? `<small class="msg-proj" onclick="openProjectChat('${esc(m.job_id)}', '${esc(mine ? m.receiver_id : m.sender_id)}')">📁 ${'SPH-' + String(m.job_id).replace(/-/g, '').slice(0, 6).toUpperCase()}</small>` : '';
  return `<div class="chat-bubble ${mine ? 'me' : 'them'}${modCls}" data-id="${esc(m.id)}">${tag}${quote}${media}${m.text ? `<div>${esc(m.text)}</div>` : ''}<span class="msg-meta">${m.media_type === 'audio' ? '🎤 ' + fmtDur(m.duration_sec) + ' · ' : ''}${fmtTime(m.created_at)}${mine ? tickHtml(m) : ''}</span></div>`;
}
let lastChatDay = '';
function withDay(m, meId){
  if(m && HIDDEN_MSGS.has(String(m.id))) return '';          // "Delete for me"
  const k = dayKey(m.created_at);
  const sep = k !== lastChatDay ? `<div class="chat-day"><span>${dayLabel(m.created_at)}</span></div>` : '';
  lastChatDay = k;
  return sep + bubbleHtml(m, meId);
}

async function markDelivered(){

// ---- Part 21: live-update health + catch-up ----
// Realtime reconnects by itself but does not resend what arrived while it was down. So: when it
// (re)connects or the app comes back to the screen, fetch only the messages newer than the last one
// shown (no duplicates: every bubble carries its id). A light 10-second check runs ONLY while live
// updates are not connected.
let THREAD_SINCE = null, RT_OK = { msg: false, notif: false }, rtPollTimer = null, catchingUp = false;
function rtStatus(kind){
  return (status) => {
    const was = RT_OK[kind]; RT_OK[kind] = (status === 'SUBSCRIBED');
    if(RT_OK[kind] && !was){ if(kind === 'msg') catchUpChat(); else { try { refreshBell(); } catch(e) {} } }
    rtPollSchedule();
  };
}
function rtPollSchedule(){
  const need = !!currentUser && (!RT_OK.msg || !RT_OK.notif);
  if(need && !rtPollTimer) rtPollTimer = setInterval(() => { if(document.hidden || !currentUser) return; catchUpChat(); try { refreshBell(); } catch(e) {} }, 10000);
  if(!need && rtPollTimer){ clearInterval(rtPollTimer); rtPollTimer = null; }
}
async function catchUpChat(){
  if(!currentUser) return;
  const box = document.getElementById('chatBox');
  if(!box || currentScreenName !== 'chatThread' || !currentChatWith || !THREAD_SINCE || catchingUp){ refreshChatBadge(); return; }
  catchingUp = true;
  try {
    const me = currentUser.id;
    let q = sb.from('sp_messages').select('*')
      .or(`and(sender_id.eq.${me},receiver_id.eq.${currentChatWith}),and(sender_id.eq.${currentChatWith},receiver_id.eq.${me})`)
      .gt('created_at', THREAD_SINCE);
    if(currentChatJob) q = q.eq('job_id', currentChatJob);
    const { data } = await q.order('created_at', { ascending: true }).limit(100);
    let added = 0;
    (data || []).forEach(m => {
      if(m.created_at > THREAD_SINCE) THREAD_SINCE = m.created_at;
      if(box.querySelector(`.chat-bubble[data-id="${m.id}"]`)) return;
      if(box.querySelector('p.muted.center-text')) box.innerHTML = '';
      box.insertAdjacentHTML('beforeend', withDay(m, me)); added++;
    });
    if(added){ scrollChat(); if(!document.hidden) markRead(currentChatWith); }
  } catch(e) {} finally { catchingUp = false; refreshChatBadge(); }
}

// ---- live updates ----
function listenForMessages(){
  if(msgChannel || !currentUser) return;
  const me = currentUser.id;
  msgChannel = sb.channel('sphere-messages-' + me)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sp_messages', filter: `receiver_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      const box = document.getElementById('chatBox');
      const inThread = !!box && currentScreenName === 'chatThread' && m.sender_id === currentChatWith && (!currentChatJob || m.job_id === currentChatJob);
      if(inThread && box.querySelector(`.chat-bubble[data-id="${m.id}"]`)) return;   // already shown (catch-up got it first)
      if(inThread){
        if(m.created_at && (!THREAD_SINCE || m.created_at > THREAD_SINCE)) THREAD_SINCE = m.created_at;
        box.insertAdjacentHTML('beforeend', withDay(m, me));
        scrollChat();
        if(!document.hidden) markRead(m.sender_id); else markDelivered();
      } else {
        markDelivered();
      }
      alertIncoming(m, inThread);
      refreshChatBadge();
      if(currentScreenName === 'chatList') nav('chatList');
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sp_messages', filter: `sender_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      if((m.text && m.text.includes('📵')) || (m.mod_status && m.mod_status !== 'ok')){ refreshBubble(m); return; }
      const t = document.querySelector(`.chat-bubble[data-id="${m.id}"] .tick`);
      if(t && t.isConnected && t.parentElement) t.outerHTML = tickHtml(m);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sp_messages', filter: `receiver_id=eq.${me}` }, (payload) => {
      const m = payload.new;
      if((m.text && m.text.includes('📵')) || (m.mod_status && m.mod_status !== 'ok')) refreshBubble(m);
    })
    .subscribe(rtStatus('msg'));
}

async function insertMessage(row){
  const user = getCurrentUser();
  const base = { sender_id: user.id, receiver_id: currentChatWith, text: '' };
  if(currentChatJob) base.job_id = currentChatJob;
  if(REPLY_TO && !('reply_to' in row)) row = Object.assign({}, row, { reply_to: REPLY_TO.id });
  let { data, error } = await sb.from('sp_messages').insert(Object.assign({}, base, row)).select().single();
  if(error && row.reply_to && /reply_to|column|schema cache/i.test(error.message || '')){
    const r2 = Object.assign({}, row); delete r2.reply_to;   // database without replies yet (034): send as a normal message
    ({ data, error } = await sb.from('sp_messages').insert(Object.assign({}, base, r2)).select().single());
  }
  if(error && base.job_id && /belongs to another project/i.test(error.message || '')){
    alert('This chat is not linked to the selected project. Please reopen the correct conversation.'); return null;
  }
  if(error && base.job_id && /job_id|column|schema cache/i.test(error.message || '')){
    alert('Messaging is temporarily unavailable. Please contact Sphere support.'); return null;
  }
  if(error){
    if(/blocked/i.test(error.message || '')) alert('Message not sent — one of you has blocked the other.');
    else if(/row-level security/i.test(error.message || '')) alert('Message not sent. You cannot message this person right now.');
    else if(!dbErr(error)) alert('This message could not be sent. Please try again.');
    return null;
  }
  const box = document.getElementById('chatBox');
  if(box){
    if(box.querySelector('p.muted.center-text')) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', withDay(data, user.id));
    scrollChat();
  }
  notify(currentChatWith, 'New Message', `${user.name}: ${msgPreview(data).slice(0, 80)}`, { job_id: currentChatJob || null, category: 'messages' });
  if(data.mod_status === 'held'){
    alert('⏳ Your message is being checked by Sphere.\n\nIt looks like it may ask to talk or pay outside Sphere. It will be delivered if it is fine. Keep all talks and payments inside Sphere.');
    sb.functions.invoke('sphere-moderate', { body: { messageId: String(data.id) } }).then(() => {}, () => {});
  } else if(row.text) contactCheck(row.text, data.text);
  return data;
}

let SENDING = false;
async function sendMsg(){
  const input = document.getElementById('chatInput'); if(!input) return;
  const text = input.value.trim();
  if(!text || SENDING) return;                       // repeated taps never send twice
  SENDING = true; const btn = document.getElementById('sendBtn'); if(btn) btn.disabled = true;
  try {
    const ok = await insertMessage({ text });
    if(ok){ input.value = ''; clearReply(); }        // clear only after it was really sent
  } finally {
    SENDING = false; if(btn) btn.disabled = false;
    try { input.focus({ preventScroll: true }); } catch(e) { input.focus(); }   // keyboard stays open
  }
}

async function uploadChatFile(blobOrFile, ext, type){
  const user = getCurrentUser();
  const path = `${user.id}/chat/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from(CHAT_BUCKET).upload(path, blobOrFile, { contentType: type, upsert: false });
  if(error) throw error;
  return path;
}

async function sendChatMedia(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  const kind = f.type.startsWith('image/') ? 'image' : f.type.startsWith('video/') ? 'video' : null;
  if(!kind){ alert('You can send photos and videos here.'); return; }
  if(f.size > CHAT_MAX_MB * 1024 * 1024){ alert(`File is bigger than ${CHAT_MAX_MB} MB. Share big videos as a Google Drive link.`); return; }
  const btn = document.getElementById('sendBtn'); if(btn) btn.disabled = true;
  try {
    const ext = (f.name.split('.').pop() || (kind === 'image' ? 'jpg' : 'mp4')).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
    const path = await uploadChatFile(f, ext, f.type);
    const caption = (document.getElementById('chatInput').value || '').trim();
    if(caption) document.getElementById('chatInput').value = '';
    await insertMessage({ text: caption, media_path: path, media_type: kind, media_name: f.name.slice(0, 80) });
  } catch(e){ alert('Upload failed: ' + (e.message || e)); }
  if(btn) btn.disabled = false;
}

// ---- voice messages ----
let recMedia = null, recChunks = [], recStart = 0, recTimer = null, recStream = null;
function recording(){ return !!(recMedia && recMedia.state === 'recording'); }
function showRecBar(on){
  const bar = document.getElementById('recBar'), input = document.getElementById('chatInput'), mic = document.getElementById('micBtn');
  if(bar) bar.style.display = on ? 'flex' : 'none';
  if(input) input.style.display = on ? 'none' : '';
  if(mic) mic.style.display = on ? 'none' : '';
}
async function startVoice(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    alert('Voice messages are not supported here. Please use Chrome.'); return;
  }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ alert('Please allow the microphone to send voice messages.'); return; }
  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  recMedia = new MediaRecorder(recStream, type ? { mimeType: type } : undefined);
  recChunks = [];
  recMedia.ondataavailable = (e) => { if(e.data && e.data.size) recChunks.push(e.data); };
  recMedia.start();
  recStart = Date.now();
  showRecBar(true);
  recTimer = setInterval(() => {
    const sec = (Date.now() - recStart) / 1000;
    const t = document.getElementById('recTime'); if(t) t.textContent = fmtDur(sec);
    if(sec >= 120) stopVoice(true);   // max 2 minutes
  }, 500);
}
function stopVoice(send){
  if(!recMedia) return;
  clearInterval(recTimer);
  const media = recMedia; recMedia = null;
  media.onstop = async () => {
    if(recStream) recStream.getTracks().forEach(t => t.stop());
    showRecBar(false);
    const secs = Math.round((Date.now() - recStart) / 1000);
    if(!send || secs < 1) return;
    const type = (media.mimeType || 'audio/webm').split(';')[0];
    const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
    try {
      const path = await uploadChatFile(new Blob(recChunks, { type }), ext, type);
      await insertMessage({ media_path: path, media_type: 'audio', media_name: 'Voice message', duration_sec: secs });
    } catch(e){ alert('Voice message failed: ' + (e.message || e)); }
  };
  media.stop();
}

async function extendDeadline(jobId){

  if(!d){ alert('Choose a new deadline'); return; }

  if(!await updateJob(jobId, { deadline: d })) return;
  alert('Job reopened ✅');
  currentJobId = jobId; nav('projectStatus');
}
async function addRawFiles(jobId, input){
  const job = await getJob(jobId);
  if(!job) return;
  if(job.rawFiles.length + input.files.length > MAX_RAW_FILES){ alert(`You can attach up to ${MAX_RAW_FILES} files per job`); input.value = ''; return; }
  try {
    const added = await uploadRawFiles(input.files, document.getElementById('rawAddStatus'));
    if(!await updateJob(jobId, { raw_files: [...job.rawFiles, ...added] })){
      await sb.storage.from(RAW_BUCKET).remove(added.map(x => x.path)); return;
    }
    if(job.assignedEditor) await notify(job.assignedEditor, 'New files added 📎', `The client added ${added.length} file(s) to your ${job.category} project.`);
    currentJobId = jobId; nav('projectStatus');
  } catch(e){ alert('Upload failed: ' + (e.message || e)); input.value = ''; }
}
async function removeRawFile(jobId, idx){
  if(!confirm('Remove this file?')) return;
  const job = await getJob(jobId);
  if(!job || !job.rawFiles[idx]) return;
  const f = job.rawFiles[idx];
  if(!await updateJob(jobId, { raw_files: job.rawFiles.filter((_, i) => i !== idx) })) return;
  await sb.storage.from(RAW_BUCKET).remove([f.path]);
  currentJobId = jobId; nav('projectStatus');
}

async function deleteMyAccount(){
  const v = ((document.getElementById('delConfirm') || {}).value || '').trim();
  if(v.toUpperCase() !== 'DELETE'){ alert('Type DELETE in the box to confirm.'); return; }
  if(!confirm('Delete your Sphere account forever? This cannot be undone.')) return;
  const btn = document.getElementById('delBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Deleting…'; }
  const u = getCurrentUser();
  try {   // your pictures (profile photo, portfolio) first
    const { data: files } = await sb.storage.from(MEDIA_BUCKET).list(u.id, { limit: 1000 });
    if(files && files.length) await sb.storage.from(MEDIA_BUCKET).remove(files.map(f => u.id + '/' + f.name));
  } catch(e) {}
  const { error } = await sb.rpc('sp_delete_my_account', { p_confirm: 'DELETE' });
  if(error){ if(btn){ btn.disabled = false; btn.textContent = 'Delete my account forever'; } alert(/function|schema cache/i.test(error.message || '') ? 'Please try again in a minute.' : error.message); return; }
  try { await stopPushForThisPhone(); } catch(e) {}
  VERIFIED_CACHE = null; CLIENT_DASH_CACHE = { uid: null, html: '' }; PREMIUM_CACHE.clear(); SCREEN_CACHE.clear(); stopChatPresence();
  loggingOut = true; clearSessionState();
  try { await sb.auth.signOut(); } catch(e) {}
  loggingOut = false;
  alert('Your Sphere account has been deleted.');
  nav('authLanding');
}
async function logout(){
  await stopPushForThisPhone();
  VERIFIED_CACHE = null; CLIENT_DASH_CACHE = { uid: null, html: '' }; PREMIUM_CACHE.clear(); SCREEN_CACHE.clear(); stopChatPresence();   // Part C: forget cached screens on logout
  PHONE_V = { uid: null, st: null, at: 0 }; stopPvPoll();
  loggingOut = true;
  clearSessionState();
  await sb.auth.signOut();
  loggingOut = false;
  nav('authLanding');
}

async function loadSuspicious(){
  let lim = 3;
  try {
    const { data } = await sb.from('sp_settings').select('value').eq('key', 'strike_limit').maybeSingle();
    const v = parseInt(String(data && data.value).replace(/\D/g, ''), 10);
    if(v > 0) lim = v;
  } catch(e) {}
  const { data: flags, error } = await sb.from('sp_mod_flags').select('*').or(`strike_count.gte.${lim},is_suspended.eq.true`);
  if(error){ console.warn('Suspicious list not ready:', error.message); return { ready: false, list: [], lim }; }
  const { data: outRep } = await sb.from('sp_reports').select('against_id, chat_user_id').eq('status', 'open').eq('reason', OUTSIDE_DEAL_REASON);
  const map = {};
  const fill = f => { map[f.user_id] = Object.assign(map[f.user_id] || { id: f.user_id, reports: 0 }, { strikes: f.strike_count, suspended: f.is_suspended, warnedAt: f.warned_at }); };
  (flags || []).forEach(fill);
  (outRep || []).forEach(r => { const id = r.chat_user_id || r.against_id; if(!id) return; map[id] = map[id] || { id, strikes: 0, suspended: false, reports: 0 }; map[id].reports++; });
  const ids = Object.keys(map);
  if(ids.length === 0) return { ready: true, list: [], lim };
  const { data: more } = await sb.from('sp_mod_flags').select('*').in('user_id', ids);
  (more || []).forEach(fill);
  const { data: st } = await sb.from('sp_mod_strikes').select('user_id, source, original_text, created_at').in('user_id', ids).eq('cleared', false).order('created_at', { ascending: false }).limit(300);
  (st || []).forEach(m => { const x = map[m.user_id]; x.samples = x.samples || []; if(x.samples.length < 3) x.samples.push(m); });
  const people = await getProfilesByIds(ids);
  const list = ids.map(id => Object.assign(map[id], { p: people[id] }))
    .sort((a, b) => (b.strikes + b.reports * 2) - (a.strikes + a.reports * 2));
  return { ready: true, list, lim };
}

/* ============ PART 2: AUTH + ROLE ACCESS ============
   Who can open which screen. nav() asks routeGate() first.
   Access levels:
     public       — anyone, even logged out (welcome, login, sign up, password reset)
     auth         — logged in, profile not finished yet (pick role, add phone)
     user         — any finished account (Client, Editor or Admin)
     client       — Client mode (clients, editors switched to Client, admins in Admin mode)
     editor       — Editor mode (editors, admins switched to Editor)
     editorAccount— an Editor account in any mode, or an admin in Editor mode
     admin        — Admin accounts only
   This protects the screens. The database (RLS + triggers) protects the data. */
const ROUTE_ACCESS = Object.freeze({
  splash: 'public', getApp: 'public', onboard1: 'public', onboard2: 'public', onboard3: 'public',
  authLanding: 'public', login: 'public', signup: 'public', resetPassword: 'public',
  chooseRole: 'auth', addPhone: 'auth',
  home: 'user', profile: 'user', settingsScreen: 'user', notifications: 'user',
  chatList: 'user', chatThread: 'user', chatInfo: 'user',
  support: 'user', report: 'user', myReports: 'user', sphereAI: 'user',
  categories: 'user', categoryDetail: 'user', allEditors: 'user', verifiedEditorsScreen: 'user',
  editorProfile: 'user', jobs: 'user', projectStatus: 'user', portfolio: 'user',
  escrowScreen: 'user', vaultScreen: 'user', editProfile: 'user', previewPlayer: 'user', notifSettings: 'user', deleteAccount: 'user', verifyPhone: 'user', premiumScreen: 'client',
  postJob: 'client', applications: 'client', payment: 'client', savedList: 'client', ratings: 'client',
  jobBidScreen: 'editor', editorEarnings: 'editor', 
  editorDetails: 'editorAccount', verificationStatus: 'editorAccount', editorProfileEdit: 'editorAccount', proScreen: 'editorAccount',
  admin: 'admin', caseFile: 'admin', adminClassic: 'admin', adminProject: 'admin', adminUser: 'admin'
});
// Screens that belong to one job: only the people in that job (or an admin) may open them.
const JOB_SCREENS = Object.freeze({ projectStatus: 'party', applications: 'owner', payment: 'owner', ratings: 'owner', previewPlayer: 'member' });

function routeAccess(screen){ return ROUTE_ACCESS[screen] || 'user'; }
function hasRouteAccess(level, u){
  switch(level){
    case 'public': return true;
    case 'auth': return !!(u || pendingAuthUser);
    case 'user': return !!u;
    case 'client': return isClientRole(u);
    case 'editor': return usingMode(u, ROLES.EDITOR);
    case 'editorAccount': return isEditorAccount(u) || (isAdminUser(u) && usingMode(u, ROLES.EDITOR));
    case 'admin': return isAdminUser(u);
    default: return !!u;
  }
}
// ===== v2.22.40: phone verification on WhatsApp — the user SENDS a code to Sphere's number (free, no SMS) =====
// Server side: sp_phone_verify_start / _status / _complete + Edge Function sphere-wa-verify (Meta WhatsApp Cloud API webhook).
// Switch on in Supabase: sp_settings wa_verify_number = Sphere's WhatsApp number, then wa_verify_required = 1.
const PHONE_OK_SCREENS = ['verifyPhone', 'support', 'suspended', 'deleteAccount', 'authLanding', 'login', 'signup', 'public'];
var PHONE_V = { uid: null, st: null, at: 0 }, PV_POLL = null, PV_POLL_CHECK = null, PV_POLL_BUSY = false;
function waRequired(){ return String(SETTINGS.wa_verify_required) === '1'; }
async function phoneVerifyStatus(force){
  const u = getCurrentUser(); if(!u) return null;
  const fresh = PHONE_V.uid === u.id && PHONE_V.st && (PHONE_V.st.verified || Date.now() - PHONE_V.at < (PHONE_V.st.required ? 3000 : 300000));
  if(fresh && !force) return PHONE_V.st;
  try {
    const { data, error } = await sb.rpc('sp_phone_verify_status');
    if(error || !data) return PHONE_V.uid === u.id ? PHONE_V.st : null;       // can't check → never lock people out
    PHONE_V = { uid: u.id, st: data, at: Date.now() }; return data;
  } catch(e) { return null; }
}
function waNumber10(){ return String(SETTINGS.wa_verify_number || '').replace(/\D/g, '').slice(-10); }
SCREENS.verifyPhone = async () => {
  const st = await phoneVerifyStatus(true) || {};

  const ready = waNumber10().length === 10;
  return `<div class="screen" style="padding-top:28px;">
    <div style="text-align:center; font-size:46px;">💬</div>
    <h2 style="text-align:center; margin:6px 0 4px;">Verify your mobile number</h2>

      <ol style="font-size:13px; margin:2px 0 12px 18px; line-height:1.7;">

      ${ready ? '' : '<p class="muted center-text" style="font-size:12px; margin-top:8px;">Verification is being set up. Please try again a little later.</p>'}
      <p id="vpMsg" class="center-text" style="font-size:13px; margin-top:10px; min-height:18px;"></p>
      <p id="vpCode" class="center-text muted" style="font-size:12px;"></p>
    </div>
    <p class="center-text muted" style="font-size:12px; margin-top:14px;">Wrong number? Change it above and tap the button again.</p>
    <p class="center-text" style="margin-top:6px;"><span class="link" onclick="nav('support')">Need help?</span> · <span class="link" onclick="stopPvPoll(); logout()">Log out</span></p>
  </div>`;
};
function stopPvPoll(){
  if(PV_POLL) clearInterval(PV_POLL);
  PV_POLL = null; PV_POLL_CHECK = null;
}
async function startPhoneVerify(){
  const msg = document.getElementById('vpMsg'), btn = document.getElementById('vpBtn'), say = (t, bad) => { if(msg){ msg.textContent = t; msg.style.color = bad ? '#c62828' : 'inherit'; } };
  const phone = readPhone('vpPhone'); if(!phone) return;
  const n = String(phone).replace(/\D/g, '').slice(-10), u = getCurrentUser();
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try {
    if(n !== String(u.phone || '').replace(/\D/g, '').slice(-10)){            // number changed → save it first
      const { error: pe } = await sb.from('profiles').update({ phone: '+91' + n }).eq('id', u.id);
      if(pe) throw pe; u.phone = '+91' + n;
    }
    const { data, error } = await sb.rpc('sp_phone_verify_start', { p_phone: n });
    if(error) throw error;
    const url = 'https://wa.me/91' + waNumber10() + '?text=' + encodeURIComponent(data.code);
    const c = document.getElementById('vpCode'); if(c) c.innerHTML = 'If WhatsApp did not open, send this code to <b>+91 ' + esc(waNumber10()) + '</b>:<br><b style="font-size:18px; letter-spacing:1px;">' + esc(data.code) + '</b>';
    say('⏳ Waiting for your WhatsApp message…');
    window.open(url, '_blank');
    stopPvPoll(); let tries = 0;
    // Check only while this screen is visible, and never overlap slow requests.
    // Coming back from WhatsApp triggers an immediate check below.
    const check = async () => {
      if(!PV_POLL) return;
      if(currentScreenName !== 'verifyPhone'){ stopPvPoll(); return; }
      if(document.hidden || PV_POLL_BUSY) return;
      if(++tries > 600){ stopPvPoll(); say('Time is up. Tap the button to get a new code.', true); return; }
      PV_POLL_BUSY = true;
      const runningTimer = PV_POLL;
      try {
        const st = await phoneVerifyStatus(true);
        if(PV_POLL === runningTimer && currentScreenName === 'verifyPhone' && st && st.verified){
          stopPvPoll(); say('✅ Number verified!'); setTimeout(() => nav('home'), 600);
        }
      } finally { PV_POLL_BUSY = false; }
    };
    PV_POLL_CHECK = check;
    PV_POLL = setInterval(() => { check().catch(() => {}); }, 3000);
  } catch(e) {
    say(String((e && e.message) || e).replace(/^.*?:\s*(?=This|Enter|Please)/, ''), true);
  }
  if(btn){ btn.disabled = false; btn.textContent = '💬 Verify on WhatsApp'; }
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && PV_POLL_CHECK && currentScreenName === 'verifyPhone') PV_POLL_CHECK().catch(() => {});
});

async function routeGate(screen){
  const level = routeAccess(screen);
  const u = getCurrentUser();
  if(level === 'public') return { ok: true };
  if(!u && !(level === 'auth' && pendingAuthUser)) return { ok: false, to: 'authLanding' };
  if(!hasRouteAccess(level, u)){
    if(level === 'admin') return { ok: false, to: 'home', msg: 'This page is for admins only.' };
    if(level === 'editor' || level === 'editorAccount'){
      return { ok: false, to: 'home', msg: isEditorAccount(u) || isAdminUser(u)
        ? 'This is part of Editor mode. Switch to Editor from Profile.'
        : 'This page is for editors. You can become an editor from Profile.' };
    }
    if(level === 'client') return { ok: false, to: 'home', msg: isAdminUser(u)
      ? 'This is part of Admin mode. Switch back to Admin mode from Profile.'
      : 'This is part of Client mode. Switch to Client from Profile to hire editors.' };
    return { ok: false, to: 'home' };
  }
  if(u && !isAdminUser(u) && !PHONE_OK_SCREENS.includes(screen)){      // v2.22.40: number must be verified on WhatsApp (when the admin switches it on)
    const pv = await phoneVerifyStatus();
    if(pv && pv.required && !pv.verified) return { ok: false, to: 'verifyPhone' };
  }
  const rule = JOB_SCREENS[screen];
  if(rule && typeof currentJobId !== 'undefined' && currentJobId){
    const job = await getJob(currentJobId);
    if(job){
      const owner = job.clientId === u.id;
      const party = owner || job.assignedEditor === u.id;
      const allowed = isAdminUser(u) || (rule === 'owner' ? owner : rule === 'member' ? party : (party || job.status === 'open'));
      if(!allowed) return { ok: false, to: 'jobs', msg: 'You do not have access to this project.' };
    }
  }
  return { ok: true };
}

// One project as the client sees it: friendly status, what (if anything) they need to do
function clientProjectView(j, bidCount, editor, user){
  const key = isExpired(j) ? 'expired' : (j.status === 'delivered' && ['disputed', 'team_review'].includes(j.reviewState)) ? j.reviewState : (CLIENT_STATUS[j.status] ? j.status : 'open');
  let action = '';
  if(key === 'open' && bidCount > 0) action = bidCount + (bidCount === 1 ? ' bid' : ' bids') + ' received — choose an editor';
  if(key === 'negotiating' && j.proposedBy && j.proposedBy !== user.id) action = 'The editor sent a price — reply';
  if(key === 'payment-pending') action = 'Pay to start the work';
  if(key === 'delivered') action = 'Watch the final video — release payment or tell us what is wrong';
  const w = WORK_CACHE[j.id];
  if(w && key === 'in-progress'){
    if(w.pending_extension_hours) action = 'The editor asked for more time — reply';
    else if(w.phase === 'preview') action = 'Preview is ready — have a look';
    else if(workState(w).key === 'late') action = 'The editor is late — you can give more time';
  }
  return {
    job: j, key, meta: CLIENT_STATUS[key], action, bids: bidCount,
    active: CLIENT_ACTIVE.includes(key),
    editorName: editor ? (editor.name || 'Editor') : '',
    amount: Number(j.lockedAmount || j.budget || 0)
  };
}
async function loadClientProjects(user){
  const { data, error } = await sb.from('sp_jobs').select('*').eq('client_id', user.id).order('created_at', { ascending: false });
  if(error){ console.error(error); return { ok: false, items: [], stats: clientStats([]) }; }
  const list = (data || []).map(mapJob);
  const openIds = list.filter(j => j.status === 'open' && !isExpired(j)).map(j => j.id);
  const bids = {};
  if(openIds.length){
    const { data: apps } = await sb.from('sp_applications').select('job_id').in('job_id', openIds);
    (apps || []).forEach(a => { bids[a.job_id] = (bids[a.job_id] || 0) + 1; });
  }
  const edIds = [...new Set(list.map(j => j.assignedEditor).filter(Boolean))];
  // Independent profile and work-details reads run together, not serially.
  const [eds] = await Promise.all([
    edIds.length ? getProfilesByIds(edIds) : Promise.resolve({}),
    loadWorkFor(list.filter(j => j.assignedEditor).map(j => j.id))
  ]);
  const items = list.map(j => clientProjectView(j, bids[j.id] || 0, eds[j.assignedEditor], user));
  return { ok: true, items, stats: clientStats(items) };
}
function clientStats(items){
  return {
    total: items.length,
    active: items.filter(x => x.active).length,
    needYou: items.filter(x => x.action).length,
    done: items.filter(x => x.key === 'approved' || x.key === 'closed').length,
    spent: items.filter(x => CLIENT_PAID.includes(x.key)).reduce((t, x) => t + x.amount, 0)
  };
}

async function editProfilePhoto(input){
  const file = input.files && input.files[0];

    const path = await uploadImage(file, 'avatar', 400);
    const { error } = await sb.from('profiles').update({ avatar_url: path }).eq('id', currentUser.id);

  const name = document.getElementById('epName').value.trim();

  const phone = readPhone('epPhone');

  const changes = {};
  if(name !== u.name) changes.full_name = name;
  if(phone !== cleanIndianPhone(u.phone)) changes.phone = phone;
  if(Object.keys(changes).length === 0){ nav('profile'); return; }
  const btn = document.getElementById('epSave'); if(btn) btn.disabled = true;

  if(dbErr(error)) return;
  await fetchAndSetCurrentUser();

  alert('Profile saved ✅');

}

// Update my profile; if the Part 4 SQL isn't installed yet, retry without the new columns
async function profileUpdate(changes){
  let { error } = await sb.from('profiles').update(changes).eq('id', currentUser.id);
  if(error && /column|schema cache|does not exist|Could not find/i.test(error.message || '')){
    const old = Object.fromEntries(Object.entries(changes).filter(([k]) => !PART4_COLUMNS.includes(k)));
    if(Object.keys(old).length === 0) return { error: { message: 'This needs the latest database update (004_editor_profile.sql).' }, skipped: true };
    ({ error } = await sb.from('profiles').update(old).eq('id', currentUser.id));
    return { error, skipped: true };
