let notifTab = 'all', notifLimit = 30, notifChannel = null, lastToastId = 0;

async function refreshBell(){
  if(!currentUser) return;
  let n = 0;
  try {
    let r = await sb.from('sp_notifications').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('is_read', false)
      .or('category.is.null,category.neq.messages');                       // chat messages are not counted on the bell
    if(r.error) r = await sb.from('sp_notifications').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('is_read', false);
    n = r.count || 0;
  } catch(e) {}
  document.querySelectorAll('.bell-n').forEach(el => { el.hidden = !n; el.textContent = n > 99 ? '99+' : String(n); });
}
function startNotifRealtime(){
  if(!currentUser || notifChannel) return;
  try {
    notifChannel = sb.channel('notif-' + currentUser.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sp_notifications', filter: `user_id=eq.${currentUser.id}` }, (payload) => {
        const n = payload.new || {};
        refreshBell();
        if(currentScreenName === 'notifications') return nav('notifications');
        if(n.id && n.id !== lastToastId && !(currentScreenName === 'chatThread' && n.category === 'messages')) { lastToastId = n.id; showNotifToast(n); }
      }).subscribe(rtStatus('notif'));
  } catch(e) { notifChannel = null; }
}
function showNotifToast(n){
  const old = document.querySelector('.nt-toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'nt-toast';
  el.innerHTML = `<b>${esc((NOTIF_CATS[n.category] || NOTIF_CATS.general)[0] + ' ' + (n.title || 'Notification'))}</b>${esc(String(n.body || '').slice(0, 120))}`;
  el.onclick = () => { el.remove(); openNotif(n.id, n.link, n.job_id); };
  document.body.appendChild(el);
  setTimeout(() => { if(el.parentNode) el.remove(); }, 5000);
}
function notifTarget(link, jobId){
  const l = link || (jobId ? { screen: 'project', job: jobId } : null);
  if(!l || !l.screen) return () => {};
  if(l.screen === 'project' && l.job) return () => openJob(l.job);
  if(l.screen === 'applications' && l.job) return () => { currentJobId = l.job; nav('applications'); };
  if(l.screen === 'admin') return () => nav('admin', { tab: l.tab || 'overview' });
  return () => nav(l.screen);
}
async function openNotif(id, link, jobId){
  if(id) await sb.rpc('sp_notif_mark_read', { p_ids: [id] }).then(r => r.error ? sb.from('sp_notifications').update({ is_read: true }).eq('id', id) : r, () => {});
  refreshBell();
  if(typeof link === 'string'){ try { link = JSON.parse(link); } catch(e) { link = null; } }
  const go = notifTarget(link, jobId);
  go();
}
async function markAllNotifs(){
  const { error } = await sb.rpc('sp_notif_mark_read', { p_ids: null });
  if(error) await sb.from('sp_notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);

async function deleteNotif(ev, id){
  ev.stopPropagation();
  const { error } = await sb.rpc('sp_notif_delete', { p_id: id });

    if(/schema cache|Could not find/i.test(error.message || '')){ const r = await sb.from('sp_notifications').delete().eq('id', id); if(r.error){ alert(r.error.message); return; } }

  refreshBell(); nav('notifications');
}

// iOS-style helpers for the Notifications screen
function ntIST(ts){ return new Date(new Date(ts).toLocaleString('en-US', { timeZone: 'Asia/Kolkata' })); }
function ntDayGroup(ts){
  const d = ntIST(ts), now = ntIST(Date.now());
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  return diff <= 0 ? 0 : diff === 1 ? 1 : 2;
}
function ntTime(ts){
  if(!ts) return '';
  const mins = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  const g = ntDayGroup(ts);
  if(mins < 1) return 'now';
  if(mins < 60) return mins + 'm ago';
  if(g === 0) return Math.floor(mins / 60) + 'h ago';
  if(g === 1) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
}
let ntSw = null;
function ntClose(except){ document.querySelectorAll('.nt-item[data-open]').forEach(el => { if(el !== except){ el.style.transform = ''; delete el.dataset.open; } }); }
function ntTS(e, el){ const t = e.touches[0]; ntSw = { el, x: t.clientX, y: t.clientY, dx: 0, base: el.dataset.open ? -84 : 0, h: null }; el.style.transition = 'none'; }
function ntTM(e, el){
  if(!ntSw || ntSw.el !== el) return;
  const t = e.touches[0], dx = t.clientX - ntSw.x, dy = t.clientY - ntSw.y;
  if(ntSw.h === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) ntSw.h = Math.abs(dx) > Math.abs(dy);
  if(!ntSw.h) return;
  ntSw.dx = dx; el.style.transform = `translateX(${Math.min(0, Math.max(-110, ntSw.base + dx))}px)`;
}
function ntTE(el){
  if(!ntSw || ntSw.el !== el) return;
  el.style.transition = '';
  if(ntSw.h){ const pos = ntSw.base + ntSw.dx; if(pos < -40){ ntClose(el); el.style.transform = 'translateX(-84px)'; el.dataset.open = '1'; el.dataset.swiped = '1'; } else { el.style.transform = ''; delete el.dataset.open; el.dataset.swiped = '1'; } setTimeout(() => { delete el.dataset.swiped; }, 400); }

const INTERNAL_ERR = /(violates|relation "|column "|permission denied|function .* does not exist|syntax error|duplicate key value|null value in column|invalid input syntax|JWT|PGRST|schema cache|row-level security|out of range|deadlock|could not serialize|timeout|unexpected end of JSON|Failed to fetch|NetworkError)/i;
function friendlyError(msg){
  const m = String(msg == null ? '' : msg);
  if(/Failed to fetch|NetworkError|timeout/i.test(m)) return 'Network problem — please check your internet and try again.';
  if(/row-level security|permission denied/i.test(m)) return 'You are not allowed to do that.';
  if(/duplicate key value/i.test(m)) return 'This was already done.';

}

// --- private files: swap public links for signed links (works before and after 017b)
const SIGN_MAP = new Map();            // public url → { bucket, path }
const SIGNED = new Map();              // public url → { url, until }
let signTimer = null, SIGN_SESSION_EPOCH = 0;
function registerSigned(bucket, path, publicUrl){
  if(path && publicUrl){
    SIGN_MAP.set(publicUrl, { bucket, path });
    // Covers links registered after their DOM node was already inserted.
    scheduleSign();
  }
  return publicUrl;
}
async function resolveSignedMedia(){
  signTimer = null;
  const epoch = SIGN_SESSION_EPOCH;
  const signedFor = getCurrentUser() && getCurrentUser().id;
  const els = document.querySelectorAll('img[src], video[src], audio[src], source[src], a[href]');
  const need = new Map();
  els.forEach(el => {
    const attr = el.tagName === 'A' ? 'href' : 'src';
    const u = el.getAttribute(attr);
    if(!u || !SIGN_MAP.has(u)) return;
    const c = SIGNED.get(u);
    if(c && c.until > Date.now()) { el.setAttribute(attr, c.url); return; }
    const info = SIGN_MAP.get(u);
    if(!need.has(info.bucket)) need.set(info.bucket, new Map());
    need.get(info.bucket).set(info.path, u);
  });
  for(const [bucket, paths] of need){
    try {
      const { data } = await sb.storage.from(bucket).createSignedUrls([...paths.keys()], 3600);
      // Never retain or write a private link from an old signed-out session.
      if(epoch !== SIGN_SESSION_EPOCH || (getCurrentUser() && getCurrentUser().id) !== signedFor) return;
      (data || []).forEach(d => { if(d && d.signedUrl && paths.has(d.path)) SIGNED.set(paths.get(d.path), { url: d.signedUrl, until: Date.now() + 50 * 60000 }); });
    } catch(e) {}
  }
  if(epoch !== SIGN_SESSION_EPOCH || (getCurrentUser() && getCurrentUser().id) !== signedFor) return;
  if(need.size) document.querySelectorAll('img[src], video[src], audio[src], source[src], a[href]').forEach(el => {
    const attr = el.tagName === 'A' ? 'href' : 'src';
    const c = SIGNED.get(el.getAttribute(attr));
    if(c) el.setAttribute(attr, c.url);
  });
}
function scheduleSign(){
  if(SIGN_MAP.size && !signTimer) signTimer = setTimeout(resolveSignedMedia, 60);
}
// Chat typing, countdown updates and unrelated UI changes no longer scan every
// <a>, <img> and <video>. Only newly added media/link elements can need signing.
function signedMediaMutations(changes){
  if(!SIGN_MAP.size) return;
  const mediaSelector = 'img[src], video[src], audio[src], source[src], a[href]';
  for(const change of changes){
    for(const node of change.addedNodes){
      if(node.nodeType !== 1) continue;
      if((node.matches && node.matches(mediaSelector)) ||
         (node.querySelector && node.querySelector(mediaSelector))){
        scheduleSign(); return;
      }
    }
  }
}
try { new MutationObserver(signedMediaMutations).observe(document.body, { childList: true, subtree: true }); } catch(e) {}

    reportCrash('premium card: ' + ((err && (err.message || err.code)) || (m ? 'no client_premium config' : 'no data')), 'fillPremiumHomeCard');
  }
  // the card is always shown; the Premium screen itself checks everything on the server
  const cfg = (m && m.config && m.config.client_premium) || { price: 199 };
  const st = m ? premiumStatus(m) : 'inactive', price = Number(cfg.price) || 199, s = (m && m.subscription) || {};
  el.innerHTML = `<div class="card" style="display:flex; align-items:center; gap:12px; cursor:pointer;" onclick="nav('premiumScreen')">
    <div style="font-size:26px;">💎</div><div style="flex:1;"><b>Sphere Premium</b> ${subStateChip(st)}
      <p class="muted" style="font-size:12px; margin-top:2px;">${st === 'active' ? 'Active until ' + fmtDate(s.current_period_end) : 'Post Premium jobs for verified Pro editors · ₹' + price + '/month'}</p></div>
    <b style="color:var(--blue); font-size:13px;">${st === 'active' ? 'Manage' : 'See plan'} ›</b></div>`;
}
async function fillPjPremium(tries){

  if(!box){ if((tries || 0) < 15) setTimeout(() => fillPjPremium((tries || 0) + 1), 150); return; }

}

    <div class="card"><b>Your plan</b> ${subStateChip(st)}

      ${st === 'expired' ? `<p style="font-size:13px; margin-top:6px;">Expired on ${fmtDT(s.current_period_end)} — your open Premium jobs are now visible to all editors.</p>` : ''}
      ${st === 'failed' ? `<p style="font-size:12px; margin-top:6px; color:#c62828;">The last payment failed. Check your payment provider if money was debited before retrying.</p>` : ''}
      ${pending ? `<p style="font-size:12px; margin-top:6px;">⏳ UPI transaction ID <b>${esc(pending.utr)}</b> sent — Sphere is checking it.</p>` : ''}
      ${!pending && canBuy ? `<button class="btn btn-primary" style="margin-top:10px;" id="feePayBtn" onclick="payFee('client_premium', 'premiumScreen')">${st === 'active' ? 'Renew' : 'Get Premium'} — ₹${price}</button>${feeUpiBlock('client_premium', price)}`
        : (!pending && st === 'active' ? `<p class="muted" style="font-size:12px; margin-top:8px;">You can renew in the last ${renewDays} days before it ends.</p>` : '')}
    </div>
    <div class="card"><b>What you get</b>
      <div class="pro-ben"><span>✅</span><span>Post <b>Premium jobs</b> that only verified editors with Sphere Pro can see and bid on</span></div>
      <div class="pro-ben"><span>✅</span><span>Premium jobs are announced only to those editors</span></div>
      <div class="pro-ben"><span>✅</span><span>Free jobs, bids and choosing your editor work exactly as before</span></div></div>
    ${pays.length ? `<div class="card"><b>Payments</b>${pays.map(p => `<div class="earn-row"><span>${fmtDate(p.created_at)} · ${esc(p.method || '')}</span><span>${rupees(p.amount)} · ${esc(p.status)}</span></div>`).join('')}</div>` : ''}
  </div>`;
};

/* ============ PART 20.3: PROFILE & CONTACT ACCESS ============
   The phone number is never part of a profile response. Only sp_contact_status / sp_contact_unlock
   return it — and only after the server has an access grant (7 free per account, then ₹5 each,
   granted only when the payment is confirmed on the server). The locked number below is a fixed
   placeholder, not the real number hidden with CSS. Chat stays free and moderated as before. */
async function fillContactCard(tries){
  const box = document.getElementById('contactCard');
  if(!box){ if((tries || 0) < 15) setTimeout(() => fillContactCard((tries || 0) + 1), 150); return; }
  const id = currentEditorId;
  const { data: c, error } = await sb.rpc('sp_contact_status', { p_target: id });
  if(error || !c){ box.innerHTML = ''; return; }          // database not updated yet → nothing shown
  const price = Number(c.price) || 5, total = Number(c.free_total) || 7, left = Number(c.free_left) || 0;
  let body;
  if(c.unlocked && c.phone){
    const digits = String(c.phone).replace(/[^0-9+]/g, '');
    body = `<p style="font-size:18px; margin:6px 0;">📞 <a href="tel:${esc(digits)}" style="color:var(--blue);">${esc(c.phone)}</a></p>
      <p class="muted" style="font-size:12px;">Unlocked — you can see it any time, no extra charge.</p>`;
  } else if(!c.eligible){
    body = `<p class="phone-locked" aria-hidden="true">+91 ••••• •••••</p><p class="muted" style="font-size:12px;">${esc(c.reason || 'Not available.')}</p>`;
  } else if(c.pending_fee && c.pending_fee.utr){
    body = `<p class="phone-locked" aria-hidden="true">+91 ••••• •••••</p><p class="muted" style="font-size:12px;">⏳ Your payment is being checked.</p>`;
  } else {
    body = `<p class="phone-locked" aria-hidden="true">+91 ••••• •••••</p>
      <p class="muted" style="font-size:12px; margin-bottom:8px;">🎁 <b>${left}</b> of ${total} free contact accesses left</p>
      ${left > 0 ? `<button class="btn btn-primary" id="ccBtn" onclick="contactUnlock('${id}')">🔓 Unlock free (${left} left)</button>`
                 : `<button class="btn btn-primary" id="feePayBtn" onclick="contactPay('${id}')">🔓 Unlock for ₹${price}</button>`}`;
  }
  box.innerHTML = `<div class="card"><b>Chat &amp; Phone Number Access — ₹${price}</b>${body}</div>`;
}
async function contactUnlock(id){
  const btn = document.getElementById('ccBtn'); if(btn){ if(btn.disabled) return; btn.disabled = true; }
  const { data, error } = await sb.rpc('sp_contact_unlock', { p_target: id });
  if(error){ if(btn) btn.disabled = false; alert(friendlyError ? friendlyError(error) : error.message); return; }
  await fillContactCard(0);
}
async function contactPay(id){
  const btn = document.getElementById('feePayBtn'); if(btn){ if(btn.disabled) return; btn.disabled = true; }
  const { data, error } = await sb.rpc('sp_contact_pay_start', { p_target: id });
  if(error){ if(btn) btn.disabled = false; alert(error.message); return; }
  if(btn) btn.disabled = false;
  await payFee('contact_unlock', 'editorProfile', data);
}

/* ============ PART 18: PRODUCTION ============
   Crash reports go to sp_client_errors (the database removes phone numbers,
   emails and tokens; max 20 per person / 10 min). Admin → Overview shows them.
   A non-production build shows a banner so test data is never confused with real. */
let CRASH_SENT = 0;
const CRASH_SEEN = new Set();
function reportCrash(message, source, line, stack){
  try {
    const msg = String(message || '').slice(0, 500);
    if(!msg || CRASH_SENT >= 15 || CRASH_SEEN.has(msg)) return;
    if(/ResizeObserver loop|Script error\.?$|chrome-extension:|moz-extension:|safari-extension:/i.test(msg + ' ' + (source || ''))) return;
    CRASH_SEEN.add(msg); CRASH_SENT++;
    sb.from('sp_client_errors').insert({
      message: msg, source: String(source || '').slice(0, 300), line: Number(line) || null, stack: String(stack || '').slice(0, 3000),
      page: (typeof currentScreenName !== 'undefined' && currentScreenName) || location.pathname,
      app_version: SPHERE_CONFIG.appVersion, app_env: SPHERE_CONFIG.appEnv || 'production', ua: navigator.userAgent.slice(0, 160)
    }).then(() => {}, () => {});
  } catch(e) {}
}
window.addEventListener('error', (e) => reportCrash(e.message, e.filename, e.lineno, e.error && e.error.stack));
window.addEventListener('unhandledrejection', (e) => { const r = e.reason || {}; reportCrash(r.message || String(r), '', 0, r.stack); });

async function appErrorsCard(){
  try {
    const { data, error } = await sb.rpc('sp_admin_client_errors');
    if(error || !data) return '';
    const top = data.top || [];
    return `<details class="card" ${Number(data.last_24h) ? '' : ''}><summary><b>🐞 App errors in the last 24 h: ${Number(data.last_24h) || 0}</b></summary>
      ${top.length ? top.map(t => `<p style="font-size:12px; margin:8px 0;"><b>${t.n}×</b> ${esc(t.message)}<br><span class="muted">${t.people} people · v${esc(t.version || '?')} · last ${fmtDT(t.last_at)}</span></p>`).join('')
        : '<p class="muted" style="font-size:12px; margin-top:6px;">No crashes reported. 👍</p>'}
      <p class="muted" style="font-size:11px;">Phone numbers, emails and tokens are removed before saving. Kept 30 days.</p></details>`;
  } catch(e) { return ''; }
}
(function(){
  const envName = SPHERE_CONFIG.appEnv || 'production';
  if(envName === 'production') return;
  const show = () => {
    if(document.getElementById('envBanner')) return;
    const b = document.createElement('div');
    b.id = 'envBanner';
    b.textContent = envName.toUpperCase() + ' — test copy of Sphere · no real money';
    b.style.cssText = 'position:fixed; left:0; right:0; bottom:0; z-index:9998; background:#f59e0b; color:#111; font:700 11px Arial, sans-serif; text-align:center; padding:3px 6px calc(3px + env(safe-area-inset-bottom, 0px)); pointer-events:none;';
    document.body.appendChild(b);
  };
  if(document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();

(function(){
  const q = new URLSearchParams(window.location.search);
  const h = new URLSearchParams(window.location.hash.slice(1));
  const err = q.get('error_description') || h.get('error_description');
  if(err){ alert('Google login error: ' + err); }
})();
try { localStorage.removeItem('sphereDB'); } catch(e) {}
nav('splash');
